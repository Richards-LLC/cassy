# CAS Build Configuration

# Nested .cas worktrees inherit Cargo configs from their parent checkout.
# Explicitly reset jobs so a stale parent jobs=16 cap cannot survive here.
# Soundwave i9-13900K (32 threads), cold build on b86ec0c2e: jobs=16 took
# 107.0s (deps 53.5s, cas lib 52.8s); jobs=32 took 94.6s (deps 44.0s,
# cas lib 49.9s), 1156% CPU, max RSS 5.3 GB: 12% faster overall, 18% on deps.
# CARGO_BUILD_JOBS still overrides this default: cas-pty throttles workers,
# and assembly splits producers with CAS_RELEASE_GATE_ASSEMBLY_BUILD_JOBS.
[build]
jobs = "default"

# Prefer setting RUSTC_WRAPPER=sccache in shell/CI so builds don't hard-fail
# on machines without sccache installed.

[target.x86_64-unknown-linux-gnu]
linker = "gcc"
rustflags = [
    "-C", "target-cpu=x86-64",
    "-C", "link-arg=-fuse-ld=mold",
]

# The Rust target baseline is pinned above. Do not force a CFLAGS -march value
# here: GCC requires x86-64 while the Zig C compiler used for release builds
# requires x86_64. The cargo-zigbuild release invocation supplies the latter,
# and the release script audits the finished artifact's ISA.
