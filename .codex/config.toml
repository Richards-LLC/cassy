# =============================================================================
# CAS server (cas → cs rename for Codex harness; harness.rs maps mcp__cs__*
# back to mcp__cas__* so worker prompts use the same tool names as Claude)
# =============================================================================
[mcp_servers.cs]
command = "cas"
args = ["serve"]
env_vars = [
    "PATH",
    "HOME",
    "USER",
]

[mcp_servers.cs.env]
CAS_CODEX_FALLBACK_SESSION = "1"

# =============================================================================
# context7 — HTTP, custom header CONTEXT7_API_KEY (not Bearer).
# env_http_headers maps header-name → env-var-name; Codex resolves at startup.
# Requires: CONTEXT7_API_KEY set in the environment.
# =============================================================================
[mcp_servers.context7]
url = "https://mcp.context7.com/mcp"
env_http_headers = { CONTEXT7_API_KEY = "CONTEXT7_API_KEY" }

# =============================================================================
# github — HTTP, Bearer auth via GITHUB_TOKEN.
# bearer_token_env_var sends `Authorization: Bearer ${GITHUB_TOKEN}`.
# Requires: GITHUB_TOKEN set in the environment.
# =============================================================================
[mcp_servers.github]
url = "https://api.githubcopilot.com/mcp/"
bearer_token_env_var = "GITHUB_TOKEN"

# =============================================================================
# playwright — bundled with the hub-web lockfile, launched from the checkout
# root. Isolated headless contexts never share a persistent browser profile.
# Set PLAYWRIGHT_MCP_STORAGE_STATE to an explicit state file when auth is needed.
# =============================================================================
[mcp_servers.playwright]
command = "npx"
args = [
    "--prefix",
    "hub-web",
    "--no-install",
    "playwright",
    "mcp",
    "--isolated",
    "--headless",
    "--browser",
    "chromium",
    "--output-dir",
    "target/artifacts/playwright-mcp",
]
env_vars = [
    "PATH",
    "HOME",
    "USER",
    "PLAYWRIGHT_MCP_STORAGE_STATE",
]
