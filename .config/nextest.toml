# cargo-nextest configuration.
#
# cas-cli uses ten explicit integration harnesses to avoid linking its library
# once per source suite. Nextest runs each test in its own process, preserving
# isolation for tests that change env/cwd, and schedules one global pool.
# Plain cargo test must use -- --test-threads=1 for these shared harnesses.

[profile.default]
# NO RETRIES, deliberately. A retry policy turns a deterministic failure into an
# intermittent one and buys back exactly the "is it flaky or is it broken?"
# confusion that GH #136 cost a day to untangle. If a test is flaky, fix it.
retries = 0

# Report anything that has been running this long so a hang is visible as a hang
# rather than as a job timeout with no attribution.
slow-timeout = { period = "60s", terminate-after = 10 }

# Print the full output of failures at the end of the run instead of only the
# last one, so a CI log answers "what broke?" without a re-run.
failure-output = "immediate-final"
fail-fast = false

[profile.ci]
retries = 0
slow-timeout = { period = "60s", terminate-after = 10 }
failure-output = "immediate-final"
fail-fast = false
status-level = "fail"
final-status-level = "slow"

# The explicitly ignored disposable production probe owns a 15-minute
# lifecycle deadline plus bounded HTTP cleanup. Never select this in assembly.
[profile.live-presence]
retries = 0
slow-timeout = { period = "60s", terminate-after = 18 }
failure-output = "immediate-final"
fail-fast = false

[test-groups]
# Each hub integration test launches several large debug binaries and its own
# detached service. Bound macOS process-start contention while still running
# independent homes in parallel.
hub-process = { max-threads = 4 }

[[profile.default.overrides]]
filter = 'test(hub_clean_home_test::)'
platform = 'cfg(target_os = "macos")'
test-group = 'hub-process'
