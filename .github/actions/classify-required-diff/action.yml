name: Classify required CI diff
description: Fail-closed classification for required CI jobs.
inputs:
  base-sha:
    description: Commit on the base side of the comparison.
    required: true
  zero-base-ref:
    description: Trusted default-branch ref for new branches and factory delivery-range comparisons.
    required: false
    default: ""
outputs:
  comparison-base:
    description: Resolved merge base shared by change-scoped checks.
    value: ${{ steps.classify.outputs.comparison-base }}
  class:
    description: The conservative CI diff classification.
    value: ${{ steps.classify.outputs.class }}
  fast-pass:
    description: Whether the diff is Rust-unaffected (kept for existing callers).
    value: ${{ steps.classify.outputs.fast-pass }}
  rust-unaffected:
    description: Whether Rust builds, tests, doctests, and macOS checks may be skipped.
    value: ${{ steps.classify.outputs.rust-unaffected }}
  web-check-needed:
    description: Whether the Commander web build and tests must run.
    value: ${{ steps.classify.outputs.web-check-needed }}
  bridge-check-needed:
    description: Whether the Slack bridge build and tests must run.
    value: ${{ steps.classify.outputs.bridge-check-needed }}
  changed-files:
    description: Number of paths in the compared committed diff.
    value: ${{ steps.classify.outputs.changed-files }}
  fast-admission:
    description: Whether the diff fits the bounded fast scoped-validation tier.
    value: ${{ steps.classify.outputs.fast-admission }}
  fast-admission-reason:
    description: Why a diff was excluded from the bounded fast tier.
    value: ${{ steps.classify.outputs.fast-admission-reason }}
runs:
  using: composite
  steps:
    - id: classify
      shell: bash
      env:
        BASE_SHA: ${{ inputs.base-sha }}
        ZERO_BASE_REF: ${{ inputs.zero-base-ref }}
      run: |
        # checkout fetch-depth: 0 makes this a true merge-base comparison,
        # including an ancestry-only merge with no content changes.
        class=rust-touched
        merge_base=''
        if ! merge_base="$(scripts/resolve-ci-base.sh "$BASE_SHA" "$ZERO_BASE_REF")"; then
          echo "::warning title=CI diff base::Unknown or untrusted task parent; running Rust tier"
          merge_base=''
        elif ! class="$(scripts/classify-ci-diff.sh "$merge_base" HEAD)"; then
          echo "::warning title=CI diff class::Classifier failed; running Rust tier"
          class=rust-touched
        fi

        case "$class" in
          empty|docs-only|hub-web-only|slack-bridge-only|version-bump|rust-touched) ;;
          *)
            echo "::warning title=CI diff class::Unknown class '$class'; running Rust tier"
            class=rust-touched
            ;;
        esac

        rust_unaffected=false
        web_check_needed=true
        case "$class" in
          empty|docs-only|version-bump)
            rust_unaffected=true
            web_check_needed=false
            ;;
          hub-web-only)
            rust_unaffected=true
            ;;
          slack-bridge-only)
            rust_unaffected=true
            web_check_needed=false
            ;;
        esac

        # Web tests read hub-web/ plus named repo-level inputs (the journey
        # catalog, scripts/visual-qa.mjs, design tokens);
        # scripts/classify-web-inputs.py owns that list (cas-7822). A ci.yml-only
        # edit is not an input (cas-c846), nor is release plumbing (cas-a1b0).
        # Decide coverage by paths independently of
        # Rust's class, including Markdown fixtures. An unavailable diff or a
        # failed classifier must still run the checks.
        web_check_needed=true
        if [[ -n "${merge_base:-}" ]]; then
          if web_signal="$(python3 scripts/classify-web-inputs.py "$merge_base" HEAD)"; then
            [[ "$web_signal" != false ]] || web_check_needed=false
          else
            echo "::warning title=CI web check::Could not classify web test inputs; running their checks"
          fi
        fi
        if [[ "$web_check_needed" == true && "$class" == docs-only ]]; then
          # Job-level docs-only gates would otherwise skip this signaled work.
          class=hub-web-only
        fi

        # The Slack bridge is decided by changed paths, not by class: a mixed
        # Rust + bridge diff must still run the bridge's own tests. Uncertainty
        # runs them, matching the Rust tier's fail-closed default.
        bridge_check_needed=true
        if [[ -n "${merge_base:-}" ]]; then
          if bridge_diff="$(git diff --name-only "$merge_base" HEAD -- slack-bridge)"; then
            [[ -n "$bridge_diff" ]] || bridge_check_needed=false
          else
            echo "::warning title=CI bridge check::Could not diff slack-bridge; running its checks"
          fi
        else
          echo "::notice title=CI bridge check::No comparable base; running Slack bridge checks"
        fi

        printf 'comparison-base=%s\n' "$merge_base" >> "$GITHUB_OUTPUT"
        printf 'class=%s\n' "$class" >> "$GITHUB_OUTPUT"
        printf 'rust-unaffected=%s\n' "$rust_unaffected" >> "$GITHUB_OUTPUT"
        printf 'web-check-needed=%s\n' "$web_check_needed" >> "$GITHUB_OUTPUT"
        printf 'bridge-check-needed=%s\n' "$bridge_check_needed" >> "$GITHUB_OUTPUT"
        printf 'fast-pass=%s\n' "$rust_unaffected" >> "$GITHUB_OUTPUT"
        fast_admission=false
        fast_admission_reason='unavailable'
        changed_files=0
        if [[ -n "${merge_base:-}" ]]; then
          fast_summary="$(scripts/classify-fast-admission.sh "$merge_base" HEAD 2>&1 || true)"
          changed_files="$(printf '%s\n' "$fast_summary" | sed -n 's/.* files=\([0-9][0-9]*\) .*/\1/p')"
          changed_files="${changed_files:-0}"
          if [[ "$fast_summary" == *'eligible=true'* ]]; then
            fast_admission=true
            fast_admission_reason=none
          else
            fast_admission_reason="$(printf '%s\n' "$fast_summary" | sed -n 's/.* reason=//p' | tail -1)"
            fast_admission_reason="${fast_admission_reason:-classifier-rejected}"
          fi
        else
          fast_admission_reason='no-merge-base'
        fi
        printf 'changed-files=%s\n' "$changed_files" >> "$GITHUB_OUTPUT"
        printf 'fast-admission=%s\n' "$fast_admission" >> "$GITHUB_OUTPUT"
        printf 'fast-admission-reason=%s\n' "$fast_admission_reason" >> "$GITHUB_OUTPUT"
        if [[ "$fast_admission" == true ]]; then
          echo "::notice title=CI fast admission::${changed_files} changed file(s) fit the bounded fast tier"
        else
          echo "::notice title=CI full scoped admission::fast tier not selected (${fast_admission_reason})"
        fi
        if [[ "$rust_unaffected" == true ]]; then
          echo "::notice title=CI Rust short-circuit::Diff class '$class' is Rust-unaffected"
        else
          echo "::notice title=CI Rust tier::Diff class '$class' runs the full Rust tier"
        fi
