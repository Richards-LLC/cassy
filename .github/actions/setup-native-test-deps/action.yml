name: Setup native test dependencies
description: Install bubblewrap for real Linux verifier sandbox tests.
runs:
  using: composite
  steps:
    - name: Install bubblewrap when absent
      shell: bash
      run: |
        if ! command -v bwrap >/dev/null; then
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y bubblewrap
        fi
        bwrap --version
