name: Setup Rust (Linux)
description: >-
  Shared toolchain setup for every ubuntu-latest CI job: apt deps aligned with
  .cargo/config.toml, repository-pinned Rust, Zig (ghostty_vt_sys builds its native library
  with Zig even for cargo check), sccache, and the cargo cache.

inputs:
  toolchain-only:
    description: Prepare the self-hosted Cargo PATH without linker, Zig or cache work.
    default: "false"
  cache-key:
    description: >-
      Discriminator appended to the cargo cache key. Jobs that compile a
      DIFFERENT profile or feature set must pass a distinct value so they do not
      evict each other's artifacts through one shared key.
    required: true
  shared-key:
    description: Explicit cache job identity shared by compatible producers and consumers; replaces cache-key identity.
    required: false
    default: ""
  cache-on-failure:
    description: Save partial dependencies after failure or cancellation; disable for exact-hit priming.
    required: false
    default: "true"
  cache-save-if:
    description: Allow cache writes independently of target restoration.
    required: false
    default: "true"
  save-cache:
    description: >-
      Set to "false" for jobs that run `cargo clean` mid-job. Saving from such a
      job persists an empty target dir and makes every subsequent run pay a cold
      build (see the Build Benchmark job).
    required: false
    default: "true"

outputs:
  cache-hit:
    description: Whether an exact dependency cache entry was restored.
    value: ${{ steps.cargo-cache.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - name: Prepare self-hosted Rust
      id: self-hosted-rust
      if: runner.environment == 'self-hosted'
      shell: bash
      env:
        LANE_TEMP_ROOT: /var/tmp
      run: |
        # PrivateTmp is RAM-backed on the local listeners. Keep compiler,
        # test and installer temporaries in its disk-backed /var/tmp view,
        # outside both the checkout and service HOME's CAS state. These short
        # paths leave room for fixture Unix-domain socket names.
        export TMPDIR="$LANE_TEMP_ROOT/t"
        export CARGO_TARGET_TMPDIR="$LANE_TEMP_ROOT/ct"
        mkdir -p "$TMPDIR" "$CARGO_TARGET_TMPDIR"
        printf 'TMPDIR=%s\nCARGO_TARGET_TMPDIR=%s\n' "$TMPDIR" "$CARGO_TARGET_TMPDIR" >> "$GITHUB_ENV"
        export CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}"
        export RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}"
        export PATH="$CARGO_HOME/bin:$PATH"
        printf '%s\n' "$CARGO_HOME/bin" >> "$GITHUB_PATH"
        printf 'CARGO_HOME=%s\nRUSTUP_HOME=%s\n' "$CARGO_HOME" "$RUSTUP_HOME" >> "$GITHUB_ENV"
        # Runner .path snapshots can omit Cargo even when the service PATH
        # includes it. Serialize first-use rustup writes across listeners.
        mkdir -p "$CARGO_HOME" "$RUSTUP_HOME"
        exec 9>"$RUSTUP_HOME/cassy-rustup.lock"
        flock -x 9
        if ! "$CARGO_HOME/bin/cargo" --version; then
          if [[ ! -x "$CARGO_HOME/bin/rustup" ]]; then
            installer="$(mktemp "$TMPDIR/rustup-init.XXXXXX")"
            trap 'rm -f "$installer"' EXIT
            curl --fail --location --proto '=https' --tlsv1.2 https://sh.rustup.rs -o "$installer"
            sh "$installer" -y --profile minimal --default-toolchain none --no-modify-path
          fi
          channel="$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')"
          "$CARGO_HOME/bin/rustup" toolchain install "$channel" --profile minimal --component clippy --component rustfmt
          "$CARGO_HOME/bin/cargo" --version
        fi
        # The prebuilt installer uses HOME/.install-action/tmp, shared by all
        # local listeners. Prepare nextest once under this same setup lock.
        if ! cargo nextest --version; then
          version="$(python3 -c 'import tomllib; print(tomllib.load(open(".config/nextest.toml", "rb"))["nextest-version"]["recommended"])')"
          cargo install cargo-nextest --locked --version "$version" --target-dir "$TMPDIR/nextest-build"
          cargo nextest --version
        fi

    - name: Install dependencies
      if: inputs.toolchain-only != 'true'
      uses: ./.github/actions/setup-linux-linker

    - name: Install Zig
      if: inputs.toolchain-only != 'true'
      shell: bash
      run: ./scripts/bootstrap-zig.sh

    - name: Setup sccache
      if: inputs.toolchain-only != 'true' && env.RUSTC_WRAPPER != ''
      # v0.0.5 speaks GitHub's retired cache-service protocol and silently
      # fell back to a runner-local cache (0 hits across repeated CI runs).
      # v0.0.9+ uses ACTIONS_RESULTS_URL/ACTIONS_RUNTIME_TOKEN (cache v2).
      # Cache infrastructure must not make a source-only change fail CI: the
      # probe below disables the wrapper if downloading sccache itself fails.
      id: setup-sccache
      continue-on-error: true
      uses: mozilla-actions/sccache-action@v0.0.11

    - name: Probe sccache backend
      if: inputs.toolchain-only != 'true' && env.RUSTC_WRAPPER != ''
      shell: bash
      run: |
        if [[ "${{ steps.setup-sccache.outcome }}" != "success" ]] || ! sccache --start-server; then
          echo "::warning::sccache backend unavailable — building uncached"
          echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"
          echo "SCCACHE_GHA_ENABLED=false" >> "$GITHUB_ENV"
          echo "SCCACHE_PATH=$GITHUB_WORKSPACE/scripts/sccache-unavailable.sh" >> "$GITHUB_ENV"
        fi

    - name: Cache cargo
      if: inputs.toolchain-only != 'true'
      id: cargo-cache
      uses: Swatinem/rust-cache@v2
      with:
        key: ${{ inputs.cache-key }}
        shared-key: ${{ inputs.shared-key }}
        # Cold-build measurements immediately clean target; retain only the
        # registry cache instead of restoring binaries with no consumer.
        cache-targets: ${{ inputs.save-cache }}
        cache-on-failure: ${{ inputs.cache-on-failure }}
        save-if: ${{ inputs.save-cache == 'true' && inputs.cache-save-if == 'true' }}
