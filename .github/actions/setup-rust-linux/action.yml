name: Setup Rust (Linux)
description: >-
  Shared toolchain setup for every ubuntu-latest CI job: apt deps aligned with
  .cargo/config.toml, repository-pinned Rust, Zig (ghostty_vt_sys builds its native library
  with Zig even for cargo check), sccache, and the cargo cache.

inputs:
  cache-key:
    description: >-
      Discriminator appended to the cargo cache key. Jobs that compile a
      DIFFERENT profile or feature set must pass a distinct value so they do not
      evict each other's artifacts through one shared key.
    required: true
  shared-key:
    description: Explicit cache job identity shared by compatible producers and consumers; replaces cache-key identity.
    required: false
    default: ""
  cache-on-failure:
    description: Save partial dependencies after failure or cancellation; disable for exact-hit priming.
    required: false
    default: "true"
  cache-save-if:
    description: Allow cache writes independently of target restoration.
    required: false
    default: "true"
  save-cache:
    description: >-
      Set to "false" for jobs that run `cargo clean` mid-job. Saving from such a
      job persists an empty target dir and makes every subsequent run pay a cold
      build (see the Build Benchmark job).
    required: false
    default: "true"

outputs:
  cache-hit:
    description: Whether an exact dependency cache entry was restored.
    value: ${{ steps.cargo-cache.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - name: Install dependencies
      shell: bash
      run: |
        sudo apt-get update
        # Keep this aligned with .cargo/config.toml's gcc + mold toolchain.
        sudo apt-get install -y gcc mold
        gcc --version
        mold --version

    - name: Install Zig
      shell: bash
      run: ./scripts/bootstrap-zig.sh

    - name: Setup sccache
      if: env.RUSTC_WRAPPER != ''
      # v0.0.5 speaks GitHub's retired cache-service protocol and silently
      # fell back to a runner-local cache (0 hits across repeated CI runs).
      # v0.0.9+ uses ACTIONS_RESULTS_URL/ACTIONS_RUNTIME_TOKEN (cache v2).
      # Cache infrastructure must not make a source-only change fail CI: the
      # probe below disables the wrapper if downloading sccache itself fails.
      id: setup-sccache
      continue-on-error: true
      uses: mozilla-actions/sccache-action@v0.0.11

    - name: Probe sccache backend
      if: env.RUSTC_WRAPPER != ''
      shell: bash
      run: |
        if [[ "${{ steps.setup-sccache.outcome }}" != "success" ]] || ! sccache --start-server; then
          echo "::warning::sccache backend unavailable — building uncached"
          echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"
          echo "SCCACHE_GHA_ENABLED=false" >> "$GITHUB_ENV"
          echo "SCCACHE_PATH=$GITHUB_WORKSPACE/scripts/sccache-unavailable.sh" >> "$GITHUB_ENV"
        fi

    - name: Cache cargo
      id: cargo-cache
      uses: Swatinem/rust-cache@v2
      with:
        key: ${{ inputs.cache-key }}
        shared-key: ${{ inputs.shared-key }}
        # Cold-build measurements immediately clean target; retain only the
        # registry cache instead of restoring binaries with no consumer.
        cache-targets: ${{ inputs.save-cache }}
        cache-on-failure: ${{ inputs.cache-on-failure }}
        save-if: ${{ inputs.save-cache == 'true' && inputs.cache-save-if == 'true' }}
