name: CI

# ┌───────────────────────────────────────────────────────────────────────────┐
# │ WHAT EXECUTES THE TEST SUITE: the `Fast Validation — suite shard` jobs.  │
# │ Every other job in this file compiles things, fans in results, or runs a  │
# │ narrow, named subset. Read job names literally; they stay honest (#138). │
# └───────────────────────────────────────────────────────────────────────────┘
#
# Wall-clock shape (GH #142): total run time is max(job), not sum(job), so the
# jobs below are deliberately fanned out rather than chained inside one job.
# The four release/benchmark workloads used to run in series in a single job
# and cost ~51m; they are independent and now run concurrently.
#
# COMPILER CACHE CONTRACT (cas-67a2). Every job here that compiles Rust must:
#   1. configure the GitHub cache-v2 sccache backend — the workflow-level env
#      below does that for all of them, and only `build-benchmark` opts out; and
#   2. end with a `Report sccache stats` step calling
#      scripts/ci-sccache-summary.sh, so each job's hit rate is visible in its
#      job summary instead of buried in a log nobody greps.
# Warm lanes measured 90-92% hits while pre-cache-v2 lanes measured 0-6%; that
# difference is worth minutes per run and used to be invisible. The stats step
# is observability only — it always exits 0 and can never redden a lane.
# `build-benchmark` is the cold-build deliberately uncached compiling job: it
# measures a cold compiler, so it gets neither the backend nor a stats step.
# The self-hosted suite archive is the separate, merge-queue-gated exception:
# cas-065a clears its wrapper after the fail-open cache probe so an outage
# cannot block the lane.
# scripts/test-ci-test-tiers.sh pins all of this.

on:
  pull_request:
  # The protected-default merge queue creates a synthetic merged-tree ref. Its
  # required contexts must report on that ref or queue entries time out rather
  # than proving the tree that will actually land.
  merge_group:
  # cas-32e9: factory/** pushes start in lane.yml. A slim lane runs there
  # alone; with CAS_LANE_SLIM unset, lane.yml calls this workflow, so the
  # factory conditions below still apply to those pushes.
  workflow_call:
  push:
    branches:
      - main
      - staging
      - "epic/**"
    tags:
      - "v*"
  schedule:
    - cron: "0 8 * * 1"
  # Manual trigger. Without this a run cannot be forced from the CLI or API,
  # which matters on a fork: Actions start disabled and the first run can only
  # arrive via a push, a PR, or the weekly cron.
  workflow_dispatch:

# cas-12ab: a newer push to the same factory/* branch cancels the run it
# supersedes (one worker pushed 6 times in 31 minutes: 12 workflow runs). Every
# other event gets a group of its own (the run id), so main, epic, tag, merge
# queue, PR, schedule and manual runs are never queued or cancelled by this.
concurrency:
  group: ${{ startsWith(github.ref, 'refs/heads/factory/') && format('ci-factory-{0}', github.ref) || format('ci-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/heads/factory/') }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTC_WRAPPER: sccache
  # The action supplies GitHub cache-v2 credentials. Keep one explicit CAS
  # namespace so every CI job can reuse identical compiler objects.
  SCCACHE_GHA_ENABLED: "true"
  SCCACHE_GHA_VERSION: "cas-v2"

permissions:
  contents: read
  actions: read

jobs:
  # One fail-closed classifier feeds every event-specific job gate. Keeping
  # this as a job (rather than a step) lets docs-only merge-group trees skip
  # runner allocation for the full validation family while still producing a
  # cheap docs check.
  ci-diff:
    name: Classify CI diff
    runs-on: ubuntu-latest
    outputs:
      comparison-base: ${{ steps.classify-diff.outputs.comparison-base }}
      class: ${{ steps.classify-diff.outputs.class }}
      docs-only: ${{ steps.classify-diff.outputs.class == 'docs-only' }}
      rust-unaffected: ${{ steps.classify-diff.outputs.rust-unaffected }}
      web-check-needed: ${{ steps.classify-diff.outputs.web-check-needed }}
      bridge-check-needed: ${{ steps.classify-diff.outputs.bridge-check-needed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - id: classify-diff
        uses: ./.github/actions/classify-required-diff
        with:
          base-sha: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          zero-base-ref: origin/${{ github.event.repository.default_branch }}

      # Move the repository scan out of the expensive queue script tier. This
      # existing admission job covers factory and direct epic pushes plus PRs
      # (including release branches) before a merge-group can be admitted.
      - name: Check Violet references before queue admission
        if: github.event_name != 'merge_group'
        run: bash scripts/test-no-mecha-references.sh

  # Docs-only changes keep the existing branch-protection contexts satisfiable without
  # paying for Rust, web, or Darwin work. The full validation jobs remain the
  # required path for mixed and code changes; this is the only job that does
  # work for a docs-only PR, push, or merge-group tree.
  docs-lint:
    name: Docs Lint
    if: >-
      needs.ci-diff.outputs.class == 'docs-only'
      && (github.event_name == 'pull_request'
      || github.event_name == 'merge_group'
      || github.event_name == 'push')
    needs: ci-diff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Run no-build release gate rows
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/factory/') && vars.CAS_LANE_SLIM != 'true'
        env:
          BASE_SHA: ${{ needs.ci-diff.outputs.comparison-base || github.event.before }}
          ZERO_BASE_REF: origin/${{ github.event.repository.default_branch }}
        run: |
          # The pinned markdownlint-cli2 (root package-lock.json); scripts/markdownlint.py runs it.
          npm ci --no-audit --no-fund
          comparison_base="$BASE_SHA"
          if [[ -z "$comparison_base" || "$comparison_base" =~ ^0+$ ]]; then
            comparison_base="$ZERO_BASE_REF"
          fi
          ./scripts/release-gate.sh --fast-rows --base "$comparison_base"

      - name: Markdown lint
        if: vars.CAS_LANE_SLIM != 'true' || github.event_name != 'push' || !startsWith(github.ref, 'refs/heads/factory/')
        env:
          BASE_SHA: ${{ needs.ci-diff.outputs.comparison-base || github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          ZERO_BASE_REF: origin/${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          comparison_base="$BASE_SHA"
          if [[ "$comparison_base" =~ ^0+$ && -n "$ZERO_BASE_REF" ]]; then
            comparison_base="$ZERO_BASE_REF"
          fi
          merge_base="$(git merge-base "$comparison_base" HEAD)"
          mapfile -t markdown_files < <(
            git diff --name-only "$merge_base" HEAD |
              while IFS= read -r path; do
                case "$path" in
                  *.md) printf '%s\n' "$path" ;;
                esac
              done
          )
          if (( ${#markdown_files[@]} == 0 )); then
            echo 'No Markdown files changed; docs-only paths are still valid.'
          else
            python3 scripts/markdownlint.py --config .markdownlint-cli2.jsonc "${markdown_files[@]}"
          fi

      - name: Validate release-note drafts
        if: vars.CAS_LANE_SLIM != 'true' || github.event_name != 'push' || !startsWith(github.ref, 'refs/heads/factory/')
        env:
          BASE_SHA: ${{ needs.ci-diff.outputs.comparison-base || github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          ZERO_BASE_REF: origin/${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          comparison_base="$BASE_SHA"
          if [[ "$comparison_base" =~ ^0+$ && -n "$ZERO_BASE_REF" ]]; then
            comparison_base="$ZERO_BASE_REF"
          fi
          merge_base="$(git merge-base "$comparison_base" HEAD)"
          mapfile -t drafts < <(
            git diff --name-only "$merge_base" HEAD |
              while IFS= read -r path; do
                case "$path" in
                  docs/release-notes/*draft*.md) printf '%s\n' "$path" ;;
                esac
              done
          )
          if (( ${#drafts[@]} == 0 )); then
            echo 'No release-note drafts changed.'
          else
            for draft in "${drafts[@]}"; do
              body_dir="$(mktemp -d)"
              python3 scripts/release-train-announce.py --validate "$draft" "$body_dir"
              rm -rf "$body_dir"
            done
          fi

      # CLAUDE.md is Markdown, so a CLAUDE.md-only edit is docs-only and never
      # reaches the Rust suite's agents_md_sync_test. The generated AGENTS.md
      # went stale that way for a week (skills audit L6 F7). A docs-only tree
      # has the same generator as its base, so the latest published binary
      # renders it faithfully without a Rust build here.
      - name: Instruction files are current and within the size cap
        env:
          GH_TOKEN: ${{ github.token }}
          CAS_SKIP_FACTORY_TOOLING: "1"
        run: |
          set -euo pipefail
          # Grok truncates each instruction file at 10,000 characters.
          for file in AGENTS.md CLAUDE.md; do
            chars="$(wc -m < "$file")"
            if (( chars >= 10000 )); then
              echo "::error file=$file::$file is $chars characters; Grok truncates at 10,000"
              exit 1
            fi
          done
          # A CLAUDE.md that imports @AGENTS.md makes AGENTS.md canonical
          # (skills audit D3): there is nothing generated to compare.
          if grep -qx '@AGENTS.md' CLAUDE.md; then
            echo 'AGENTS.md is canonical (CLAUDE.md imports it).'
            exit 0
          fi
          bin_dir="$RUNNER_TEMP/cas-bin"
          mkdir -p "$bin_dir" "$RUNNER_TEMP/cas-home"
          gh release download --repo "$GITHUB_REPOSITORY" \
            --pattern cas-x86_64-unknown-linux-gnu.tar.gz --dir "$RUNNER_TEMP"
          tar -xzf "$RUNNER_TEMP/cas-x86_64-unknown-linux-gnu.tar.gz" -C "$bin_dir"
          HOME="$RUNNER_TEMP/cas-home" "$bin_dir/cas" sync agents-md --check

  # GitHub Actions cannot fall back after it has assigned an offline
  # self-hosted runner: the job would simply remain queued. Select the runner
  # before assignment instead. The repository variable is deliberately
  # opt-in; its absent/disabled state is the fail-safe hosted path used before
  # maintenance or whenever the runner's health is not established.
  #
  # This job never checks out the merge-queue tree and only selects a label.
  # Therefore fork/pull-request code cannot use the persistent runner. The
  # actual archive job repeats the merge_group-only guard before it compiles.
  fast-validation-runner-route:
    name: Fast Validation — merge-queue runner route
    if: >-
      needs.ci-diff.outputs.class != 'docs-only'
      && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
      || github.event_name == 'merge_group'
      || (github.event_name == 'push'
      && (github.ref == 'refs/heads/main'
      || startsWith(github.ref, 'refs/tags/'))))
    needs: ci-diff
    runs-on: ubuntu-latest
    outputs:
      runner: ${{ steps.route.outputs.runner }}
      mode: ${{ steps.route.outputs.mode }}
    steps:
      - id: route
        env:
          EVENT_NAME: ${{ github.event_name }}
          SELF_HOSTED_ENABLED: ${{ vars.CASSY_MERGE_QUEUE_SELF_HOSTED }}
        run: |
          if [[ "$EVENT_NAME" == merge_group && "$SELF_HOSTED_ENABLED" == enabled ]]; then
            echo 'runner=["self-hosted","Linux","X64","cas-ci-32core"]' >> "$GITHUB_OUTPUT"
            echo 'mode=self-hosted' >> "$GITHUB_OUTPUT"
          else
            echo 'runner=["ubuntu-latest"]' >> "$GITHUB_OUTPUT"
            echo 'mode=hosted' >> "$GITHUB_OUTPUT"
          fi

  # A merge queue validates a synthetic tree, then GitHub pushes that exact
  # tree to main. Re-running the Fast Validation family on that push wastes
  # hosted capacity without adding coverage. This gate is fail-closed: direct
  # pushes, bypass merges, lookup failures, and any different tree run the
  # complete suite normally.
  fast-validation-main-push-dedupe:
    name: Fast Validation — main-push tree dedupe
    if: >-
      needs.ci-diff.outputs.class != 'docs-only'
      && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
      || github.event_name == 'merge_group'
      || (github.event_name == 'push'
      && (github.ref == 'refs/heads/main'
      || startsWith(github.ref, 'refs/tags/'))))
    needs: ci-diff
    runs-on: ubuntu-latest
    outputs:
      run-fast-validation: ${{ steps.tree-dedupe.outputs.run-fast-validation }}
      validating-run-id: ${{ steps.tree-dedupe.outputs.validating-run-id }}
      prior-run-url: ${{ steps.tree-dedupe.outputs.prior-run-url }}
      reuse-source: ${{ steps.tree-dedupe.outputs.reuse-source }}
      journeys-reuse: ${{ steps.tree-dedupe.outputs.journeys-reuse }}
      journeys-prior-url: ${{ steps.tree-dedupe.outputs.journeys-prior-url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      # cas-4cb8: on merge_group this also accepts the release train's
      # full-gate receipt for the exact queue tree, and (cas-9f70) its
      # full-journeys receipt for the same tree (see
      # docs/branch-protection/README.md, "Merge-queue full-gate reuse").
      - id: tree-dedupe
        name: Check for successful merge-queue validation of this tree
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/check-ci-merge-queue-validation.sh

  # Factory pushes and PRs that do not target the protected default branch get
  # one cheap target-scoped lane. Main PRs use the full required lanes below;
  # do not spend an additional runner on this redundant subset there.
  #
  # MERGE-LATENCY CONTRACT (cas-3e14). This lane is not a required check, but it
  # is the last check to report on a factory PR, so a merge that waits for all
  # checks waits for this one. Measured on PR #479: the push-event copy of this
  # job spent 4m39s in `cargo check` and 3m49s in the scoped test binary on a
  # docs-only diff — 8m28s of Rust work the required lanes had already
  # classified as unnecessary — and the PR merged 9 seconds after it finished.
  # Two things keep that from recurring, both fail-closed:
  #   1. the same shared diff classifier the required lanes use, so a
  #      Rust-unaffected diff skips Rust work here too; and
  #   2. a dedupe gate that stands down only when an open PR's head is exactly
  #      this SHA, i.e. the PR event is validating the identical commit.
  # The factory/** push trigger itself stays. Factory branches are integrated
  # into epic branches by a supervisor `git merge --no-ff` with no PR, so this
  # push lane is the only validation those commits ever get; removing it would
  # create a merge path with no validation at all.
  # cas-eac2 (operator D1, D2): repository variable CAS_LANE_SLIM, off by
  # default. Off, lanes run as before. 'true' runs the no-build fast rows
  # once in lane.yml and drops broad Rust tests from factory pushes. Park
  # reads focused-test receipts; local fast-row receipts are only feedback.
  # PRs are unaffected, and unsetting the variable is the one-setting rollback.
  # Factory pushes under the small-delta policy use the mapped proof surface
  # only. The release train can accept this exact job, or a supervisor's
  # equivalent --proof receipt, without waiting for the full scoped lane.
  scoped-validation-fast:
    name: Scoped Validation (fast)
    if: >-
      needs.ci-diff.outputs.class != 'docs-only'
      && github.event_name == 'push'
      && startsWith(github.ref, 'refs/heads/factory/')
    needs: ci-diff
    permissions:
      contents: read
      actions: read
    concurrency:
      group: scoped-validation-fast-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # A slim factory push builds nothing that needs the submodules.
          submodules: ${{ vars.CAS_LANE_SLIM == 'true' && 'false' || 'recursive' }}
          fetch-depth: 0
          ref: ${{ github.sha }}

      - id: classify-diff
        uses: ./.github/actions/classify-required-diff
        with:
          base-sha: ${{ github.event.before }}
          zero-base-ref: origin/${{ github.event.repository.default_branch }}

      # This cheap step runs even when builds route to the full tier or a PR.
      - name: Run no-build release gate rows
        if: vars.CAS_LANE_SLIM != 'true'
        env:
          BASE_SHA: ${{ steps.classify-diff.outputs.comparison-base || github.event.pull_request.base.sha || github.event.before }}
          ZERO_BASE_REF: origin/${{ github.event.repository.default_branch }}
        run: |
          # The pinned markdownlint-cli2 (root package-lock.json); scripts/markdownlint.py runs it.
          npm ci --no-audit --no-fund
          comparison_base="$BASE_SHA"
          if [[ -z "$comparison_base" || "$comparison_base" =~ ^0+$ ]]; then
            comparison_base="$ZERO_BASE_REF"
          fi
          ./scripts/release-gate.sh --fast-rows --base "$comparison_base"

      - name: Detect runner lock fixture changes
        id: runner-lock-diff
        env:
          BASE_SHA: ${{ steps.classify-diff.outputs.comparison-base || github.event.pull_request.base.sha || github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          runner_base="$BASE_SHA"
          if [[ -z "$runner_base" || "$runner_base" =~ ^0+$ ]] \
            || ! git rev-parse --verify --quiet "$runner_base^{commit}" >/dev/null; then
            runner_base="$(git merge-base HEAD origin/$DEFAULT_BRANCH)"
          fi
          changed=false
          changed_paths="$(git diff --name-only "$runner_base" HEAD -- \
            'scripts/cassy-actions-*' 'scripts/test-cassy-actions-*' \
            'scripts/install-cassy-actions-runner.sh')"
          if [[ -n "$changed_paths" ]]; then
            changed=true
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Test runner cache job lock lifecycle
        if: steps.runner-lock-diff.outputs.changed == 'true'
        run: ./scripts/test-cassy-actions-cache-job-lock.sh

      - name: Test runner repository registration arguments
        if: steps.runner-lock-diff.outputs.changed == 'true'
        run: ./scripts/test-cassy-actions-runner-registration.sh

      - name: Report full-tier routing
        if: steps.classify-diff.outputs.fast-admission != 'true'
        env:
          FAST_ADMISSION_REASON: ${{ steps.classify-diff.outputs.fast-admission-reason }}
        run: >-
          echo "Fast tier skipped: $FAST_ADMISSION_REASON;
          Scoped Validation (factory/PR) owns this delta."

      # Node test inputs can live outside the package (e.g. visual-qa.mjs).
      # Both scoped tiers consume the path signal before accepting a lane.
      - name: Typecheck and test Commander web assets
        if: >-
          steps.classify-diff.outputs.fast-admission == 'true'
          && steps.classify-diff.outputs.web-check-needed == 'true'
        working-directory: hub-web
        run: |
          npm ci
          npm run typecheck
          npm test

      - name: Build and test the Slack bridge
        if: >-
          steps.classify-diff.outputs.fast-admission == 'true'
          && steps.classify-diff.outputs.bridge-check-needed == 'true'
        working-directory: slack-bridge
        run: |
          npm ci
          npm test
          npm run build

      - uses: ./.github/actions/setup-rust-linux
        if: >-
          steps.classify-diff.outputs.fast-admission == 'true'
          && steps.classify-diff.outputs.rust-unaffected != 'true'
          && vars.CAS_LANE_SLIM != 'true'
        with:
          cache-key: scoped-validation-fast

      - name: Install nextest
        if: >-
          steps.classify-diff.outputs.fast-admission == 'true'
          && steps.classify-diff.outputs.rust-unaffected != 'true'
          && vars.CAS_LANE_SLIM != 'true'
        uses: taiki-e/install-action@nextest

      - name: Run change-scoped tests with impact evidence
        if: >-
          steps.classify-diff.outputs.fast-admission == 'true'
          && steps.classify-diff.outputs.rust-unaffected != 'true'
          && vars.CAS_LANE_SLIM != 'true'
        env:
          BASE_SHA: ${{ steps.classify-diff.outputs.comparison-base || github.event.before }}
          ZERO_BASE_REF: origin/${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          ZIG: ${{ github.workspace }}/.context/zig/zig
        run: |
          if [[ -f scripts/cas-test-targets.py ]]; then
            python3 scripts/cas-test-targets.py cas-cli --check
          fi
          if [[ -x scripts/ci-test-impact.py ]]; then
            python3 scripts/ci-test-impact.py history
            python3 scripts/ci-test-impact.py run
          else
            scripts/run-verified-tests.sh nextest run --workspace --no-fail-fast
          fi

      - name: Publish CI impact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-test-impact-${{ github.run_id }}-scoped-fast
          path: target/ci-impact/
          if-no-files-found: ignore

      - name: Test snapshot-pinned CLI output surfaces
        if: >-
          steps.classify-diff.outputs.fast-admission == 'true'
          && steps.classify-diff.outputs.rust-unaffected != 'true'
          && vars.CAS_LANE_SLIM != 'true'
        env:
          BASE_SHA: ${{ steps.classify-diff.outputs.comparison-base || github.event.before }}
          ZERO_BASE_REF: origin/${{ github.event.repository.default_branch }}
        run: scripts/check-scoped-snapshot-tests.sh --base-sha "$BASE_SHA" --zero-base-ref "$ZERO_BASE_REF"

      - name: Report Rust test ownership
        if: >-
          vars.CAS_LANE_SLIM == 'true'
          && steps.classify-diff.outputs.rust-unaffected != 'true'
        run: >-
          echo "No Rust tests ran here: worker focused-test receipts at this
          SHA (checked at park) and the merge-queue full suite own them."
          >> "$GITHUB_STEP_SUMMARY"

      - name: Report sccache stats
        # A slim factory push compiles nothing; there is no cache to report.
        if: always() && vars.CAS_LANE_SLIM != 'true'
        run: |
          if [[ -x ./scripts/ci-sccache-summary.sh ]]; then
            ./scripts/ci-sccache-summary.sh "Scoped Validation (fast)"
          else
            echo "::notice title=sccache stats::scripts/ci-sccache-summary.sh is absent at this checkout; skipping cache reporting."
          fi

  scoped-validation:
    name: Scoped Validation (factory/PR)
    if: >-
      needs.ci-diff.outputs.class != 'docs-only'
      && ((github.event_name == 'pull_request'
      && github.base_ref != github.event.repository.default_branch)
      || (github.event_name == 'push'
      && startsWith(github.ref, 'refs/heads/factory/')))
    needs: ci-diff
    permissions:
      contents: read
      actions: read
      # Read-only PR metadata for the dedupe gate below. Nothing writes.
      pull-requests: read
    # cas-59d3: key on the PULL REQUEST (falling back to the branch ref for
    # push events) and cancel superseded runs. Keying on the head SHA put every
    # push in its own group, so a rapid second push left the first run's full
    # validation consuming runners for work that could never be merged —
    # measured on PR #482, where macOS Check sat queued ~5min and the suite
    # archive build ~8min behind superseded runs of the same PR. Cancelling is
    # safe for required checks: merging requires the checks on the PR's CURRENT
    # head, which the newest run supplies, and a cancelled run always belonged
    # to a head that can no longer be merged. Keying by ref for pushes means a
    # factory branch only ever cancels its own older commit, never another
    # branch's.
    concurrency:
      group: scoped-validation-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # A slim factory push builds nothing that needs the submodules.
          submodules: ${{ (github.event_name == 'push' && vars.CAS_LANE_SLIM == 'true') && 'false' || 'recursive' }}
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      # Stand down only when the PR event is already validating this exact
      # commit: for a default-branch PR that is the strictly stronger required
      # Fast Validation tier, and for an epic-targeted PR it is this same lane.
      # Anything else — no PR, a PR whose head has moved on, an unparseable
      # answer, or an API failure — runs the lane. The guard absorbs those cases
      # itself and always exits 0, so it deliberately does NOT fail open with
      # `continue-on-error`: a guard that genuinely broke should redden this
      # lane rather than quietly decide for itself.
      - id: pr-dedupe
        name: Skip when a pull request event validates this head SHA
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/check-ci-pr-event-coverage.sh

      - id: classify-diff
        if: steps.pr-dedupe.outputs.covered != 'true'
        uses: ./.github/actions/classify-required-diff
        with:
          base-sha: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          # First factory pushes resolve their shared epic parent; unknown
          # or ambiguous parents fail closed in the common classifier.
          zero-base-ref: origin/${{ github.event.repository.default_branch }}

      # Every factory push is already admitted in the fast job, independently
      # of build routing and PR deduplication. This copy serves scoped PRs.
      - name: Run no-build release gate rows
        if: github.event_name != 'push'
        env:
          BASE_SHA: ${{ steps.classify-diff.outputs.comparison-base || github.event.pull_request.base.sha || github.event.before }}
          ZERO_BASE_REF: origin/${{ github.event.repository.default_branch }}
        run: |
          # The pinned markdownlint-cli2 (root package-lock.json); scripts/markdownlint.py runs it.
          npm ci --no-audit --no-fund
          comparison_base="$BASE_SHA"
          if [[ -z "$comparison_base" || "$comparison_base" =~ ^0+$ ]]; then
            comparison_base="$ZERO_BASE_REF"
          fi
          ./scripts/release-gate.sh --fast-rows --base "$comparison_base"

      - name: Test portable installer fixtures
        if: >-
          steps.pr-dedupe.outputs.covered != 'true'
          && (github.event_name != 'push' || steps.classify-diff.outputs.fast-admission != 'true')
        run: ./scripts/test-cas-install.sh

      - name: Test release and install script fixtures
        if: steps.pr-dedupe.outputs.covered != 'true'
        env:
          BASE_SHA: ${{ steps.classify-diff.outputs.comparison-base }}
        run: |
          # Use the same resolved comparison base as the other scoped checks.
          # Unknown bases run the fixtures, matching the classifier's fail-closed policy.
          if [[ -n "$BASE_SHA" ]]; then
            changed_scripts="$(git diff --name-only "$BASE_SHA" HEAD -- scripts/)"
            if [[ -z "$changed_scripts" ]]; then
              echo 'No scripts/ changes; skipping release and install fixtures.'
              exit 0
            fi
          fi
          # Report Python availability for the script fixtures.
          python3 --version
          ./scripts/test-release.sh
          ./scripts/test-release-publish.sh
          ./scripts/test-install-on-publish.sh
          ./scripts/test-hub-pin.sh

      - name: Detect runner lock fixture changes
        id: runner-lock-diff
        if: github.event_name != 'push' && steps.pr-dedupe.outputs.covered != 'true'
        env:
          BASE_SHA: ${{ steps.classify-diff.outputs.comparison-base || github.event.pull_request.base.sha || github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          runner_base="$BASE_SHA"
          if [[ -z "$runner_base" || "$runner_base" =~ ^0+$ ]] \
            || ! git rev-parse --verify --quiet "$runner_base^{commit}" >/dev/null; then
            runner_base="$(git merge-base HEAD origin/$DEFAULT_BRANCH)"
          fi
          changed=false
          changed_paths="$(git diff --name-only "$runner_base" HEAD -- \
            'scripts/cassy-actions-*' 'scripts/test-cassy-actions-*' \
            'scripts/install-cassy-actions-runner.sh')"
          if [[ -n "$changed_paths" ]]; then
            changed=true
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Test runner cache job lock lifecycle
        if: steps.runner-lock-diff.outputs.changed == 'true'
        run: ./scripts/test-cassy-actions-cache-job-lock.sh

      # PRs and larger pushes own these checks here; small factory pushes
      # already ran them in scoped-validation-fast.
      - name: Typecheck and test Commander web assets
        if: >-
          steps.pr-dedupe.outputs.covered != 'true'
          && (github.event_name != 'push' || steps.classify-diff.outputs.fast-admission != 'true')
          && steps.classify-diff.outputs.web-check-needed == 'true'
        working-directory: hub-web
        run: |
          npm ci
          npm run typecheck
          npm test

      - name: Build and test the Slack bridge
        if: >-
          steps.pr-dedupe.outputs.covered != 'true'
          && (github.event_name != 'push' || steps.classify-diff.outputs.fast-admission != 'true')
          && steps.classify-diff.outputs.bridge-check-needed == 'true'
        working-directory: slack-bridge
        run: |
          npm ci
          npm test
          npm run build

      - uses: ./.github/actions/setup-rust-linux
        if: >-
          steps.pr-dedupe.outputs.covered != 'true'
          && (github.event_name != 'push' || steps.classify-diff.outputs.fast-admission != 'true')
          && steps.classify-diff.outputs.rust-unaffected != 'true'
          && (github.event_name != 'push' || vars.CAS_LANE_SLIM != 'true')
        with:
          cache-key: scoped-validation

      - name: Install nextest
        if: >-
          steps.pr-dedupe.outputs.covered != 'true'
          && (github.event_name != 'push' || steps.classify-diff.outputs.fast-admission != 'true')
          && steps.classify-diff.outputs.rust-unaffected != 'true'
          && (github.event_name != 'push' || vars.CAS_LANE_SLIM != 'true')
        uses: taiki-e/install-action@nextest

      - name: Run change-scoped tests with impact evidence
        if: >-
          steps.pr-dedupe.outputs.covered != 'true'
          && (github.event_name != 'push' || steps.classify-diff.outputs.fast-admission != 'true')
          && steps.classify-diff.outputs.rust-unaffected != 'true'
          && (github.event_name != 'push' || vars.CAS_LANE_SLIM != 'true')
        env:
          BASE_SHA: ${{ steps.classify-diff.outputs.comparison-base || github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          ZERO_BASE_REF: origin/${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          ZIG: ${{ github.workspace }}/.context/zig/zig
        run: |
          if [[ -f scripts/cas-test-targets.py ]]; then
            python3 scripts/cas-test-targets.py cas-cli --check
          fi
          if [[ -x scripts/ci-test-impact.py ]]; then
            python3 scripts/ci-test-impact.py history
            python3 scripts/ci-test-impact.py run
          else
            scripts/run-verified-tests.sh nextest run --workspace --no-fail-fast
          fi

      - name: Publish CI impact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-test-impact-${{ github.run_id }}-scoped
          path: target/ci-impact/
          if-no-files-found: ignore

      # cas-ad65: import selection alone cannot prove snapshot input coverage. Route only their committed CLI-output input surfaces here;
      # PRs #649/#650 and PR #657 run 33435790948 reached the queue before
      # stale doctor_snapshot output was exercised. This remains one small
      # target within Scoped Validation, never a new CI lane.
      - name: Test snapshot-pinned CLI output surfaces
        if: >-
          steps.pr-dedupe.outputs.covered != 'true'
          && (github.event_name != 'push' || steps.classify-diff.outputs.fast-admission != 'true')
          && steps.classify-diff.outputs.rust-unaffected != 'true'
          && (github.event_name != 'push' || vars.CAS_LANE_SLIM != 'true')
        env:
          BASE_SHA: ${{ steps.classify-diff.outputs.comparison-base || github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          ZERO_BASE_REF: origin/${{ github.event.repository.default_branch }}
        run: scripts/check-scoped-snapshot-tests.sh --base-sha "$BASE_SHA" --zero-base-ref "$ZERO_BASE_REF"

      - name: Report why no Rust work ran
        if: >-
          steps.pr-dedupe.outputs.covered == 'true'
          || steps.classify-diff.outputs.rust-unaffected == 'true'
          || (github.event_name == 'push' && vars.CAS_LANE_SLIM == 'true')
        env:
          PR_COVERED: ${{ steps.pr-dedupe.outputs.covered }}
          DIFF_CLASS: ${{ steps.classify-diff.outputs.class }}
          LANE_SLIM: ${{ vars.CAS_LANE_SLIM }}
        run: |
          if [[ "$PR_COVERED" == "true" ]]; then
            echo "Skipped: a pull request event is validating this exact head SHA." >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$LANE_SLIM" == "true" && "$GITHUB_EVENT_NAME" == "push" ]]; then
            echo "Skipped: CAS_LANE_SLIM; worker focused-test receipts (checked at park) and the merge-queue full suite own Rust." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Skipped: diff class '$DIFF_CLASS' is Rust-unaffected." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Report sccache stats
        # A slim factory push compiles nothing; there is no cache to report.
        if: always() && (github.event_name != 'push' || vars.CAS_LANE_SLIM != 'true')
        run: |
          # Version skew (cas-3e14): the workflow can come from a newer main
          # while the checkout is an older head that predates this script.
          # Observability must never fail a lane that compiled and tested fine.
          if [[ -x ./scripts/ci-sccache-summary.sh ]]; then
            ./scripts/ci-sccache-summary.sh "Scoped Validation"
          else
            echo "::notice title=sccache stats::scripts/ci-sccache-summary.sh is absent at this checkout; skipping cache reporting."
          fi

  # Full Fast Validation runs exactly once on GitHub's canonical merge-queue
  # tree. The required rollup below emits a cheap hosted PR admission context,
  # then this job family validates the tree that will actually land.
  #
  # cas-a677 / cas-a1b0: the former single preflight job ran 19 steps in series
  # (Commander journeys, then cargo check, the ISA test, the machinery tests and
  # the build), so the first failure hid every later one: #1198's missing linter
  # surfaced only in its fourth queue cycle. It is now independent jobs that
  # each report their own result in the same run:
  #   fast-validation-preflight     installer fixtures + Rust compile checks
  #   fast-validation-ci-tiers      release/CI machinery tests (make test-ci-tiers)
  #   fast-validation-slack-bridge  Slack bridge build and tests (bridge inputs)
  #   fast-validation-web           Commander typecheck, unit tests, build,
  #                                 visual QA and dist drift (web inputs)
  #   fast-validation-journeys      Commander journeys, 6 hosted shards (web inputs)
  # Steps inside a job use `!cancelled()` where a later step does not depend on
  # an earlier one, so one red step does not hide the next.
  # cas-4cb8: on a queue tree the release train's full gate already proved,
  # only the compile checks and (unless cas-9f70 also proved them) the journeys
  # run. See docs/branch-protection/README.md section 3.
  fast-validation-preflight:
    name: Fast Validation — preflight (no test suite)
    if: >-
      needs.ci-diff.outputs.class != 'docs-only'
      && (needs.fast-validation-main-push-dedupe.outputs.run-fast-validation == 'true'
      || needs.fast-validation-main-push-dedupe.outputs.reuse-source == 'full-gate')
      && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
      || github.event_name == 'merge_group'
      || (github.event_name == 'push'
      && (github.ref == 'refs/heads/main'
      || startsWith(github.ref, 'refs/tags/'))))
      && (needs.fast-validation-runner-route.outputs.mode != 'self-hosted'
      || (github.event_name == 'merge_group'
      && github.repository == 'Richards-LLC/cassy'
      && github.event.repository.fork == false
      && vars.CASSY_MERGE_QUEUE_SELF_HOSTED == 'enabled'))
    needs: [ci-diff, fast-validation-runner-route, fast-validation-main-push-dedupe]
    runs-on: ${{ fromJSON(needs.fast-validation-runner-route.outputs.runner) }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - id: classify-diff
        uses: ./.github/actions/classify-required-diff
        with:
          base-sha: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}

      - name: Verify merge-queue self-hosted trust boundary
        if: needs.fast-validation-runner-route.outputs.mode == 'self-hosted'
        env:
          SELF_HOSTED_ENABLED: ${{ vars.CASSY_MERGE_QUEUE_SELF_HOSTED }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = merge_group
          test "$GITHUB_REPOSITORY" = Richards-LLC/cassy
          test "$SELF_HOSTED_ENABLED" = enabled
          case "$GITHUB_REF" in
            refs/heads/gh-readonly-queue/*) ;;
            *) echo "self-hosted route received a non-queue ref: $GITHUB_REF" >&2; exit 1 ;;
          esac
          ./scripts/check-cassy-actions-runner-isolation.sh

      - name: Test portable installer fixtures
        run: ./scripts/test-cas-install.sh

      - name: Report Rust short-circuit
        if: steps.classify-diff.outputs.rust-unaffected == 'true'
        env:
          DIFF_CLASS: ${{ steps.classify-diff.outputs.class }}
        run: echo "Rust work skipped for $DIFF_CLASS diff."

      - if: >-
          ${{ !cancelled()
          && steps.classify-diff.outputs.rust-unaffected != 'true'
          && needs.fast-validation-runner-route.outputs.mode == 'hosted' }}
        uses: ./.github/actions/setup-rust-linux
        with:
          cache-key: fast-validation

      - name: Set up shared self-hosted Rust toolchain
        if: >-
          ${{ !cancelled()
          && steps.classify-diff.outputs.rust-unaffected != 'true'
          && needs.fast-validation-runner-route.outputs.mode == 'self-hosted' }}
        run: ./scripts/setup-cassy-actions-rust.sh

      - name: Install Zig on the isolated merge-queue runner
        if: >-
          ${{ !cancelled()
          && steps.classify-diff.outputs.rust-unaffected != 'true'
          && needs.fast-validation-runner-route.outputs.mode == 'self-hosted' }}
        run: ./scripts/bootstrap-zig.sh

      - name: Verify private self-hosted sccache
        if: >-
          ${{ !cancelled()
          && steps.classify-diff.outputs.rust-unaffected != 'true'
          && needs.fast-validation-runner-route.outputs.mode == 'self-hosted' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          sccache rustc -vV
          sccache --show-stats

      - name: Check
        if: >-
          ${{ !cancelled()
          && steps.classify-diff.outputs.rust-unaffected != 'true' }}
        env:
          ZIG: ${{ github.workspace }}/.context/zig/zig
        run: cargo check -p cas

      - name: Test portable x86_64 ISA audit
        if: >-
          ${{ !cancelled()
          && steps.classify-diff.outputs.rust-unaffected != 'true' }}
        run: ./scripts/test-check-portable-x86_64-isa.sh

      - name: Build (without MCP proxy)
        if: >-
          ${{ !cancelled()
          && steps.classify-diff.outputs.rust-unaffected != 'true' }}
        env:
          ZIG: ${{ github.workspace }}/.context/zig/zig
        run: cargo build -p cas --no-default-features

      - name: Report sccache stats
        if: always() && steps.classify-diff.outputs.rust-unaffected != 'true'
        run: |
          # Version skew (cas-3e14): the workflow can come from a newer main
          # while the checkout is an older head that predates this script.
          # Observability must never fail a lane that compiled and tested fine.
          if [[ -x ./scripts/ci-sccache-summary.sh ]]; then
            ./scripts/ci-sccache-summary.sh "Fast Validation — preflight"
          else
            echo "::notice title=sccache stats::scripts/ci-sccache-summary.sh is absent at this checkout; skipping cache reporting."
          fi

  # The release, CI and factory machinery's own tests. They compile no Rust;
  # cas-4cb8: the full gate's ci-script-tests row runs this same target, so a
  # full-gate queue tree skips it.
  fast-validation-ci-tiers:
    name: Fast Validation — CI tiers
    if: >-
      needs.ci-diff.outputs.class != 'docs-only'
      && needs.ci-diff.outputs.rust-unaffected != 'true'
      && needs.fast-validation-main-push-dedupe.outputs.run-fast-validation == 'true'
      && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
      || github.event_name == 'merge_group'
      || (github.event_name == 'push'
      && (github.ref == 'refs/heads/main'
      || startsWith(github.ref, 'refs/tags/'))))
    needs: [ci-diff, fast-validation-main-push-dedupe]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Test release publication guards
        run: |
          if ! python3 -c 'import yaml' 2>/dev/null; then
            python3 -m venv "$RUNNER_TEMP/ci-tiers-venv"
            "$RUNNER_TEMP/ci-tiers-venv/bin/pip" install --disable-pip-version-check --quiet -r scripts/ci_tiers/requirements.txt
            export PATH="$RUNNER_TEMP/ci-tiers-venv/bin:$PATH"
          fi
          # The pinned markdownlint-cli2 (root package-lock.json) for the
          # markdown-lint row tests; scripts/markdownlint.py runs it.
          npm ci --no-audit --no-fund
          make -C cas-cli test-ci-tiers

  fast-validation-slack-bridge:
    name: Fast Validation — Slack bridge
    if: >-
      needs.ci-diff.outputs.class != 'docs-only'
      && needs.ci-diff.outputs.bridge-check-needed == 'true'
      && (needs.fast-validation-main-push-dedupe.outputs.run-fast-validation == 'true'
      || needs.fast-validation-main-push-dedupe.outputs.reuse-source == 'full-gate')
      && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
      || github.event_name == 'merge_group'
      || (github.event_name == 'push'
      && (github.ref == 'refs/heads/main'
      || startsWith(github.ref, 'refs/tags/'))))
    needs: [ci-diff, fast-validation-main-push-dedupe]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Build and test the Slack bridge
        working-directory: slack-bridge
        run: |
          npm ci
          npm test
          npm run build

  # Commander checks that need no browser fan-out. cas-4cb8: the full gate
  # proved all of them on a full-gate queue tree, so that tree skips this job.
  fast-validation-web:
    name: Fast Validation — Commander web
    if: >-
      needs.ci-diff.outputs.class != 'docs-only'
      && needs.ci-diff.outputs.web-check-needed == 'true'
      && needs.fast-validation-main-push-dedupe.outputs.run-fast-validation == 'true'
      && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
      || github.event_name == 'merge_group'
      || (github.event_name == 'push'
      && (github.ref == 'refs/heads/main'
      || startsWith(github.ref, 'refs/tags/'))))
    needs: [ci-diff, fast-validation-main-push-dedupe]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hub-web
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install Commander dependencies
        run: npm ci

      - name: Typecheck Commander
        run: npm run typecheck

      - name: Test Commander units
        if: ${{ !cancelled() }}
        run: |
          npm test
          # cas-4ce5: the journeys' failure upload really matches files in the hidden .results dir.
          bash ../scripts/test-ci-journey-evidence-upload.sh

      - name: Build Commander and check the committed bundle
        id: build
        if: ${{ !cancelled() }}
        run: |
          npm run build
          git diff --exit-code -- dist

      - name: Visual QA
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/playwright-browsers
        run: |
          if sudo -n true 2>/dev/null; then
            npx playwright install --with-deps chromium
          else
            npx playwright install chromium
          fi
          npm run visual-qa

  # User journeys (docs/qa/journeys.md) against the committed bundle, on the
  # Chromium build pinned by @playwright/test, in six hosted shards of two
  # workers each (one 141-journey job took 13.7-22 min, cas-a677; four workers
  # on a 4-vCPU hosted runner timed out, run 38674369439). They run only
  # when Commander inputs change (scripts/classify-web-inputs.py), and cas-9f70:
  # a full-gate queue tree skips them when the train also proved the journeys.
  fast-validation-journeys:
    name: Fast Validation — Commander journeys ${{ matrix.shard }}/6
    if: >-
      needs.ci-diff.outputs.class != 'docs-only'
      && needs.ci-diff.outputs.web-check-needed == 'true'
      && (needs.fast-validation-main-push-dedupe.outputs.run-fast-validation == 'true'
      || (needs.fast-validation-main-push-dedupe.outputs.reuse-source == 'full-gate'
      && needs.fast-validation-main-push-dedupe.outputs.journeys-reuse != 'true'))
      && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
      || github.event_name == 'merge_group'
      || (github.event_name == 'push'
      && (github.ref == 'refs/heads/main'
      || startsWith(github.ref, 'refs/tags/'))))
    needs: [ci-diff, fast-validation-main-push-dedupe]
    permissions:
      contents: read
      issues: read
      actions: read
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Run Commander journeys shard ${{ matrix.shard }}/6
        working-directory: hub-web
        env:
          SHARD: ${{ matrix.shard }}
          GH_TOKEN: ${{ github.token }}
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/playwright-browsers
        run: |
          npm ci
          if sudo -n true 2>/dev/null; then
            npx playwright install --with-deps chromium
          else
            npx playwright install chromium
          fi
          python3 ../scripts/ci-queue-flakes.py run playwright --shard "$SHARD/6" \
            --issues-repo Richards-LLC/cassy --out "$GITHUB_WORKSPACE/target/queue-flakes/playwright-$SHARD"

      # cas-4ce5: a journey flake in the queue left no trace to diagnose.
      # Keep Playwright's traces, error-context.md and screenshots on failure.
      - name: Upload Commander journey evidence on failure
        if: failure() || github.event_name == 'merge_group'
        uses: actions/upload-artifact@v4
        with:
          name: hub-web-e2e-results-${{ github.run_id }}-${{ github.run_attempt }}-shard-${{ matrix.shard }}
          path: |
            hub-web/e2e/.results/
            target/queue-flakes/
          # .results is a dot-directory: upload-artifact@v4 skips hidden files
          # unless told otherwise, which shipped an empty artifact (cas-4ce5 QA).
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

      - name: Publish queue playwright recovery receipts
        if: always() && github.event_name == 'merge_group'
        uses: actions/upload-artifact@v4
        with:
          name: queue-flakes-playwright-${{ matrix.shard }}
          path: target/queue-flakes/playwright-${{ matrix.shard }}/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  # Compile the workspace test graph once. The archive contains the binaries
  # and nextest metadata needed by the shard jobs below, avoiding three cold
  # runners rebuilding the same graph before their disjoint test partitions.
  fast-validation-suite-build:
    name: Fast Validation — suite archive build
    if: >-
      needs.ci-diff.outputs.class != 'docs-only'
      && needs.fast-validation-main-push-dedupe.outputs.run-fast-validation == 'true'
      && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
      || github.event_name == 'merge_group'
      || (github.event_name == 'push'
      && (github.ref == 'refs/heads/main'
      || startsWith(github.ref, 'refs/tags/'))))
      && (needs.fast-validation-runner-route.outputs.mode != 'self-hosted'
      || (github.event_name == 'merge_group'
      && github.repository == 'Richards-LLC/cassy'
      && github.event.repository.fork == false
      && vars.CASSY_MERGE_QUEUE_SELF_HOSTED == 'enabled'))
    needs: [ci-diff, fast-validation-runner-route, fast-validation-main-push-dedupe]
    runs-on: ${{ fromJSON(needs.fast-validation-runner-route.outputs.runner) }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - id: classify-diff
        uses: ./.github/actions/classify-required-diff
        with:
          base-sha: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}

      - name: Verify merge-queue self-hosted trust boundary
        if: needs.fast-validation-runner-route.outputs.mode == 'self-hosted'
        env:
          SELF_HOSTED_ENABLED: ${{ vars.CASSY_MERGE_QUEUE_SELF_HOSTED }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = merge_group
          test "$GITHUB_REPOSITORY" = Richards-LLC/cassy
          test "$SELF_HOSTED_ENABLED" = enabled
          case "$GITHUB_REF" in
            refs/heads/gh-readonly-queue/*) ;;
            *) echo "self-hosted route received a non-queue ref: $GITHUB_REF" >&2; exit 1 ;;
          esac
          ./scripts/check-cassy-actions-runner-isolation.sh

      - name: Report Rust short-circuit
        if: steps.classify-diff.outputs.rust-unaffected == 'true'
        env:
          DIFF_CLASS: ${{ steps.classify-diff.outputs.class }}
        run: echo "Rust suite archive build skipped for $DIFF_CLASS diff."

      - if: >-
          steps.classify-diff.outputs.rust-unaffected != 'true'
          && needs.fast-validation-runner-route.outputs.mode == 'hosted'
        uses: ./.github/actions/setup-rust-linux
        with:
          cache-key: fast-validation-suite-archive

      - name: Set up shared self-hosted Rust toolchain
        if: >-
          steps.classify-diff.outputs.rust-unaffected != 'true'
          && needs.fast-validation-runner-route.outputs.mode == 'self-hosted'
        run: ./scripts/setup-cassy-actions-rust.sh

      - name: Install Zig on the isolated merge-queue runner
        if: >-
          steps.classify-diff.outputs.rust-unaffected != 'true'
          && needs.fast-validation-runner-route.outputs.mode == 'self-hosted'
        run: ./scripts/bootstrap-zig.sh

      - name: Install nextest
        if: steps.classify-diff.outputs.rust-unaffected != 'true'
        uses: taiki-e/install-action@nextest

      - name: Verify private self-hosted sccache
        if: >-
          steps.classify-diff.outputs.rust-unaffected != 'true'
          && needs.fast-validation-runner-route.outputs.mode == 'self-hosted'
        # cas-065a: cache isolation stays observable, but its TCP failure must
        # not block the merge queue while the server defect is investigated.
        continue-on-error: true
        run: |
          set -euo pipefail
          sccache rustc -vV
          sccache --show-stats

      - name: Disable sccache for the self-hosted suite archive
        if: >-
          steps.classify-diff.outputs.rust-unaffected != 'true'
          && needs.fast-validation-runner-route.outputs.mode == 'self-hosted'
        # cas-065a: the cache is an optimization, not a merge-queue prerequisite.
        run: echo 'RUSTC_WRAPPER=' >> "$GITHUB_ENV"

      # Debug info is stripped from the archived test binaries (cas-59d3).
      # Every shard downloads this whole artifact, so its size is multiplied by
      # the shard count and lands directly on the PR critical path: measured at
      # 4034 MB, the three shards spent 404s, 257s and 63s downloading it to
      # run 108s, 105s and 101s of tests. The shards were never skewed — the
      # download was. Stripping debug info measured 65% smaller binaries on
      # this workspace (1344 MB of test binaries -> 476 MB with
      # `strip --strip-debug`).
      #
      # The cost is that a CI failure's backtrace loses line numbers; the test
      # name and assertion message are unaffected, and anyone who needs a
      # symbolised trace reproduces locally, where the normal `dev` profile
      # (debug = 1) still applies. This override is scoped to this job only.
      - name: Build full suite archive
        if: steps.classify-diff.outputs.rust-unaffected != 'true'
        env:
          ZIG: ${{ github.workspace }}/.context/zig/zig
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"
          CARGO_PROFILE_DEV_STRIP: debuginfo
          CARGO_PROFILE_TEST_STRIP: debuginfo
        run: |
          if [[ -f scripts/cas-test-targets.py ]]; then
            python3 scripts/cas-test-targets.py cas-cli --check
          fi
          cargo nextest archive --workspace --archive-file fast-validation-suite.tar.zst

      # The archive carries test executables, but integration tests that spawn
      # `cas` resolve it from target/debug/. Package that runner separately:
      # upload-artifact intentionally does not preserve executable mode bits.
      - name: Package CLI runner
        if: steps.classify-diff.outputs.rust-unaffected != 'true'
        run: |
          tar -C "${CARGO_TARGET_DIR:-target}/debug" \
            --transform='s,^cas$,target/debug/cas,' \
            -czf fast-validation-suite-runner.tar.gz cas

      - name: Upload full suite archive and CLI runner
        if: steps.classify-diff.outputs.rust-unaffected != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: fast-validation-suite-archive
          path: |
            fast-validation-suite.tar.zst
            fast-validation-suite-runner.tar.gz
          retention-days: 1
          compression-level: 0

      # This lane compiles the whole workspace test graph, so its hit rate is
      # the single best predictor of the required critical path.
      - name: Report sccache stats
        if: always() && steps.classify-diff.outputs.rust-unaffected != 'true'
        run: |
          # Version skew (cas-3e14): the workflow can come from a newer main
          # while the checkout is an older head that predates this script.
          # Observability must never fail a lane that compiled and tested fine.
          if [[ -x ./scripts/ci-sccache-summary.sh ]]; then
            ./scripts/ci-sccache-summary.sh "Fast Validation — suite archive build"
          else
            echo "::notice title=sccache stats::scripts/ci-sccache-summary.sh is absent at this checkout; skipping cache reporting."
          fi

  fast-validation-suite-shards:
    name: Fast Validation — suite shard ${{ matrix.shard }}/3
    if: >-
      needs.ci-diff.outputs.class != 'docs-only'
      && needs.fast-validation-main-push-dedupe.outputs.run-fast-validation == 'true'
      && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
      || github.event_name == 'merge_group'
      || (github.event_name == 'push'
      && (github.ref == 'refs/heads/main'
      || startsWith(github.ref, 'refs/tags/'))))
    needs: [ci-diff, fast-validation-suite-build, fast-validation-main-push-dedupe]
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    permissions:
      contents: read
      issues: read
      actions: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - id: classify-diff
        uses: ./.github/actions/classify-required-diff
        with:
          base-sha: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}

      - name: Report Rust short-circuit
        if: steps.classify-diff.outputs.rust-unaffected == 'true'
        env:
          DIFF_CLASS: ${{ steps.classify-diff.outputs.class }}
        run: echo "Rust suite shard skipped for $DIFF_CLASS diff."

      - name: Install nextest
        if: steps.classify-diff.outputs.rust-unaffected != 'true'
        uses: taiki-e/install-action@nextest

      - name: Download full suite archive
        if: steps.classify-diff.outputs.rust-unaffected != 'true'
        uses: actions/download-artifact@v4
        with:
          name: fast-validation-suite-archive
          path: .

      - name: Restore executable CLI runner
        if: steps.classify-diff.outputs.rust-unaffected != 'true'
        run: |
          tar -xzf fast-validation-suite-runner.tar.gz
          test -x target/debug/cas

      # count:1/3 through count:3/3 are disjoint and exhaustive. Keep
      # --no-fail-fast so failures never mask later binaries; doctests stay in
      # their own required lane because nextest cannot run them. Remap the
      # self-hosted producer workspace to this hosted checkout (cas-c4a5).
      # Insta also resolves snapshots at runtime from its producer path, so
      # pin its workspace root to this hosted checkout.
      - name: Test full suite shard ${{ matrix.shard }}/3
        if: steps.classify-diff.outputs.rust-unaffected != 'true'
        env:
          INSTA_WORKSPACE_ROOT: ${{ github.workspace }}
          SHARD: ${{ matrix.shard }}
          GH_TOKEN: ${{ github.token }}
          IMPACT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          mkdir -p target/ci-impact
          start_seconds=$SECONDS
          export VERIFIED_TEST_LOG="target/ci-impact/full-shard-$SHARD.log"
          set +e
          python3 scripts/ci-queue-flakes.py run rust --shard "$SHARD/3" \
            --issues-repo Richards-LLC/cassy --out "target/queue-flakes/rust-$SHARD"
          suite_status=$?
          set -e
          initial_status="$suite_status"
          if [[ "$GITHUB_EVENT_NAME" == merge_group && -f "target/queue-flakes/rust-$SHARD/receipt.json" ]]; then
            initial_status="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["initial_status"])' "target/queue-flakes/rust-$SHARD/receipt.json")"
          fi
          if [[ -x scripts/ci-test-impact.py ]]; then
            python3 scripts/ci-test-impact.py record \
              --base-sha "$IMPACT_BASE_SHA" \
              --log "$VERIFIED_TEST_LOG" --status "$initial_status" \
              --elapsed "$((SECONDS - start_seconds))"
          fi
          exit "$suite_status"

      - name: Publish full-suite recall evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-test-impact-${{ github.run_id }}-full-${{ matrix.shard }}
          path: target/ci-impact/
          if-no-files-found: ignore

      # A protected sentinel stands in for an ambient real store on hosted CI.
      # Running the protocol binary again through the real-store guard catches
      # a future test that forgets to replace its inherited CAS_ROOT.
      - name: Prove MCP protocol tests leave the ambient store untouched
        if: steps.classify-diff.outputs.rust-unaffected != 'true' && matrix.shard == 1
        run: |
          set -euo pipefail
          guard_dir="$(mktemp -d)"
          trap 'rm -rf "$guard_dir"' EXIT
          mkdir -p "$guard_dir/.cas"
          sqlite3 "$guard_dir/.cas/cas.db" 'CREATE TABLE rules (id TEXT, status TEXT, scope TEXT, tags TEXT, paths TEXT, content TEXT);'
          export CAS_ROOT="$guard_dir/.cas"
          export CAS_REAL_DBS="$guard_dir/.cas/cas.db"
          export CARGO_CMD="nextest run --archive-file $GITHUB_WORKSPACE/fast-validation-suite.tar.zst --workspace-remap $GITHUB_WORKSPACE"
          make -C cas-cli test-real-store-untouched REAL_STORE_ARGS="-E 'test(mcp_protocol_test::)'"

      - name: Publish queue rust recovery receipts
        if: always() && github.event_name == 'merge_group'
        uses: actions/upload-artifact@v4
        with:
          name: queue-flakes-rust-${{ matrix.shard }}
          path: target/queue-flakes/rust-${{ matrix.shard }}/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  # Writable credentials live only in the hosted fan-in, never in test processes.
  queue-flake-publication:
    name: Queue flake publication
    if: >-
      always() && github.event_name == 'merge_group'
      && (needs.fast-validation-suite-shards.result != 'skipped'
      || needs.fast-validation-journeys.result != 'skipped')
    needs: [ci-diff, fast-validation-main-push-dedupe, fast-validation-suite-shards, fast-validation-journeys]
    runs-on: ubuntu-latest
    permissions:
      contents: write # Atomic publication lock ref; no evaluated-tree edits.
      issues: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: queue-flakes-*
          path: target/queue-flake-receipts
      - name: Persist every recovered failure before allowing a green queue
        env:
          GH_TOKEN: ${{ github.token }}
          RUST_UNAFFECTED: ${{ needs.ci-diff.outputs.rust-unaffected }}
          RUN_SUITE: ${{ needs.fast-validation-main-push-dedupe.outputs.run-fast-validation }}
          WEB_NEEDED: ${{ needs.ci-diff.outputs.web-check-needed }}
          JOURNEYS_REUSE: ${{ needs.fast-validation-main-push-dedupe.outputs.journeys-reuse }}
        run: |
          expected=()
          if [[ "$RUN_SUITE" == true && "$RUST_UNAFFECTED" != true ]]; then
            for shard in 1 2 3; do expected+=(--expect "rust:$shard/3"); done
          fi
          if [[ "$WEB_NEEDED" == true && ( "$RUN_SUITE" == true || "$JOURNEYS_REUSE" != true ) ]]; then
            for shard in 1 2 3 4 5 6; do expected+=(--expect "playwright:$shard/6"); done
          fi
          # All Rust shards can legitimately skip without producing receipts.
          if (( ${#expected[@]} == 0 )); then exit 0; fi
          python3 scripts/ci-queue-flakes.py reconcile --issues-repo Richards-LLC/cassy \
            --receipts target/queue-flake-receipts "${expected[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: queue-flake-publication
          path: target/queue-flake-receipts/publication.json
          if-no-files-found: ignore

  # Keep the protected ruleset's exact full-suite context while the actual
  # test execution fans out after the shared archive. This job runs even when a shard fails and
  # makes a failed or cancelled shard fail the required check.
  fast-validation-suite:
    name: Fast Validation — full suite
    if: >-
      always() && needs.ci-diff.outputs.class != 'docs-only'
      && needs.fast-validation-main-push-dedupe.outputs.run-fast-validation == 'true'
      && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
      || github.event_name == 'merge_group'
      || (github.event_name == 'push'
      && (github.ref == 'refs/heads/main'
      || startsWith(github.ref, 'refs/tags/'))))
    needs: [ci-diff, fast-validation-suite-shards, fast-validation-main-push-dedupe]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - id: classify-diff
        uses: ./.github/actions/classify-required-diff
        with:
          base-sha: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}

      - name: Report Rust short-circuit
        if: steps.classify-diff.outputs.rust-unaffected == 'true'
        env:
          DIFF_CLASS: ${{ steps.classify-diff.outputs.class }}
        run: echo "Full-suite fan-in short-circuited for $DIFF_CLASS diff."

      - name: Require every suite shard to pass
        env:
          SHARDS: ${{ needs.fast-validation-suite-shards.result }}
        run: test "$SHARDS" = success

  fast-validation-docs:
    name: Fast Validation — doctests
    if: >-
      needs.ci-diff.outputs.class != 'docs-only'
      && needs.fast-validation-main-push-dedupe.outputs.run-fast-validation == 'true'
      && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
      || github.event_name == 'merge_group'
      || (github.event_name == 'push'
      && (github.ref == 'refs/heads/main'
      || startsWith(github.ref, 'refs/tags/'))))
      && (needs.fast-validation-runner-route.outputs.mode != 'self-hosted'
      || (github.event_name == 'merge_group'
      && github.repository == 'Richards-LLC/cassy'
      && github.event.repository.fork == false
      && vars.CASSY_MERGE_QUEUE_SELF_HOSTED == 'enabled'))
    needs: [ci-diff, fast-validation-runner-route, fast-validation-main-push-dedupe]
    runs-on: ${{ fromJSON(needs.fast-validation-runner-route.outputs.runner) }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - id: classify-diff
        uses: ./.github/actions/classify-required-diff
        with:
          base-sha: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}

      - name: Verify merge-queue self-hosted trust boundary
        if: needs.fast-validation-runner-route.outputs.mode == 'self-hosted'
        env:
          SELF_HOSTED_ENABLED: ${{ vars.CASSY_MERGE_QUEUE_SELF_HOSTED }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = merge_group
          test "$GITHUB_REPOSITORY" = Richards-LLC/cassy
          test "$SELF_HOSTED_ENABLED" = enabled
          case "$GITHUB_REF" in
            refs/heads/gh-readonly-queue/*) ;;
            *) echo "self-hosted route received a non-queue ref: $GITHUB_REF" >&2; exit 1 ;;
          esac
          ./scripts/check-cassy-actions-runner-isolation.sh

      - name: Report Rust short-circuit
        if: steps.classify-diff.outputs.rust-unaffected == 'true'
        env:
          DIFF_CLASS: ${{ steps.classify-diff.outputs.class }}
        run: echo "Doctests skipped for $DIFF_CLASS diff."

      - if: >-
          steps.classify-diff.outputs.rust-unaffected != 'true'
          && needs.fast-validation-runner-route.outputs.mode == 'hosted'
        uses: ./.github/actions/setup-rust-linux
        with:
          cache-key: fast-validation-docs

      - name: Set up shared self-hosted Rust toolchain
        if: >-
          steps.classify-diff.outputs.rust-unaffected != 'true'
          && needs.fast-validation-runner-route.outputs.mode == 'self-hosted'
        run: ./scripts/setup-cassy-actions-rust.sh

      - name: Install Zig on the isolated merge-queue runner
        if: >-
          steps.classify-diff.outputs.rust-unaffected != 'true'
          && needs.fast-validation-runner-route.outputs.mode == 'self-hosted'
        run: ./scripts/bootstrap-zig.sh

      - name: Verify private self-hosted sccache
        if: >-
          steps.classify-diff.outputs.rust-unaffected != 'true'
          && needs.fast-validation-runner-route.outputs.mode == 'self-hosted'
        continue-on-error: true
        run: |
          set -euo pipefail
          sccache rustc -vV
          sccache --show-stats

      # nextest does not run doctests; keep this separate so it never waits
      # behind the partitioned suite.
      - name: Test doctests
        if: steps.classify-diff.outputs.rust-unaffected != 'true'
        env:
          ZIG: ${{ github.workspace }}/.context/zig/zig
        run: scripts/run-verified-tests.sh test -p cas --doc

      - name: Report sccache stats
        if: always() && steps.classify-diff.outputs.rust-unaffected != 'true'
        run: |
          # Version skew (cas-3e14): the workflow can come from a newer main
          # while the checkout is an older head that predates this script.
          # Observability must never fail a lane that compiled and tested fine.
          if [[ -x ./scripts/ci-sccache-summary.sh ]]; then
            ./scripts/ci-sccache-summary.sh "Fast Validation — doctests"
          else
            echo "::notice title=sccache stats::scripts/ci-sccache-summary.sh is absent at this checkout; skipping cache reporting."
          fi

  # The repository ruleset requires this exact check name. On merge_group it
  # reports success only after preflight, all exhaustive nextest shards, and
  # doctests pass. On a main PR it is a cheap hosted admission receipt; the
  # canonical merged tree receives the exhaustive validation before it lands.
  fast-validation:
    name: Fast Validation
    if: >-
      always() && (needs.ci-diff.outputs.class != 'docs-only' || needs.ci-diff.result != 'success')
      && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
      || github.event_name == 'merge_group'
      || (github.event_name == 'pull_request'
      && github.base_ref == github.event.repository.default_branch)
      || (github.event_name == 'push'
      && (github.ref == 'refs/heads/main'
      || startsWith(github.ref, 'refs/tags/'))))
    needs:
      - ci-diff
      - fast-validation-main-push-dedupe
      - fast-validation-preflight
      - fast-validation-ci-tiers
      - fast-validation-slack-bridge
      - fast-validation-web
      - fast-validation-journeys
      - queue-flake-publication
      - fast-validation-suite
      - fast-validation-docs
    # cas-59d3: key on the PULL REQUEST (falling back to the branch ref for
    # push events) and cancel superseded runs. Keying on the head SHA put every
    # push in its own group, so a rapid second push left the first run's full
    # validation consuming runners for work that could never be merged —
    # measured on PR #482, where macOS Check sat queued ~5min and the suite
    # archive build ~8min behind superseded runs of the same PR. Cancelling is
    # safe for required checks: merging requires the checks on the PR's CURRENT
    # head, which the newest run supplies, and a cancelled run always belonged
    # to a head that can no longer be merged. Keying by ref for pushes means a
    # factory branch only ever cancels its own older commit, never another
    # branch's.
    concurrency:
      group: fast-validation-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - name: Admit protected PR to merge-queue validation
        if: github.event_name == 'pull_request' || needs.ci-diff.result != 'success'
        env:
          CI_DIFF: ${{ needs.ci-diff.result }}
        run: |
          test "$CI_DIFF" = success
          echo "Fast Validation is deferred to the canonical merge-queue tree."

      - name: Require durable queue flake publication
        if: github.event_name == 'merge_group'
        env:
          PUBLICATION: ${{ needs.queue-flake-publication.result }}
        run: |
          case "$PUBLICATION" in
            success|skipped) ;;
            *) echo "::error::Queue flake publication did not complete"; exit 1 ;;
          esac

      - name: Require every Fast Validation lane to pass
        if: >-
          github.event_name != 'pull_request'
          && needs.fast-validation-main-push-dedupe.outputs.run-fast-validation == 'true'
        env:
          PREFLIGHT: ${{ needs.fast-validation-preflight.result }}
          SUITE: ${{ needs.fast-validation-suite.result }}
          DOCS: ${{ needs.fast-validation-docs.result }}
          CI_TIERS: ${{ needs.fast-validation-ci-tiers.result }}
          SLACK_BRIDGE: ${{ needs.fast-validation-slack-bridge.result }}
          WEB: ${{ needs.fast-validation-web.result }}
          JOURNEYS: ${{ needs.fast-validation-journeys.result }}
        run: |
          test "$PREFLIGHT" = success
          test "$SUITE" = success
          test "$DOCS" = success
          # Input-gated lanes: skipped when their inputs did not change, never
          # failed or cancelled. Report every red lane, not just the first.
          failed=0
          for lane in CI_TIERS SLACK_BRIDGE WEB JOURNEYS; do
            case "${!lane}" in
              success|skipped) ;;
              *) echo "::error title=Fast Validation::$lane lane is ${!lane}"; failed=1 ;;
            esac
          done
          exit "$failed"

      - name: Report successful merge-queue validation reused by this main push
        if: >-
          github.event_name == 'push'
          && github.ref == 'refs/heads/main'
          && needs.fast-validation-main-push-dedupe.outputs.run-fast-validation == 'false'
        env:
          VALIDATING_RUN_ID: ${{ needs.fast-validation-main-push-dedupe.outputs.validating-run-id }}
          PRIOR_RUN_URL: ${{ needs.fast-validation-main-push-dedupe.outputs.prior-run-url }}
        run: |
          echo "::notice title=Fast Validation deduplicated::Skipped the main-push suite because merge-queue run $VALIDATING_RUN_ID already validated this exact tree: $PRIOR_RUN_URL"
          echo "Fast Validation reused successful merge-queue run [$VALIDATING_RUN_ID]($PRIOR_RUN_URL)." >> "$GITHUB_STEP_SUMMARY"

      - name: Report the full-gate receipt reused by this merge-queue run
        if: >-
          github.event_name == 'merge_group'
          && needs.fast-validation-main-push-dedupe.outputs.run-fast-validation == 'false'
          && needs.fast-validation-main-push-dedupe.outputs.reuse-source == 'full-gate'
        env:
          PREFLIGHT: ${{ needs.fast-validation-preflight.result }}
          SLACK_BRIDGE: ${{ needs.fast-validation-slack-bridge.result }}
          JOURNEYS: ${{ needs.fast-validation-journeys.result }}
          VALIDATING_RUN_ID: ${{ needs.fast-validation-main-push-dedupe.outputs.validating-run-id }}
          PRIOR_RUN_URL: ${{ needs.fast-validation-main-push-dedupe.outputs.prior-run-url }}
          JOURNEYS_REUSE: ${{ needs.fast-validation-main-push-dedupe.outputs.journeys-reuse }}
          JOURNEYS_PRIOR_URL: ${{ needs.fast-validation-main-push-dedupe.outputs.journeys-prior-url }}
        run: |
          # The compile checks the full gate does not cover still ran, and the
          # journeys did too unless the train proved them on this tree (cas-9f70).
          test "$PREFLIGHT" = success
          [[ "$SLACK_BRIDGE" == success || "$SLACK_BRIDGE" == skipped ]]
          [[ "$JOURNEYS" == success || "$JOURNEYS" == skipped ]]
          if [[ "$JOURNEYS_REUSE" == true ]]; then
            journeys="the Commander journeys were reused from the train's full journeys run ($JOURNEYS_PRIOR_URL)"
          else
            journeys="the Commander journeys ran on the queue tree"
          fi
          echo "::notice title=Fast Validation reused the full gate::The release train's full gate proved this exact tree ($VALIDATING_RUN_ID): $PRIOR_RUN_URL. Skipped the suite, doctests and gate-covered preflight steps; $journeys; the compile checks and macOS Check ran."
          echo "Fast Validation reused the release train's full gate ($VALIDATING_RUN_ID, $PRIOR_RUN_URL) for the suite, doctests and gate-covered preflight steps. On the queue tree, $journeys; the compile checks and macOS Check ran." >> "$GITHUB_STEP_SUMMARY"

      # This artifact is published only after the merge-group Fast Validation
      # fan-in passes. A later main push may reuse it only after the workflow
      # itself concludes successfully, so it cannot turn a partial queue run
      # into a false green shortcut.
      - uses: actions/checkout@v4
        if: github.event_name == 'merge_group'
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - id: merge-queue-tree
        name: Compute successful merge-queue tree receipt
        if: github.event_name == 'merge_group'
        run: |
          tree_hash="$(git rev-parse 'HEAD^{tree}')"
          echo "hash=$tree_hash" >> "$GITHUB_OUTPUT"
          printf 'tree=%s\ncommit=%s\nrun=%s/actions/runs/%s\n' \
            "$tree_hash" "$GITHUB_SHA" \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" \
            > merge-queue-validation-receipt.txt

      - name: Publish successful merge-queue tree receipt
        if: github.event_name == 'merge_group'
        uses: actions/upload-artifact@v4
        with:
          name: merge-queue-validated-tree-${{ steps.merge-queue-tree.outputs.hash }}
          path: merge-queue-validation-receipt.txt
          retention-days: 30
          if-no-files-found: error

  # Advisory lint, split out of Fast Validation so a lint pass never sits on the
  # critical path of the job that answers "do the tests pass?" (GH #142).
  # It compiles its own --all-targets artifacts; it executes no tests.
  clippy:
    name: Clippy (advisory, compiles only — no test suite)
    if: >-
      needs.ci-diff.outputs.class != 'docs-only'
      && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
      || (github.event_name == 'push'
      && (github.ref == 'refs/heads/main'
      || github.ref == 'refs/heads/staging')))
    needs: ci-diff
    # Keep each heavy lane separate, but collapse superseded commits on the
    # same integration ref. Event type keeps scheduled/manual runs independent
    # of a rapid main or staging push.
    concurrency:
      group: heavy-tier-clippy-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - id: tree-dedupe
        name: Check for protected-PR validation of this tree
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/check-ci-tree-validation.sh

      - name: Report deduplicated heavy validation
        if: steps.tree-dedupe.outputs.run-heavy == 'false'
        env:
          PRIOR_RUN_URL: ${{ steps.tree-dedupe.outputs.prior-run-url }}
        run: echo "Skipping Clippy; this tree was validated by $PRIOR_RUN_URL"

      - uses: ./.github/actions/setup-rust-linux
        if: steps.tree-dedupe.outputs.run-heavy != 'false'
        with:
          cache-key: clippy

      - name: Clippy (report warnings)
        if: steps.tree-dedupe.outputs.run-heavy != 'false'
        env:
          ZIG: ${{ github.workspace }}/.context/zig/zig
        run: cargo clippy -p cas --all-targets

      - name: Report sccache stats
        if: always() && steps.tree-dedupe.outputs.run-heavy != 'false'
        run: |
          # Version skew (cas-3e14): the workflow can come from a newer main
          # while the checkout is an older head that predates this script.
          # Observability must never fail a lane that compiled and tested fine.
          if [[ -x ./scripts/ci-sccache-summary.sh ]]; then
            ./scripts/ci-sccache-summary.sh "Clippy"
          else
            echo "::notice title=sccache stats::scripts/ci-sccache-summary.sh is absent at this checkout; skipping cache reporting."
          fi

  # Keep this compile-only: --all-targets catches Darwin-only type errors in
  # production, test, example, and benchmark code without duplicating the full
  # Linux test suite on a more expensive runner. The full check runs on the
  # canonical merge-queue tree; main PRs emit only a hosted admission receipt
  # so their code is not compiled twice before it can enter that queue.
  # cas-861c0: it also runs on every main push, after the merge and off the
  # queue's critical path, so main saves the Darwin cargo cache. Queue refs can
  # read only their own and main's caches; with main never saving, every queue
  # entry compiled cold (0 hits / 698 misses, 12-14 min). Warm, the job took
  # 404 s (PR #1187 retry, 90% sccache hits), under the ~8.5 min Linux path.
  macos-check:
    name: macOS Check
    if: >-
      always() && needs.ci-diff.outputs.class != 'docs-only'
      && (github.event_name == 'pull_request'
      || (github.event_name == 'push' && github.ref == 'refs/heads/main')
      || needs.fast-validation-main-push-dedupe.outputs.run-fast-validation == 'true'
      || needs.fast-validation-main-push-dedupe.outputs.reuse-source == 'full-gate')
      && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
      || github.event_name == 'merge_group'
      || (github.event_name == 'pull_request'
      && github.base_ref == github.event.repository.default_branch)
      || (github.event_name == 'push'
      && (github.ref == 'refs/heads/main'
      || startsWith(github.ref, 'refs/tags/'))))
    needs: [ci-diff, fast-validation-main-push-dedupe]
    # cas-59d3: key on the PULL REQUEST (falling back to the branch ref for
    # push events) and cancel superseded runs. Keying on the head SHA put every
    # push in its own group, so a rapid second push left the first run's full
    # validation consuming runners for work that could never be merged —
    # measured on PR #482, where macOS Check sat queued ~5min and the suite
    # archive build ~8min behind superseded runs of the same PR. Cancelling is
    # safe for required checks: merging requires the checks on the PR's CURRENT
    # head, which the newest run supplies, and a cancelled run always belonged
    # to a head that can no longer be merged. Keying by ref for pushes means a
    # factory branch only ever cancels its own older commit, never another
    # branch's.
    concurrency:
      group: macos-check-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    # Zig 0.15.2 cannot link its build runner with the Xcode 26.6 / macOS 26.5
    # SDK that macos-latest selected in 2026-07. Keep the known-good Xcode 26.3
    # / macOS 26.2 SDK explicit until Zig is upgraded and verified against it.
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || 'macos-26' }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - name: Admit protected PR to merge-queue Darwin validation
        if: github.event_name == 'pull_request'
        run: |
          echo "macOS Check is deferred to the canonical merge-queue tree."

      - uses: actions/checkout@v4
        if: github.event_name != 'pull_request'
        with:
          submodules: recursive
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - id: classify-diff
        if: github.event_name != 'pull_request'
        uses: ./.github/actions/classify-required-diff
        with:
          base-sha: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}

      - name: Report Rust short-circuit
        if: >-
          github.event_name != 'pull_request'
          && steps.classify-diff.outputs.rust-unaffected == 'true'
        env:
          DIFF_CLASS: ${{ steps.classify-diff.outputs.class }}
        run: echo "macOS Rust checks skipped for $DIFF_CLASS diff."

      - name: Install Rust
        if: >-
          github.event_name != 'pull_request'
          && steps.classify-diff.outputs.rust-unaffected != 'true'
        uses: dtolnay/rust-toolchain@stable

      # ghostty_vt_sys builds its native library with Zig even for cargo check.
      - name: Install Zig
        if: >-
          github.event_name != 'pull_request'
          && steps.classify-diff.outputs.rust-unaffected != 'true'
        run: ./scripts/bootstrap-zig.sh

      # Zig discovers Darwin SDKs through xcrun, which follows DEVELOPER_DIR.
      # Keep this visible so runner-image/toolchain drift is diagnosable.
      - name: Report Apple and Zig toolchains
        if: >-
          github.event_name != 'pull_request'
          && steps.classify-diff.outputs.rust-unaffected != 'true'
        run: |
          echo "DEVELOPER_DIR=$DEVELOPER_DIR"
          xcode-select --print-path
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-path
          xcrun --sdk macosx --show-sdk-version
          ./.context/zig/zig version
          ./.context/zig/zig env

      - name: Setup sccache
        if: >-
          github.event_name != 'pull_request'
          && steps.classify-diff.outputs.rust-unaffected != 'true'
        id: setup-sccache
        continue-on-error: true
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Probe sccache backend
        if: >-
          github.event_name != 'pull_request'
          && steps.classify-diff.outputs.rust-unaffected != 'true'
        env:
          SCCACHE_OUTCOME: ${{ steps.setup-sccache.outcome }}
        shell: bash
        run: |
          if [[ "$SCCACHE_OUTCOME" != "success" ]] || ! sccache --start-server; then
            echo "::warning::sccache backend unavailable — building uncached"
            printf 'RUSTC_WRAPPER=\nSCCACHE_GHA_ENABLED=false\nSCCACHE_PATH=%s/scripts/sccache-unavailable.sh\n' \
              "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          fi

      - name: Cache cargo
        if: >-
          github.event_name != 'pull_request'
          && steps.classify-diff.outputs.rust-unaffected != 'true'
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          # Only main's cache is readable by later queue entries; a queue or
          # tag ref saving its own 333 MiB copy just evicts main's under the
          # repository's 10 GB cache cap.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check workspace
        if: >-
          github.event_name != 'pull_request'
          && steps.classify-diff.outputs.rust-unaffected != 'true'
        env:
          ZIG: ${{ github.workspace }}/.context/zig/zig
        run: cargo check --workspace --all-targets

      - name: Report sccache stats
        if: always() && github.event_name != 'pull_request' && steps.classify-diff.outputs.rust-unaffected != 'true'
        run: |
          # Version skew (cas-3e14): the workflow can come from a newer main
          # while the checkout is an older head that predates this script.
          # Observability must never fail a lane that compiled and tested fine.
          if [[ -x ./scripts/ci-sccache-summary.sh ]]; then
            ./scripts/ci-sccache-summary.sh "macOS Check"
          else
            echo "::notice title=sccache stats::scripts/ci-sccache-summary.sh is absent at this checkout; skipping cache reporting."
          fi

  # A receipt is trustworthy only after every per-tree PR lane passes. The
  # artifact name is the checked-out Git tree, so a merge commit with identical
  # contents can reuse it even though the commit SHA changed.
  record-pr-validation:
    name: Record protected PR tree validation
    if: >-
      needs.ci-diff.outputs.class != 'docs-only'
      && github.event_name == 'pull_request'
      && github.base_ref == github.event.repository.default_branch
      && needs.fast-validation.result == 'success'
      && needs.macos-check.result == 'success'
      && needs.clippy.result == 'success'
      && needs.test-compile-guard.result == 'success'
    needs: [ci-diff, fast-validation, macos-check, clippy, test-compile-guard]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - id: tree
        name: Compute validated tree receipt
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          tree_hash="$(git rev-parse 'HEAD^{tree}')"
          echo "hash=$tree_hash" >> "$GITHUB_OUTPUT"
          printf 'tree=%s\ncommit=%s\nrun=%s/actions/runs/%s\n' \
            "$tree_hash" "$PR_HEAD_SHA" \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" \
            > pr-validation-receipt.txt

      - name: Publish tree validation receipt
        uses: actions/upload-artifact@v4
        with:
          name: pr-validated-tree-${{ steps.tree.outputs.hash }}
          path: pr-validation-receipt.txt
          retention-days: 30
          if-no-files-found: error

  # ┌───────────────────────────────────────────────────────────────────────┐
  # │ THIS JOB RUNS NO TESTS. Its green means "the test binaries still      │
  # │ compile" — nothing about whether they pass.                           │
  # └───────────────────────────────────────────────────────────────────────┘
  #
  # Why the warning exists (GH #138): a green compile-only job was read as
  # suite coverage while Fast Validation was red on the same commit, turning a
  # 100% deterministic failure (GH #136) into a day-long "flaky test" hunt.
  # `Fast Validation` is the ONLY job that executes the suite.
  #
  # If you add a step here that DOES execute tests, rename this job to match.
  test-compile-guard:
    name: Test Compile Guard (compile-only, executes nothing)
    if: >-
      needs.ci-diff.outputs.class != 'docs-only'
      && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
      || (github.event_name == 'push'
      && (github.ref == 'refs/heads/main'
      || github.ref == 'refs/heads/staging')))
    needs: ci-diff
    # See clippy: a newer integration commit cancels only this lane's stale
    # work, while scheduled/manual work uses an event-distinct group.
    concurrency:
      group: heavy-tier-test-compile-guard-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - id: tree-dedupe
        name: Check for protected-PR validation of this tree
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/check-ci-tree-validation.sh

      - name: Report deduplicated heavy validation
        if: steps.tree-dedupe.outputs.run-heavy == 'false'
        env:
          PRIOR_RUN_URL: ${{ steps.tree-dedupe.outputs.prior-run-url }}
        run: echo "Skipping test compilation; this tree was validated by $PRIOR_RUN_URL"

      - uses: ./.github/actions/setup-rust-linux
        if: steps.tree-dedupe.outputs.run-heavy != 'false'
        with:
          cache-key: test-compile-guard

      # --no-run COMPILES the test binaries and executes nothing. A green here
      # says the tests still build; it says nothing about whether they pass.
      - name: Compile tests only (--no-run, executes nothing)
        if: steps.tree-dedupe.outputs.run-heavy != 'false'
        env:
          ZIG: ${{ github.workspace }}/.context/zig/zig
        run: cargo test -p cas --no-run

      - name: Report sccache stats
        if: always() && steps.tree-dedupe.outputs.run-heavy != 'false'
        run: |
          # Version skew (cas-3e14): the workflow can come from a newer main
          # while the checkout is an older head that predates this script.
          # Observability must never fail a lane that compiled and tested fine.
          if [[ -x ./scripts/ci-sccache-summary.sh ]]; then
            ./scripts/ci-sccache-summary.sh "Test Compile Guard"
          else
            echo "::notice title=sccache stats::scripts/ci-sccache-summary.sh is absent at this checkout; skipping cache reporting."
          fi

  # EPIC cas-c351 / cas-9e02: run the A2/A3/B3 panic-isolation tests under the
  # release profiles to catch any future profile change that silently
  # re-introduces panic=abort, or any release-mode codegen that breaks the
  # tokio::spawn panic catcher.
  #
  # `--release` and `--profile release-fast` are two independent full LTO
  # builds. They ran back-to-back inside one job (~30m in series); as two jobs
  # they run concurrently and each keeps its own warm cargo cache. Between them
  # they execute exactly the four invocations `make test-release-panic` always
  # ran, and that Makefile target still runs both for local use.
  #
  # These execute a NAMED SUBSET (panic_regression + search_utf8_regression_test),
  # not the suite. Green here is not suite coverage.
  panic-isolation-release:
    name: Panic Isolation — release profile (named subset, not the suite)
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    concurrency:
      group: heavy-tier-panic-isolation-release-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-rust-linux
        with:
          cache-key: panic-isolation-release

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      - name: Panic-isolation tests (--release)
        env:
          ZIG: ${{ github.workspace }}/.context/zig/zig
        run: make -C cas-cli test-release-panic-release

      - name: Report sccache stats
        if: always()
        run: |
          # Version skew (cas-3e14): the workflow can come from a newer main
          # while the checkout is an older head that predates this script.
          # Observability must never fail a lane that compiled and tested fine.
          if [[ -x ./scripts/ci-sccache-summary.sh ]]; then
            ./scripts/ci-sccache-summary.sh "Panic Isolation — release profile"
          else
            echo "::notice title=sccache stats::scripts/ci-sccache-summary.sh is absent at this checkout; skipping cache reporting."
          fi

  panic-isolation-release-fast:
    name: Panic Isolation — release-fast profile (named subset, not the suite)
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    concurrency:
      group: heavy-tier-panic-isolation-release-fast-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-rust-linux
        with:
          cache-key: panic-isolation-release-fast

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      - name: Panic-isolation tests (--profile release-fast)
        env:
          ZIG: ${{ github.workspace }}/.context/zig/zig
        run: make -C cas-cli test-release-panic-release-fast

      - name: Report sccache stats
        if: always()
        run: |
          # Version skew (cas-3e14): the workflow can come from a newer main
          # while the checkout is an older head that predates this script.
          # Observability must never fail a lane that compiled and tested fine.
          if [[ -x ./scripts/ci-sccache-summary.sh ]]; then
            ./scripts/ci-sccache-summary.sh "Panic Isolation — release-fast profile"
          else
            echo "::notice title=sccache stats::scripts/ci-sccache-summary.sh is absent at this checkout; skipping cache reporting."
          fi

  # Build-time measurement only. This job executes no tests.
  #
  # save-cache: false is load-bearing. scripts/benchmark-build.sh starts with
  # `cargo clean` — that is the point, it measures clean builds — so saving the
  # cargo cache from this job would persist an empty target dir. While these
  # steps lived in the same job as the release/compile work, that clean was
  # wiping the cache those steps depended on and every run paid a near-cold
  # build.
  build-benchmark:
    name: Build Benchmark & Timings (measurement only, no test suite)
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    concurrency:
      group: heavy-tier-build-benchmark-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    # DELIBERATELY UNCACHED — the one compiling job exempt from the compiler
    # cache contract at the top of this file. It measures a genuinely cold
    # compiler; letting the remote sccache serve objects after `cargo clean`
    # would turn the benchmark into a cache benchmark and make its historical
    # regression threshold meaningless. Both overrides below are load-bearing,
    # and this job intentionally has no `Report sccache stats` step: there is no
    # cache to report on, and a 0% summary here would read as a regression.
    # Do not "fix" this lane by enabling the cache.
    env:
      RUSTC_WRAPPER: ""
      SCCACHE_GHA_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-rust-linux
        with:
          cache-key: build-benchmark
          save-cache: "false"

      - name: Benchmark build
        env:
          ZIG: ${{ github.workspace }}/.context/zig/zig
          CAS_BENCH_MODE: quick
        run: ./scripts/benchmark-build.sh

      - name: Check build regression
        run: ./scripts/check-build-regression.sh

      - name: Build timings
        env:
          ZIG: ${{ github.workspace }}/.context/zig/zig
        run: cargo build -p cas --timings

      - name: Upload timings
        uses: actions/upload-artifact@v4
        with:
          name: cargo-timings
          path: target/cargo-timings

      - name: Upload benchmark
        uses: actions/upload-artifact@v4
        with:
          name: build-benchmark
          path: |
            history/build-benchmark-latest.md
            history/build-benchmark-latest.env
