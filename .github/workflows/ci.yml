name: CI

# ┌───────────────────────────────────────────────────────────────────────────┐
# │ WHAT EXECUTES THE TEST SUITE: the `Fast Validation — suite shard` jobs.  │
# │ Every other job in this file compiles things, fans in results, or runs a  │
# │ narrow, named subset. Read job names literally; they stay honest (#138). │
# └───────────────────────────────────────────────────────────────────────────┘
#
# Wall-clock shape (GH #142): total run time is max(job), not sum(job), so the
# jobs below are deliberately fanned out rather than chained inside one job.
# The four release/benchmark workloads used to run in series in a single job
# and cost ~51m; they are independent and now run concurrently.
#
# COMPILER CACHE CONTRACT (cas-67a2). Every job here that compiles Rust must:
#   1. configure the GitHub cache-v2 sccache backend — the workflow-level env
#      below does that for all of them, and only `build-benchmark` opts out; and
#   2. end with a `Report sccache stats` step calling
#      scripts/ci-sccache-summary.sh, so each job's hit rate is visible in its
#      job summary instead of buried in a log nobody greps.
# Warm lanes measured 90-92% hits while pre-cache-v2 lanes measured 0-6%; that
# difference is worth minutes per run and used to be invisible. The stats step
# is observability only — it always exits 0 and can never redden a lane.
# `build-benchmark` is the cold-build deliberately uncached compiling job: it
# measures a cold compiler, so it gets neither the backend nor a stats step.
# The self-hosted suite archive is the separate, merge-queue-gated exception:
# cas-065a clears its wrapper after the fail-open cache probe so an outage
# cannot block the lane.
# scripts/test-ci-test-tiers.sh pins all of this.

on:
  pull_request:
  # The protected-default merge queue creates a synthetic merged-tree ref. Its
  # required contexts must report on that ref or queue entries time out rather
  # than proving the tree that will actually land.
  merge_group:
  push:
    branches:
      - main
      - staging
      - "epic/**"
      - "factory/**"
    tags:
      - "v*"
  schedule:
    - cron: "0 8 * * 1"
  # Manual trigger. Without this a run cannot be forced from the CLI or API,
  # which matters on a fork: Actions start disabled and the first run can only
  # arrive via a push, a PR, or the weekly cron.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTC_WRAPPER: sccache
  # The action supplies GitHub cache-v2 credentials. Keep one explicit CAS
  # namespace so every CI job can reuse identical compiler objects.
  SCCACHE_GHA_ENABLED: "true"
  SCCACHE_GHA_VERSION: "cas-v2"

permissions:
  contents: read
  actions: read

jobs:
  # GitHub Actions cannot fall back after it has assigned an offline
  # self-hosted runner: the job would simply remain queued. Select the runner
  # before assignment instead. The repository variable is deliberately
  # opt-in; its absent/disabled state is the fail-safe hosted path used before
  # maintenance or whenever the runner's health is not established.
  #
  # This job never checks out the merge-queue tree and only selects a label.
  # Therefore fork/pull-request code cannot use the persistent runner. The
  # actual archive job repeats the merge_group-only guard before it compiles.
  fast-validation-runner-route:
    name: Fast Validation — merge-queue runner route
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
      || github.event_name == 'merge_group'
      || (github.event_name == 'push'
      && (github.ref == 'refs/heads/main'
      || startsWith(github.ref, 'refs/tags/')))
    runs-on: ubuntu-latest
    outputs:
      runner: ${{ steps.route.outputs.runner }}
      mode: ${{ steps.route.outputs.mode }}
    steps:
      - id: route
        env:
          EVENT_NAME: ${{ github.event_name }}
          SELF_HOSTED_ENABLED: ${{ vars.CASSY_MERGE_QUEUE_SELF_HOSTED }}
        run: |
          if [[ "$EVENT_NAME" == merge_group && "$SELF_HOSTED_ENABLED" == enabled ]]; then
            echo 'runner=["self-hosted","Linux","X64","cas-ci-32core"]' >> "$GITHUB_OUTPUT"
            echo 'mode=self-hosted' >> "$GITHUB_OUTPUT"
          else
            echo 'runner=["ubuntu-latest"]' >> "$GITHUB_OUTPUT"
            echo 'mode=hosted' >> "$GITHUB_OUTPUT"
          fi

  # A merge queue validates a synthetic tree, then GitHub pushes that exact
  # tree to main. Re-running the Fast Validation family on that push wastes
  # hosted capacity without adding coverage. This gate is fail-closed: direct
  # pushes, bypass merges, lookup failures, and any different tree run the
  # complete suite normally.
  fast-validation-main-push-dedupe:
    name: Fast Validation — main-push tree dedupe
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
      || github.event_name == 'merge_group'
      || (github.event_name == 'push'
      && (github.ref == 'refs/heads/main'
      || startsWith(github.ref, 'refs/tags/')))
    runs-on: ubuntu-latest
    outputs:
      run-fast-validation: ${{ steps.tree-dedupe.outputs.run-fast-validation }}
      validating-run-id: ${{ steps.tree-dedupe.outputs.validating-run-id }}
      prior-run-url: ${{ steps.tree-dedupe.outputs.prior-run-url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - id: tree-dedupe
        name: Check for successful merge-queue validation of this tree
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/check-ci-merge-queue-validation.sh

  # Factory pushes and PRs that do not target the protected default branch get
  # one cheap target-scoped lane. Main PRs use the full required lanes below;
  # do not spend an additional runner on this redundant subset there.
  #
  # MERGE-LATENCY CONTRACT (cas-3e14). This lane is not a required check, but it
  # is the last check to report on a factory PR, so a merge that waits for all
  # checks waits for this one. Measured on PR #479: the push-event copy of this
  # job spent 4m39s in `cargo check` and 3m49s in the scoped test binary on a
  # docs-only diff — 8m28s of Rust work the required lanes had already
  # classified as unnecessary — and the PR merged 9 seconds after it finished.
  # Two things keep that from recurring, both fail-closed:
  #   1. the same shared diff classifier the required lanes use, so a
  #      Rust-unaffected diff skips Rust work here too; and
  #   2. a dedupe gate that stands down only when an open PR's head is exactly
  #      this SHA, i.e. the PR event is validating the identical commit.
  # The factory/** push trigger itself stays. Factory branches are integrated
  # into epic branches by a supervisor `git merge --no-ff` with no PR, so this
  # push lane is the only validation those commits ever get; removing it would
  # create a merge path with no validation at all.
  scoped-validation:
    name: Scoped Validation (factory/PR)
    if: >-
      (github.event_name == 'pull_request'
      && github.base_ref != github.event.repository.default_branch)
      || (github.event_name == 'push'
      && startsWith(github.ref, 'refs/heads/factory/'))
    permissions:
      contents: read
      actions: read
      # Read-only PR metadata for the dedupe gate below. Nothing writes.
      pull-requests: read
    # cas-59d3: key on the PULL REQUEST (falling back to the branch ref for
    # push events) and cancel superseded runs. Keying on the head SHA put every
    # push in its own group, so a rapid second push left the first run's full
    # validation consuming runners for work that could never be merged —
    # measured on PR #482, where macOS Check sat queued ~5min and the suite
    # archive build ~8min behind superseded runs of the same PR. Cancelling is
    # safe for required checks: merging requires the checks on the PR's CURRENT
    # head, which the newest run supplies, and a cancelled run always belonged
    # to a head that can no longer be merged. Keying by ref for pushes means a
    # factory branch only ever cancels its own older commit, never another
    # branch's.
    concurrency:
      group: scoped-validation-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      # Stand down only when the PR event is already validating this exact
      # commit: for a default-branch PR that is the strictly stronger required
      # Fast Validation tier, and for an epic-targeted PR it is this same lane.
      # Anything else — no PR, a PR whose head has moved on, an unparseable
      # answer, or an API failure — runs the lane. The guard absorbs those cases
      # itself and always exits 0, so it deliberately does NOT fail open with
      # `continue-on-error`: a guard that genuinely broke should redden this
      # lane rather than quietly decide for itself.
      - id: pr-dedupe
        name: Skip when a pull request event validates this head SHA
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/check-ci-pr-event-coverage.sh

      - id: classify-diff
        if: steps.pr-dedupe.outputs.covered != 'true'
        uses: ./.github/actions/classify-required-diff
        with:
          base-sha: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          # A branch's first push carries before=000... even when it is based on
          # main. Compare the complete branch diff against the protected base;
          # tags and every other uncertain event still fail closed.
          zero-base-ref: origin/${{ github.event.repository.default_branch }}

      - name: Test portable installer fixtures
        if: steps.pr-dedupe.outputs.covered != 'true'
        run: ./scripts/test-cas-install.sh

      - uses: ./.github/actions/setup-rust-linux
        if: >-
          steps.pr-dedupe.outputs.covered != 'true'
          && steps.classify-diff.outputs.rust-unaffected != 'true'
        with:
          cache-key: scoped-validation

      - name: Install nextest
        if: >-
          steps.pr-dedupe.outputs.covered != 'true'
          && steps.classify-diff.outputs.rust-unaffected != 'true'
        uses: taiki-e/install-action@nextest

      - name: Check library and test targets
        if: >-
          steps.pr-dedupe.outputs.covered != 'true'
          && steps.classify-diff.outputs.rust-unaffected != 'true'
        env:
          ZIG: ${{ github.workspace }}/.context/zig/zig
        run: cargo check -p cas --lib --tests

      - name: Test library target (one binary)
        if: >-
          steps.pr-dedupe.outputs.covered != 'true'
          && steps.classify-diff.outputs.rust-unaffected != 'true'
        env:
          ZIG: ${{ github.workspace }}/.context/zig/zig
        run: scripts/run-scoped-tests.sh -p cas --lib --no-fail-fast

      # cas-ad65: the library-only invocation above cannot exercise integration
      # snapshots. Route only their committed CLI-output input surfaces here;
      # PRs #649/#650 and PR #657 run 33435790948 reached the queue before
      # stale doctor_snapshot output was exercised. This remains one small
      # target within Scoped Validation, never a new CI lane.
      - name: Test snapshot-pinned CLI output surfaces
        if: >-
          steps.pr-dedupe.outputs.covered != 'true'
          && steps.classify-diff.outputs.rust-unaffected != 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          ZERO_BASE_REF: origin/${{ github.event.repository.default_branch }}
        run: scripts/check-scoped-snapshot-tests.sh --base-sha "$BASE_SHA" --zero-base-ref "$ZERO_BASE_REF"

      - name: Report why no Rust work ran
        if: >-
          steps.pr-dedupe.outputs.covered == 'true'
          || steps.classify-diff.outputs.rust-unaffected == 'true'
        run: |
          if [[ "${{ steps.pr-dedupe.outputs.covered }}" == "true" ]]; then
            echo "Skipped: a pull request event is validating this exact head SHA." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Skipped: diff class '${{ steps.classify-diff.outputs.class }}' is Rust-unaffected." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Report sccache stats
        if: always()
        run: |
          # Version skew (cas-3e14): the workflow can come from a newer main
          # while the checkout is an older head that predates this script.
          # Observability must never fail a lane that compiled and tested fine.
          if [[ -x ./scripts/ci-sccache-summary.sh ]]; then
            ./scripts/ci-sccache-summary.sh "Scoped Validation"
          else
            echo "::notice title=sccache stats::scripts/ci-sccache-summary.sh is absent at this checkout; skipping cache reporting."
          fi

  # Full Fast Validation runs exactly once on GitHub's canonical merge-queue
  # tree. The required rollup below emits a cheap hosted PR admission context,
  # then this job family validates the tree that will actually land. This avoids
  # compiling the PR head and its merge tree back-to-back. When the explicitly
  # trusted merge-queue runner is enabled, its persistent target and sccache
  # make all three compiling Linux lanes warm across synthetic queue refs.
  fast-validation-preflight:
    name: Fast Validation — preflight (no test suite)
    if: >-
      needs.fast-validation-main-push-dedupe.outputs.run-fast-validation == 'true'
      && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
      || github.event_name == 'merge_group'
      || (github.event_name == 'push'
      && (github.ref == 'refs/heads/main'
      || startsWith(github.ref, 'refs/tags/'))))
      && (needs.fast-validation-runner-route.outputs.mode != 'self-hosted'
      || (github.event_name == 'merge_group'
      && github.repository == 'Richards-LLC/cassy'
      && github.event.repository.fork == false
      && vars.CASSY_MERGE_QUEUE_SELF_HOSTED == 'enabled'))
    needs: [fast-validation-runner-route, fast-validation-main-push-dedupe]
    runs-on: ${{ fromJSON(needs.fast-validation-runner-route.outputs.runner) }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - id: classify-diff
        uses: ./.github/actions/classify-required-diff
        with:
          base-sha: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}

      - name: Verify merge-queue self-hosted trust boundary
        if: needs.fast-validation-runner-route.outputs.mode == 'self-hosted'
        env:
          SELF_HOSTED_ENABLED: ${{ vars.CASSY_MERGE_QUEUE_SELF_HOSTED }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = merge_group
          test "$GITHUB_REPOSITORY" = Richards-LLC/cassy
          test "$SELF_HOSTED_ENABLED" = enabled
          case "$GITHUB_REF" in
            refs/heads/gh-readonly-queue/*) ;;
            *) echo "self-hosted route received a non-queue ref: $GITHUB_REF" >&2; exit 1 ;;
          esac
          ./scripts/check-cassy-actions-runner-isolation.sh

      - name: Test portable installer fixtures
        run: ./scripts/test-cas-install.sh

      - name: Report Rust short-circuit
        if: steps.classify-diff.outputs.rust-unaffected == 'true'
        run: echo "Rust work skipped for ${{ steps.classify-diff.outputs.class }} diff."

      - if: >-
          steps.classify-diff.outputs.rust-unaffected != 'true'
          && needs.fast-validation-runner-route.outputs.mode == 'hosted'
        uses: ./.github/actions/setup-rust-linux
        with:
          cache-key: fast-validation

      - name: Set up shared self-hosted Rust toolchain
        if: >-
          steps.classify-diff.outputs.rust-unaffected != 'true'
          && needs.fast-validation-runner-route.outputs.mode == 'self-hosted'
        run: ./scripts/setup-cassy-actions-rust.sh

      - name: Install Zig on the isolated merge-queue runner
        if: >-
          steps.classify-diff.outputs.rust-unaffected != 'true'
          && needs.fast-validation-runner-route.outputs.mode == 'self-hosted'
        run: ./scripts/bootstrap-zig.sh

      - name: Verify private self-hosted sccache
        if: >-
          steps.classify-diff.outputs.rust-unaffected != 'true'
          && needs.fast-validation-runner-route.outputs.mode == 'self-hosted'
        continue-on-error: true
        run: |
          set -euo pipefail
          sccache rustc -vV
          sccache --show-stats

      - name: Build and test Commander web assets
        if: steps.classify-diff.outputs.web-check-needed == 'true'
        working-directory: hub-web
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
          git diff --exit-code -- dist

      - name: Check
        if: steps.classify-diff.outputs.rust-unaffected != 'true'
        env:
          ZIG: ${{ github.workspace }}/.context/zig/zig
        run: cargo check -p cas

      - name: Test portable x86_64 ISA audit
        if: steps.classify-diff.outputs.rust-unaffected != 'true'
        run: ./scripts/test-check-portable-x86_64-isa.sh

      - name: Test release publication guards
        if: steps.classify-diff.outputs.rust-unaffected != 'true'
        run: make -C cas-cli test-ci-tiers

      - name: Build (without MCP proxy)
        if: steps.classify-diff.outputs.rust-unaffected != 'true'
        env:
          ZIG: ${{ github.workspace }}/.context/zig/zig
        run: cargo build -p cas --no-default-features

      - name: Report sccache stats
        if: always() && steps.classify-diff.outputs.rust-unaffected != 'true'
        run: |
          # Version skew (cas-3e14): the workflow can come from a newer main
          # while the checkout is an older head that predates this script.
          # Observability must never fail a lane that compiled and tested fine.
          if [[ -x ./scripts/ci-sccache-summary.sh ]]; then
            ./scripts/ci-sccache-summary.sh "Fast Validation — preflight"
          else
            echo "::notice title=sccache stats::scripts/ci-sccache-summary.sh is absent at this checkout; skipping cache reporting."
          fi

  # Compile the workspace test graph once. The archive contains the binaries
  # and nextest metadata needed by the shard jobs below, avoiding three cold
  # runners rebuilding the same graph before their disjoint test partitions.
  fast-validation-suite-build:
    name: Fast Validation — suite archive build
    if: >-
      needs.fast-validation-main-push-dedupe.outputs.run-fast-validation == 'true'
      && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
      || github.event_name == 'merge_group'
      || (github.event_name == 'push'
      && (github.ref == 'refs/heads/main'
      || startsWith(github.ref, 'refs/tags/'))))
      && (needs.fast-validation-runner-route.outputs.mode != 'self-hosted'
      || (github.event_name == 'merge_group'
      && github.repository == 'Richards-LLC/cassy'
      && github.event.repository.fork == false
      && vars.CASSY_MERGE_QUEUE_SELF_HOSTED == 'enabled'))
    needs: [fast-validation-runner-route, fast-validation-main-push-dedupe]
    runs-on: ${{ fromJSON(needs.fast-validation-runner-route.outputs.runner) }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - id: classify-diff
        uses: ./.github/actions/classify-required-diff
        with:
          base-sha: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}

      - name: Verify merge-queue self-hosted trust boundary
        if: needs.fast-validation-runner-route.outputs.mode == 'self-hosted'
        env:
          SELF_HOSTED_ENABLED: ${{ vars.CASSY_MERGE_QUEUE_SELF_HOSTED }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = merge_group
          test "$GITHUB_REPOSITORY" = Richards-LLC/cassy
          test "$SELF_HOSTED_ENABLED" = enabled
          case "$GITHUB_REF" in
            refs/heads/gh-readonly-queue/*) ;;
            *) echo "self-hosted route received a non-queue ref: $GITHUB_REF" >&2; exit 1 ;;
          esac
          ./scripts/check-cassy-actions-runner-isolation.sh

      - name: Report Rust short-circuit
        if: steps.classify-diff.outputs.rust-unaffected == 'true'
        run: echo "Rust suite archive build skipped for ${{ steps.classify-diff.outputs.class }} diff."

      - if: >-
          steps.classify-diff.outputs.rust-unaffected != 'true'
          && needs.fast-validation-runner-route.outputs.mode == 'hosted'
        uses: ./.github/actions/setup-rust-linux
        with:
          cache-key: fast-validation-suite-archive

      - name: Set up shared self-hosted Rust toolchain
        if: >-
          steps.classify-diff.outputs.rust-unaffected != 'true'
          && needs.fast-validation-runner-route.outputs.mode == 'self-hosted'
        run: ./scripts/setup-cassy-actions-rust.sh

      - name: Install Zig on the isolated merge-queue runner
        if: >-
          steps.classify-diff.outputs.rust-unaffected != 'true'
          && needs.fast-validation-runner-route.outputs.mode == 'self-hosted'
        run: ./scripts/bootstrap-zig.sh

      - name: Install nextest
        if: steps.classify-diff.outputs.rust-unaffected != 'true'
        uses: taiki-e/install-action@nextest

      - name: Verify private self-hosted sccache
        if: >-
          steps.classify-diff.outputs.rust-unaffected != 'true'
          && needs.fast-validation-runner-route.outputs.mode == 'self-hosted'
        # cas-065a: cache isolation stays observable, but its TCP failure must
        # not block the merge queue while the server defect is investigated.
        continue-on-error: true
        run: |
          set -euo pipefail
          sccache rustc -vV
          sccache --show-stats

      - name: Disable sccache for the self-hosted suite archive
        if: >-
          steps.classify-diff.outputs.rust-unaffected != 'true'
          && needs.fast-validation-runner-route.outputs.mode == 'self-hosted'
        # cas-065a: the cache is an optimization, not a merge-queue prerequisite.
        run: echo 'RUSTC_WRAPPER=' >> "$GITHUB_ENV"

      # Debug info is stripped from the archived test binaries (cas-59d3).
      # Every shard downloads this whole artifact, so its size is multiplied by
      # the shard count and lands directly on the PR critical path: measured at
      # 4034 MB, the three shards spent 404s, 257s and 63s downloading it to
      # run 108s, 105s and 101s of tests. The shards were never skewed — the
      # download was. Stripping debug info measured 65% smaller binaries on
      # this workspace (1344 MB of test binaries -> 476 MB with
      # `strip --strip-debug`).
      #
      # The cost is that a CI failure's backtrace loses line numbers; the test
      # name and assertion message are unaffected, and anyone who needs a
      # symbolised trace reproduces locally, where the normal `dev` profile
      # (debug = 1) still applies. This override is scoped to this job only.
      - name: Build full suite archive
        if: steps.classify-diff.outputs.rust-unaffected != 'true'
        env:
          ZIG: ${{ github.workspace }}/.context/zig/zig
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"
          CARGO_PROFILE_DEV_STRIP: debuginfo
          CARGO_PROFILE_TEST_STRIP: debuginfo
        run: cargo nextest archive --workspace --archive-file fast-validation-suite.tar.zst

      # The archive carries test executables, but integration tests that spawn
      # `cas` resolve it from target/debug/. Package that runner separately:
      # upload-artifact intentionally does not preserve executable mode bits.
      - name: Package CLI runner
        if: steps.classify-diff.outputs.rust-unaffected != 'true'
        run: |
          tar -C "${CARGO_TARGET_DIR:-target}/debug" \
            --transform='s,^cas$,target/debug/cas,' \
            -czf fast-validation-suite-runner.tar.gz cas

      - name: Upload full suite archive and CLI runner
        if: steps.classify-diff.outputs.rust-unaffected != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: fast-validation-suite-archive
          path: |
            fast-validation-suite.tar.zst
            fast-validation-suite-runner.tar.gz
          retention-days: 1
          compression-level: 0

      # This lane compiles the whole workspace test graph, so its hit rate is
      # the single best predictor of the required critical path.
      - name: Report sccache stats
        if: always() && steps.classify-diff.outputs.rust-unaffected != 'true'
        run: |
          # Version skew (cas-3e14): the workflow can come from a newer main
          # while the checkout is an older head that predates this script.
          # Observability must never fail a lane that compiled and tested fine.
          if [[ -x ./scripts/ci-sccache-summary.sh ]]; then
            ./scripts/ci-sccache-summary.sh "Fast Validation — suite archive build"
          else
            echo "::notice title=sccache stats::scripts/ci-sccache-summary.sh is absent at this checkout; skipping cache reporting."
          fi

  fast-validation-suite-shards:
    name: Fast Validation — suite shard ${{ matrix.shard }}/3
    if: >-
      needs.fast-validation-main-push-dedupe.outputs.run-fast-validation == 'true'
      && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
      || github.event_name == 'merge_group'
      || (github.event_name == 'push'
      && (github.ref == 'refs/heads/main'
      || startsWith(github.ref, 'refs/tags/'))))
    needs: [fast-validation-suite-build, fast-validation-main-push-dedupe]
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - id: classify-diff
        uses: ./.github/actions/classify-required-diff
        with:
          base-sha: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}

      - name: Report Rust short-circuit
        if: steps.classify-diff.outputs.rust-unaffected == 'true'
        run: echo "Rust suite shard skipped for ${{ steps.classify-diff.outputs.class }} diff."

      - name: Install nextest
        if: steps.classify-diff.outputs.rust-unaffected != 'true'
        uses: taiki-e/install-action@nextest

      - name: Download full suite archive
        if: steps.classify-diff.outputs.rust-unaffected != 'true'
        uses: actions/download-artifact@v4
        with:
          name: fast-validation-suite-archive
          path: .

      - name: Restore executable CLI runner
        if: steps.classify-diff.outputs.rust-unaffected != 'true'
        run: |
          tar -xzf fast-validation-suite-runner.tar.gz
          test -x target/debug/cas

      # count:1/3 through count:3/3 are disjoint and exhaustive. Keep
      # --no-fail-fast so failures never mask later binaries; doctests stay in
      # their own required lane because nextest cannot run them. Remap the
      # self-hosted producer workspace to this hosted checkout (cas-c4a5).
      # Insta also resolves snapshots at runtime from its producer path, so
      # pin its workspace root to this hosted checkout.
      - name: Test full suite shard ${{ matrix.shard }}/3
        if: steps.classify-diff.outputs.rust-unaffected != 'true'
        env:
          INSTA_WORKSPACE_ROOT: ${{ github.workspace }}
        run: scripts/run-verified-tests.sh nextest run --archive-file fast-validation-suite.tar.zst --workspace-remap "$GITHUB_WORKSPACE" --no-fail-fast --partition count:${{ matrix.shard }}/3

  # Keep the protected ruleset's exact full-suite context while the actual
  # test execution fans out after the shared archive. This job runs even when a shard fails and
  # makes a failed or cancelled shard fail the required check.
  fast-validation-suite:
    name: Fast Validation — full suite
    if: >-
      always() && needs.fast-validation-main-push-dedupe.outputs.run-fast-validation == 'true'
      && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
      || github.event_name == 'merge_group'
      || (github.event_name == 'push'
      && (github.ref == 'refs/heads/main'
      || startsWith(github.ref, 'refs/tags/'))))
    needs: [fast-validation-suite-shards, fast-validation-main-push-dedupe]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - id: classify-diff
        uses: ./.github/actions/classify-required-diff
        with:
          base-sha: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}

      - name: Report Rust short-circuit
        if: steps.classify-diff.outputs.rust-unaffected == 'true'
        run: echo "Full-suite fan-in short-circuited for ${{ steps.classify-diff.outputs.class }} diff."

      - name: Require every suite shard to pass
        env:
          SHARDS: ${{ needs.fast-validation-suite-shards.result }}
        run: test "$SHARDS" = success

  fast-validation-docs:
    name: Fast Validation — doctests
    if: >-
      needs.fast-validation-main-push-dedupe.outputs.run-fast-validation == 'true'
      && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
      || github.event_name == 'merge_group'
      || (github.event_name == 'push'
      && (github.ref == 'refs/heads/main'
      || startsWith(github.ref, 'refs/tags/'))))
      && (needs.fast-validation-runner-route.outputs.mode != 'self-hosted'
      || (github.event_name == 'merge_group'
      && github.repository == 'Richards-LLC/cassy'
      && github.event.repository.fork == false
      && vars.CASSY_MERGE_QUEUE_SELF_HOSTED == 'enabled'))
    needs: [fast-validation-runner-route, fast-validation-main-push-dedupe]
    runs-on: ${{ fromJSON(needs.fast-validation-runner-route.outputs.runner) }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - id: classify-diff
        uses: ./.github/actions/classify-required-diff
        with:
          base-sha: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}

      - name: Verify merge-queue self-hosted trust boundary
        if: needs.fast-validation-runner-route.outputs.mode == 'self-hosted'
        env:
          SELF_HOSTED_ENABLED: ${{ vars.CASSY_MERGE_QUEUE_SELF_HOSTED }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = merge_group
          test "$GITHUB_REPOSITORY" = Richards-LLC/cassy
          test "$SELF_HOSTED_ENABLED" = enabled
          case "$GITHUB_REF" in
            refs/heads/gh-readonly-queue/*) ;;
            *) echo "self-hosted route received a non-queue ref: $GITHUB_REF" >&2; exit 1 ;;
          esac
          ./scripts/check-cassy-actions-runner-isolation.sh

      - name: Report Rust short-circuit
        if: steps.classify-diff.outputs.rust-unaffected == 'true'
        run: echo "Doctests skipped for ${{ steps.classify-diff.outputs.class }} diff."

      - if: >-
          steps.classify-diff.outputs.rust-unaffected != 'true'
          && needs.fast-validation-runner-route.outputs.mode == 'hosted'
        uses: ./.github/actions/setup-rust-linux
        with:
          cache-key: fast-validation-docs

      - name: Set up shared self-hosted Rust toolchain
        if: >-
          steps.classify-diff.outputs.rust-unaffected != 'true'
          && needs.fast-validation-runner-route.outputs.mode == 'self-hosted'
        run: ./scripts/setup-cassy-actions-rust.sh

      - name: Install Zig on the isolated merge-queue runner
        if: >-
          steps.classify-diff.outputs.rust-unaffected != 'true'
          && needs.fast-validation-runner-route.outputs.mode == 'self-hosted'
        run: ./scripts/bootstrap-zig.sh

      - name: Verify private self-hosted sccache
        if: >-
          steps.classify-diff.outputs.rust-unaffected != 'true'
          && needs.fast-validation-runner-route.outputs.mode == 'self-hosted'
        continue-on-error: true
        run: |
          set -euo pipefail
          sccache rustc -vV
          sccache --show-stats

      # nextest does not run doctests; keep this separate so it never waits
      # behind the partitioned suite.
      - name: Test doctests
        if: steps.classify-diff.outputs.rust-unaffected != 'true'
        env:
          ZIG: ${{ github.workspace }}/.context/zig/zig
        run: scripts/run-verified-tests.sh test -p cas --doc

      - name: Report sccache stats
        if: always() && steps.classify-diff.outputs.rust-unaffected != 'true'
        run: |
          # Version skew (cas-3e14): the workflow can come from a newer main
          # while the checkout is an older head that predates this script.
          # Observability must never fail a lane that compiled and tested fine.
          if [[ -x ./scripts/ci-sccache-summary.sh ]]; then
            ./scripts/ci-sccache-summary.sh "Fast Validation — doctests"
          else
            echo "::notice title=sccache stats::scripts/ci-sccache-summary.sh is absent at this checkout; skipping cache reporting."
          fi

  # The repository ruleset requires this exact check name. On merge_group it
  # reports success only after preflight, all exhaustive nextest shards, and
  # doctests pass. On a main PR it is a cheap hosted admission receipt; the
  # canonical merged tree receives the exhaustive validation before it lands.
  fast-validation:
    name: Fast Validation
    if: >-
      always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
      || github.event_name == 'merge_group'
      || (github.event_name == 'pull_request'
      && github.base_ref == github.event.repository.default_branch)
      || (github.event_name == 'push'
      && (github.ref == 'refs/heads/main'
      || startsWith(github.ref, 'refs/tags/'))))
    needs:
      - fast-validation-main-push-dedupe
      - fast-validation-preflight
      - fast-validation-suite
      - fast-validation-docs
    # cas-59d3: key on the PULL REQUEST (falling back to the branch ref for
    # push events) and cancel superseded runs. Keying on the head SHA put every
    # push in its own group, so a rapid second push left the first run's full
    # validation consuming runners for work that could never be merged —
    # measured on PR #482, where macOS Check sat queued ~5min and the suite
    # archive build ~8min behind superseded runs of the same PR. Cancelling is
    # safe for required checks: merging requires the checks on the PR's CURRENT
    # head, which the newest run supplies, and a cancelled run always belonged
    # to a head that can no longer be merged. Keying by ref for pushes means a
    # factory branch only ever cancels its own older commit, never another
    # branch's.
    concurrency:
      group: fast-validation-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - name: Admit protected PR to merge-queue validation
        if: github.event_name == 'pull_request'
        run: |
          echo "Fast Validation is deferred to the canonical merge-queue tree."

      - name: Require every Fast Validation lane to pass
        if: >-
          github.event_name != 'pull_request'
          && needs.fast-validation-main-push-dedupe.outputs.run-fast-validation == 'true'
        env:
          PREFLIGHT: ${{ needs.fast-validation-preflight.result }}
          SUITE: ${{ needs.fast-validation-suite.result }}
          DOCS: ${{ needs.fast-validation-docs.result }}
        run: |
          test "$PREFLIGHT" = success
          test "$SUITE" = success
          test "$DOCS" = success

      - name: Report successful merge-queue validation reused by this main push
        if: >-
          github.event_name == 'push'
          && github.ref == 'refs/heads/main'
          && needs.fast-validation-main-push-dedupe.outputs.run-fast-validation == 'false'
        run: |
          echo "::notice title=Fast Validation deduplicated::Skipped the main-push suite because merge-queue run ${{ needs.fast-validation-main-push-dedupe.outputs.validating-run-id }} already validated this exact tree: ${{ needs.fast-validation-main-push-dedupe.outputs.prior-run-url }}"
          echo "Fast Validation reused successful merge-queue run [${{ needs.fast-validation-main-push-dedupe.outputs.validating-run-id }}](${{ needs.fast-validation-main-push-dedupe.outputs.prior-run-url }})." >> "$GITHUB_STEP_SUMMARY"

      # This artifact is published only after the merge-group Fast Validation
      # fan-in passes. A later main push may reuse it only after the workflow
      # itself concludes successfully, so it cannot turn a partial queue run
      # into a false green shortcut.
      - uses: actions/checkout@v4
        if: github.event_name == 'merge_group'
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - id: merge-queue-tree
        name: Compute successful merge-queue tree receipt
        if: github.event_name == 'merge_group'
        run: |
          tree_hash="$(git rev-parse 'HEAD^{tree}')"
          echo "hash=$tree_hash" >> "$GITHUB_OUTPUT"
          printf 'tree=%s\ncommit=%s\nrun=%s/actions/runs/%s\n' \
            "$tree_hash" "${{ github.sha }}" \
            "${{ github.server_url }}/${{ github.repository }}" "${{ github.run_id }}" \
            > merge-queue-validation-receipt.txt

      - name: Publish successful merge-queue tree receipt
        if: github.event_name == 'merge_group'
        uses: actions/upload-artifact@v4
        with:
          name: merge-queue-validated-tree-${{ steps.merge-queue-tree.outputs.hash }}
          path: merge-queue-validation-receipt.txt
          retention-days: 30
          if-no-files-found: error

  # Advisory lint, split out of Fast Validation so a lint pass never sits on the
  # critical path of the job that answers "do the tests pass?" (GH #142).
  # It compiles its own --all-targets artifacts; it executes no tests.
  clippy:
    name: Clippy (advisory, compiles only — no test suite)
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
      || (github.event_name == 'push'
      && (github.ref == 'refs/heads/main'
      || github.ref == 'refs/heads/staging'))
    # Keep each heavy lane separate, but collapse superseded commits on the
    # same integration ref. Event type keeps scheduled/manual runs independent
    # of a rapid main or staging push.
    concurrency:
      group: heavy-tier-clippy-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - id: tree-dedupe
        name: Check for protected-PR validation of this tree
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/check-ci-tree-validation.sh

      - name: Report deduplicated heavy validation
        if: steps.tree-dedupe.outputs.run-heavy == 'false'
        run: echo "Skipping Clippy; this tree was validated by ${{ steps.tree-dedupe.outputs.prior-run-url }}"

      - uses: ./.github/actions/setup-rust-linux
        if: steps.tree-dedupe.outputs.run-heavy != 'false'
        with:
          cache-key: clippy

      - name: Clippy (report warnings)
        if: steps.tree-dedupe.outputs.run-heavy != 'false'
        env:
          ZIG: ${{ github.workspace }}/.context/zig/zig
        run: cargo clippy -p cas --all-targets

      - name: Report sccache stats
        if: always() && steps.tree-dedupe.outputs.run-heavy != 'false'
        run: |
          # Version skew (cas-3e14): the workflow can come from a newer main
          # while the checkout is an older head that predates this script.
          # Observability must never fail a lane that compiled and tested fine.
          if [[ -x ./scripts/ci-sccache-summary.sh ]]; then
            ./scripts/ci-sccache-summary.sh "Clippy"
          else
            echo "::notice title=sccache stats::scripts/ci-sccache-summary.sh is absent at this checkout; skipping cache reporting."
          fi

  # Keep this compile-only: --all-targets catches Darwin-only type errors in
  # production, test, example, and benchmark code without duplicating the full
  # Linux test suite on a more expensive runner. The full check runs on the
  # canonical merge-queue tree; main PRs emit only a hosted admission receipt
  # so their code is not compiled twice before it can enter that queue.
  macos-check:
    name: macOS Check
    if: >-
      always() && (github.event_name == 'pull_request'
      || needs.fast-validation-main-push-dedupe.outputs.run-fast-validation == 'true')
      && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
      || github.event_name == 'merge_group'
      || (github.event_name == 'pull_request'
      && github.base_ref == github.event.repository.default_branch)
      || (github.event_name == 'push'
      && (github.ref == 'refs/heads/main'
      || startsWith(github.ref, 'refs/tags/'))))
    needs: fast-validation-main-push-dedupe
    # cas-59d3: key on the PULL REQUEST (falling back to the branch ref for
    # push events) and cancel superseded runs. Keying on the head SHA put every
    # push in its own group, so a rapid second push left the first run's full
    # validation consuming runners for work that could never be merged —
    # measured on PR #482, where macOS Check sat queued ~5min and the suite
    # archive build ~8min behind superseded runs of the same PR. Cancelling is
    # safe for required checks: merging requires the checks on the PR's CURRENT
    # head, which the newest run supplies, and a cancelled run always belonged
    # to a head that can no longer be merged. Keying by ref for pushes means a
    # factory branch only ever cancels its own older commit, never another
    # branch's.
    concurrency:
      group: macos-check-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    # Zig 0.15.2 cannot link its build runner with the Xcode 26.6 / macOS 26.5
    # SDK that macos-latest selected in 2026-07. Keep the known-good Xcode 26.3
    # / macOS 26.2 SDK explicit until Zig is upgraded and verified against it.
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || 'macos-26' }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - name: Admit protected PR to merge-queue Darwin validation
        if: github.event_name == 'pull_request'
        run: |
          echo "macOS Check is deferred to the canonical merge-queue tree."

      - uses: actions/checkout@v4
        if: github.event_name != 'pull_request'
        with:
          submodules: recursive
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - id: classify-diff
        if: github.event_name != 'pull_request'
        uses: ./.github/actions/classify-required-diff
        with:
          base-sha: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}

      - name: Report Rust short-circuit
        if: >-
          github.event_name != 'pull_request'
          && steps.classify-diff.outputs.rust-unaffected == 'true'
        run: echo "macOS Rust checks skipped for ${{ steps.classify-diff.outputs.class }} diff."

      - name: Install Rust
        if: >-
          github.event_name != 'pull_request'
          && steps.classify-diff.outputs.rust-unaffected != 'true'
        uses: dtolnay/rust-toolchain@stable

      # ghostty_vt_sys builds its native library with Zig even for cargo check.
      - name: Install Zig
        if: >-
          github.event_name != 'pull_request'
          && steps.classify-diff.outputs.rust-unaffected != 'true'
        run: ./scripts/bootstrap-zig.sh

      # Zig discovers Darwin SDKs through xcrun, which follows DEVELOPER_DIR.
      # Keep this visible so runner-image/toolchain drift is diagnosable.
      - name: Report Apple and Zig toolchains
        if: >-
          github.event_name != 'pull_request'
          && steps.classify-diff.outputs.rust-unaffected != 'true'
        run: |
          echo "DEVELOPER_DIR=$DEVELOPER_DIR"
          xcode-select --print-path
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-path
          xcrun --sdk macosx --show-sdk-version
          ./.context/zig/zig version
          ./.context/zig/zig env

      - name: Setup sccache
        if: >-
          github.event_name != 'pull_request'
          && steps.classify-diff.outputs.rust-unaffected != 'true'
        id: setup-sccache
        continue-on-error: true
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Probe sccache backend
        if: >-
          github.event_name != 'pull_request'
          && steps.classify-diff.outputs.rust-unaffected != 'true'
        shell: bash
        run: |
          if [[ "${{ steps.setup-sccache.outcome }}" != "success" ]] || ! sccache --start-server; then
            echo "::warning::sccache backend unavailable — building uncached"
            echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"
            echo "SCCACHE_GHA_ENABLED=false" >> "$GITHUB_ENV"
            echo "SCCACHE_PATH=$GITHUB_WORKSPACE/scripts/sccache-unavailable.sh" >> "$GITHUB_ENV"
          fi

      - name: Cache cargo
        if: >-
          github.event_name != 'pull_request'
          && steps.classify-diff.outputs.rust-unaffected != 'true'
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Check workspace
        if: >-
          github.event_name != 'pull_request'
          && steps.classify-diff.outputs.rust-unaffected != 'true'
        env:
          ZIG: ${{ github.workspace }}/.context/zig/zig
        run: cargo check --workspace --all-targets

      - name: Report sccache stats
        if: always() && github.event_name != 'pull_request' && steps.classify-diff.outputs.rust-unaffected != 'true'
        run: |
          # Version skew (cas-3e14): the workflow can come from a newer main
          # while the checkout is an older head that predates this script.
          # Observability must never fail a lane that compiled and tested fine.
          if [[ -x ./scripts/ci-sccache-summary.sh ]]; then
            ./scripts/ci-sccache-summary.sh "macOS Check"
          else
            echo "::notice title=sccache stats::scripts/ci-sccache-summary.sh is absent at this checkout; skipping cache reporting."
          fi

  # A receipt is trustworthy only after every per-tree PR lane passes. The
  # artifact name is the checked-out Git tree, so a merge commit with identical
  # contents can reuse it even though the commit SHA changed.
  record-pr-validation:
    name: Record protected PR tree validation
    if: >-
      github.event_name == 'pull_request'
      && github.base_ref == github.event.repository.default_branch
      && needs.fast-validation.result == 'success'
      && needs.macos-check.result == 'success'
      && needs.clippy.result == 'success'
      && needs.test-compile-guard.result == 'success'
    needs: [fast-validation, macos-check, clippy, test-compile-guard]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - id: tree
        name: Compute validated tree receipt
        run: |
          tree_hash="$(git rev-parse 'HEAD^{tree}')"
          echo "hash=$tree_hash" >> "$GITHUB_OUTPUT"
          printf 'tree=%s\ncommit=%s\nrun=%s/actions/runs/%s\n' \
            "$tree_hash" "${{ github.event.pull_request.head.sha }}" \
            "${{ github.server_url }}/${{ github.repository }}" "${{ github.run_id }}" \
            > pr-validation-receipt.txt

      - name: Publish tree validation receipt
        uses: actions/upload-artifact@v4
        with:
          name: pr-validated-tree-${{ steps.tree.outputs.hash }}
          path: pr-validation-receipt.txt
          retention-days: 30
          if-no-files-found: error

  # ┌───────────────────────────────────────────────────────────────────────┐
  # │ THIS JOB RUNS NO TESTS. Its green means "the test binaries still      │
  # │ compile" — nothing about whether they pass.                           │
  # └───────────────────────────────────────────────────────────────────────┘
  #
  # Why the warning exists (GH #138): a green compile-only job was read as
  # suite coverage while Fast Validation was red on the same commit, turning a
  # 100% deterministic failure (GH #136) into a day-long "flaky test" hunt.
  # `Fast Validation` is the ONLY job that executes the suite.
  #
  # If you add a step here that DOES execute tests, rename this job to match.
  test-compile-guard:
    name: Test Compile Guard (compile-only, executes nothing)
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
      || (github.event_name == 'push'
      && (github.ref == 'refs/heads/main'
      || github.ref == 'refs/heads/staging'))
    # See clippy: a newer integration commit cancels only this lane's stale
    # work, while scheduled/manual work uses an event-distinct group.
    concurrency:
      group: heavy-tier-test-compile-guard-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - id: tree-dedupe
        name: Check for protected-PR validation of this tree
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/check-ci-tree-validation.sh

      - name: Report deduplicated heavy validation
        if: steps.tree-dedupe.outputs.run-heavy == 'false'
        run: echo "Skipping test compilation; this tree was validated by ${{ steps.tree-dedupe.outputs.prior-run-url }}"

      - uses: ./.github/actions/setup-rust-linux
        if: steps.tree-dedupe.outputs.run-heavy != 'false'
        with:
          cache-key: test-compile-guard

      # --no-run COMPILES the test binaries and executes nothing. A green here
      # says the tests still build; it says nothing about whether they pass.
      - name: Compile tests only (--no-run, executes nothing)
        if: steps.tree-dedupe.outputs.run-heavy != 'false'
        env:
          ZIG: ${{ github.workspace }}/.context/zig/zig
        run: cargo test -p cas --no-run

      - name: Report sccache stats
        if: always() && steps.tree-dedupe.outputs.run-heavy != 'false'
        run: |
          # Version skew (cas-3e14): the workflow can come from a newer main
          # while the checkout is an older head that predates this script.
          # Observability must never fail a lane that compiled and tested fine.
          if [[ -x ./scripts/ci-sccache-summary.sh ]]; then
            ./scripts/ci-sccache-summary.sh "Test Compile Guard"
          else
            echo "::notice title=sccache stats::scripts/ci-sccache-summary.sh is absent at this checkout; skipping cache reporting."
          fi

  # EPIC cas-c351 / cas-9e02: run the A2/A3/B3 panic-isolation tests under the
  # release profiles to catch any future profile change that silently
  # re-introduces panic=abort, or any release-mode codegen that breaks the
  # tokio::spawn panic catcher.
  #
  # `--release` and `--profile release-fast` are two independent full LTO
  # builds. They ran back-to-back inside one job (~30m in series); as two jobs
  # they run concurrently and each keeps its own warm cargo cache. Between them
  # they execute exactly the four invocations `make test-release-panic` always
  # ran, and that Makefile target still runs both for local use.
  #
  # These execute a NAMED SUBSET (panic_regression + search_utf8_regression_test),
  # not the suite. Green here is not suite coverage.
  panic-isolation-release:
    name: Panic Isolation — release profile (named subset, not the suite)
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    concurrency:
      group: heavy-tier-panic-isolation-release-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-rust-linux
        with:
          cache-key: panic-isolation-release

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      - name: Panic-isolation tests (--release)
        env:
          ZIG: ${{ github.workspace }}/.context/zig/zig
        run: make -C cas-cli test-release-panic-release

      - name: Report sccache stats
        if: always()
        run: |
          # Version skew (cas-3e14): the workflow can come from a newer main
          # while the checkout is an older head that predates this script.
          # Observability must never fail a lane that compiled and tested fine.
          if [[ -x ./scripts/ci-sccache-summary.sh ]]; then
            ./scripts/ci-sccache-summary.sh "Panic Isolation — release profile"
          else
            echo "::notice title=sccache stats::scripts/ci-sccache-summary.sh is absent at this checkout; skipping cache reporting."
          fi

  panic-isolation-release-fast:
    name: Panic Isolation — release-fast profile (named subset, not the suite)
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    concurrency:
      group: heavy-tier-panic-isolation-release-fast-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-rust-linux
        with:
          cache-key: panic-isolation-release-fast

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      - name: Panic-isolation tests (--profile release-fast)
        env:
          ZIG: ${{ github.workspace }}/.context/zig/zig
        run: make -C cas-cli test-release-panic-release-fast

      - name: Report sccache stats
        if: always()
        run: |
          # Version skew (cas-3e14): the workflow can come from a newer main
          # while the checkout is an older head that predates this script.
          # Observability must never fail a lane that compiled and tested fine.
          if [[ -x ./scripts/ci-sccache-summary.sh ]]; then
            ./scripts/ci-sccache-summary.sh "Panic Isolation — release-fast profile"
          else
            echo "::notice title=sccache stats::scripts/ci-sccache-summary.sh is absent at this checkout; skipping cache reporting."
          fi

  # Build-time measurement only. This job executes no tests.
  #
  # save-cache: false is load-bearing. scripts/benchmark-build.sh starts with
  # `cargo clean` — that is the point, it measures clean builds — so saving the
  # cargo cache from this job would persist an empty target dir. While these
  # steps lived in the same job as the release/compile work, that clean was
  # wiping the cache those steps depended on and every run paid a near-cold
  # build.
  build-benchmark:
    name: Build Benchmark & Timings (measurement only, no test suite)
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    concurrency:
      group: heavy-tier-build-benchmark-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    # DELIBERATELY UNCACHED — the one compiling job exempt from the compiler
    # cache contract at the top of this file. It measures a genuinely cold
    # compiler; letting the remote sccache serve objects after `cargo clean`
    # would turn the benchmark into a cache benchmark and make its historical
    # regression threshold meaningless. Both overrides below are load-bearing,
    # and this job intentionally has no `Report sccache stats` step: there is no
    # cache to report on, and a 0% summary here would read as a regression.
    # Do not "fix" this lane by enabling the cache.
    env:
      RUSTC_WRAPPER: ""
      SCCACHE_GHA_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-rust-linux
        with:
          cache-key: build-benchmark
          save-cache: "false"

      - name: Benchmark build
        env:
          ZIG: ${{ github.workspace }}/.context/zig/zig
          CAS_BENCH_MODE: quick
        run: ./scripts/benchmark-build.sh

      - name: Check build regression
        run: ./scripts/check-build-regression.sh

      - name: Build timings
        env:
          ZIG: ${{ github.workspace }}/.context/zig/zig
        run: cargo build -p cas --timings

      - name: Upload timings
        uses: actions/upload-artifact@v4
        with:
          name: cargo-timings
          path: target/cargo-timings

      - name: Upload benchmark
        uses: actions/upload-artifact@v4
        with:
          name: build-benchmark
          path: |
            history/build-benchmark-latest.md
            history/build-benchmark-latest.env
