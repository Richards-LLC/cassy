name: CI

# ┌───────────────────────────────────────────────────────────────────────────┐
# │ WHAT EXECUTES THE TEST SUITE: exactly one job — `Fast Validation`.        │
# │ Every other job in this file COMPILES things or runs a narrow, named      │
# │ subset. Read job names literally; they are kept honest on purpose (#138). │
# └───────────────────────────────────────────────────────────────────────────┘
#
# Wall-clock shape (GH #142): total run time is max(job), not sum(job), so the
# jobs below are deliberately fanned out rather than chained inside one job.
# The four release/benchmark workloads used to run in series in a single job
# and cost ~51m; they are independent and now run concurrently.

on:
  pull_request:
  push:
    branches:
      - main
      - "epic/**"
      - "factory/**"
    tags:
      - "v*"
  schedule:
    - cron: "0 8 * * 1"
  # Manual trigger. Without this a run cannot be forced from the CLI or API,
  # which matters on a fork: Actions start disabled and the first run can only
  # arrive via a push, a PR, or the weekly cron.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTC_WRAPPER: sccache
  # The action supplies GitHub cache-v2 credentials. Keep one explicit CAS
  # namespace so every CI job can reuse identical compiler objects.
  SCCACHE_GHA_ENABLED: "true"
  SCCACHE_GHA_VERSION: "cas-v2"

jobs:
  # Factory pushes and PRs that do not target the protected default branch get
  # one cheap target-scoped lane. Main PRs use the full required lanes below;
  # do not spend an additional runner on this redundant subset there.
  scoped-validation:
    name: Scoped Validation (factory/PR)
    if: >-
      (github.event_name == 'pull_request'
      && github.base_ref != github.event.repository.default_branch)
      || (github.event_name == 'push'
      && startsWith(github.ref, 'refs/heads/factory/'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-rust-linux
        with:
          cache-key: scoped-validation

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      - name: Check library and test targets
        env:
          ZIG: ${{ github.workspace }}/.context/zig/zig
        run: cargo check -p cas --lib --tests

      - name: Test library target (one binary)
        env:
          ZIG: ${{ github.workspace }}/.context/zig/zig
        run: scripts/run-scoped-tests.sh -p cas --lib --no-fail-fast

  # The required check is a fan-in over independent lanes. The full suite is
  # deliberately one lane: nextest partitions rebuild the same test graph on
  # separate runners, which made the measured PR slower rather than faster.
  # Preflight and doctests remain independent, so neither extends suite time.
  fast-validation-preflight:
    name: Fast Validation — preflight (no test suite)
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
      || (github.event_name == 'pull_request'
      && github.base_ref == github.event.repository.default_branch)
      || (github.event_name == 'push'
      && (github.ref == 'refs/heads/main'
      || startsWith(github.ref, 'refs/tags/')))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-rust-linux
        with:
          cache-key: fast-validation

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      - name: Build and test Commander web assets
        working-directory: hub-web
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
          git diff --exit-code -- dist

      - name: Check
        env:
          ZIG: ${{ github.workspace }}/.context/zig/zig
        run: cargo check -p cas

      - name: Test portable x86_64 ISA audit
        run: ./scripts/test-check-portable-x86_64-isa.sh

      - name: Build (without MCP proxy)
        env:
          ZIG: ${{ github.workspace }}/.context/zig/zig
        run: cargo build -p cas --no-default-features

  fast-validation-suite:
    name: Fast Validation — full suite
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
      || (github.event_name == 'pull_request'
      && github.base_ref == github.event.repository.default_branch)
      || (github.event_name == 'push'
      && (github.ref == 'refs/heads/main'
      || startsWith(github.ref, 'refs/tags/')))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-rust-linux
        with:
          cache-key: fast-validation-suite

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      # Cargo/sccache can reuse dependency objects here, but linking the 79
      # workspace test binaries is not cacheable. Preserve that exact-revision
      # output as a nextest archive: a warm rerun downloads the tested binaries
      # instead of spending another ~3m16 compiling and linking them.
      #
      # The UTC date is a real build input (build.rs embeds CAS_BUILD_DATE).
      # There is deliberately no restore-key prefix: a stale archive must never
      # substitute for this exact source, lockfile, toolchain, and build date.
      - name: Fingerprint exact test-binary inputs
        id: nextest-inputs
        shell: bash
        run: |
          printf 'build-date=%s\n' "$(date -u +%F)" >> "$GITHUB_OUTPUT"
          rustc -vV | sha256sum | awk '{ print "rust=" $1 }' >> "$GITHUB_OUTPUT"
          cargo nextest --version | sha256sum | awk '{ print "nextest=" $1 }' >> "$GITHUB_OUTPUT"

      - name: Restore exact-revision test binaries
        id: nextest-binaries
        uses: actions/cache/restore@v4
        with:
          path: .nextest-cache/cas-tests.tar.zst
          key: >-
            cas-nextest-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}-${{ hashFiles('Cargo.lock') }}-${{ steps.nextest-inputs.outputs.build-date }}-${{ steps.nextest-inputs.outputs.rust }}-${{ steps.nextest-inputs.outputs.nextest }}

      - name: Compile test binaries on cache miss
        if: steps.nextest-binaries.outputs.cache-hit != 'true'
        env:
          CARGO_PROFILE_TEST_DEBUG: "0"
          ZIG: ${{ github.workspace }}/.context/zig/zig
        run: |
          mkdir -p .nextest-cache
          cargo nextest archive -p cas --archive-file .nextest-cache/cas-tests.tar.zst

      # Keep --no-fail-fast so failures never mask later binaries. This runs
      # every archived test binary; the doctest lane below covers what nextest
      # cannot.
      - name: Test full suite
        run: >-
          cargo nextest run
          --archive-file .nextest-cache/cas-tests.tar.zst
          --no-fail-fast

      # Never bless a compile-only archive whose tests failed. PR caches are
      # scoped by Actions, and the exact key above is immutable for a rerun.
      - name: Save passing exact-revision test binaries
        if: success() && steps.nextest-binaries.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .nextest-cache/cas-tests.tar.zst
          key: ${{ steps.nextest-binaries.outputs.cache-primary-key }}

  fast-validation-docs:
    name: Fast Validation — doctests
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
      || (github.event_name == 'pull_request'
      && github.base_ref == github.event.repository.default_branch)
      || (github.event_name == 'push'
      && (github.ref == 'refs/heads/main'
      || startsWith(github.ref, 'refs/tags/')))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-rust-linux
        with:
          cache-key: fast-validation-docs

      # nextest does not run doctests; keep this separate so it never waits
      # behind the partitioned suite.
      - name: Test doctests
        env:
          ZIG: ${{ github.workspace }}/.context/zig/zig
        run: cargo test -p cas --doc

  # The repository ruleset requires this exact check name. It reports success
  # only after preflight, both exhaustive nextest partitions, and doctests pass.
  # Queue (rather than cancel) matching head-SHA checks per cas-9eaf; because
  # this fan-in does no compilation, a duplicate cannot inflate the PR path.
  fast-validation:
    name: Fast Validation
    if: >-
      always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
      || (github.event_name == 'pull_request'
      && github.base_ref == github.event.repository.default_branch)
      || (github.event_name == 'push'
      && (github.ref == 'refs/heads/main'
      || startsWith(github.ref, 'refs/tags/'))))
    needs:
      - fast-validation-preflight
      - fast-validation-suite
      - fast-validation-docs
    concurrency:
      group: fast-validation-${{ github.event.pull_request.head.sha || github.sha }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - name: Require every Fast Validation lane to pass
        env:
          PREFLIGHT: ${{ needs.fast-validation-preflight.result }}
          SUITE: ${{ needs.fast-validation-suite.result }}
          DOCS: ${{ needs.fast-validation-docs.result }}
        run: |
          test "$PREFLIGHT" = success
          test "$SUITE" = success
          test "$DOCS" = success

  # Advisory lint, split out of Fast Validation so a lint pass never sits on the
  # critical path of the job that answers "do the tests pass?" (GH #142).
  # It compiles its own --all-targets artifacts; it executes no tests.
  clippy:
    name: Clippy (advisory, compiles only — no test suite)
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
      || (github.event_name == 'push'
      && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-rust-linux
        with:
          cache-key: clippy

      - name: Clippy (report warnings)
        env:
          ZIG: ${{ github.workspace }}/.context/zig/zig
        run: cargo clippy -p cas --all-targets

  # Keep this compile-only: --all-targets catches Darwin-only type errors in
  # production, test, example, and benchmark code without duplicating the full
  # Linux test suite on a more expensive runner.
  macos-check:
    name: macOS Check
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
      || (github.event_name == 'pull_request'
      && github.base_ref == github.event.repository.default_branch)
      || (github.event_name == 'push'
      && (github.ref == 'refs/heads/main'
      || startsWith(github.ref, 'refs/tags/')))
    concurrency:
      group: macos-check-${{ github.event.pull_request.head.sha || github.sha }}
      cancel-in-progress: false
    # Zig 0.15.2 cannot link its build runner with the Xcode 26.6 / macOS 26.5
    # SDK that macos-latest selected in 2026-07. Keep the known-good Xcode 26.3
    # / macOS 26.2 SDK explicit until Zig is upgraded and verified against it.
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # ghostty_vt_sys builds its native library with Zig even for cargo check.
      - name: Install Zig
        run: ./scripts/bootstrap-zig.sh

      # Zig discovers Darwin SDKs through xcrun, which follows DEVELOPER_DIR.
      # Keep this visible so runner-image/toolchain drift is diagnosable.
      - name: Report Apple and Zig toolchains
        run: |
          echo "DEVELOPER_DIR=$DEVELOPER_DIR"
          xcode-select --print-path
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-path
          xcrun --sdk macosx --show-sdk-version
          ./.context/zig/zig version
          ./.context/zig/zig env

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Check workspace
        env:
          ZIG: ${{ github.workspace }}/.context/zig/zig
        run: cargo check --workspace --all-targets

      - name: Check (without MCP proxy)
        env:
          ZIG: ${{ github.workspace }}/.context/zig/zig
        run: cargo check -p cas --no-default-features

  # ┌───────────────────────────────────────────────────────────────────────┐
  # │ THIS JOB RUNS NO TESTS. Its green means "the test binaries still      │
  # │ compile" — nothing about whether they pass.                           │
  # └───────────────────────────────────────────────────────────────────────┘
  #
  # Why the warning exists (GH #138): a green compile-only job was read as
  # suite coverage while Fast Validation was red on the same commit, turning a
  # 100% deterministic failure (GH #136) into a day-long "flaky test" hunt.
  # `Fast Validation` is the ONLY job that executes the suite.
  #
  # If you add a step here that DOES execute tests, rename this job to match.
  test-compile-guard:
    name: Test Compile Guard (compile-only, executes nothing)
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
      || (github.event_name == 'push'
      && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-rust-linux
        with:
          cache-key: test-compile-guard

      # --no-run COMPILES the test binaries and executes nothing. A green here
      # says the tests still build; it says nothing about whether they pass.
      - name: Compile tests only (--no-run, executes nothing)
        env:
          ZIG: ${{ github.workspace }}/.context/zig/zig
        run: cargo test -p cas --no-run

  # EPIC cas-c351 / cas-9e02: run the A2/A3/B3 panic-isolation tests under the
  # release profiles to catch any future profile change that silently
  # re-introduces panic=abort, or any release-mode codegen that breaks the
  # tokio::spawn panic catcher.
  #
  # `--release` and `--profile release-fast` are two independent full LTO
  # builds. They ran back-to-back inside one job (~30m in series); as two jobs
  # they run concurrently and each keeps its own warm cargo cache. Between them
  # they execute exactly the four invocations `make test-release-panic` always
  # ran, and that Makefile target still runs both for local use.
  #
  # These execute a NAMED SUBSET (panic_regression + search_utf8_regression_test),
  # not the suite. Green here is not suite coverage.
  panic-isolation-release:
    name: Panic Isolation — release profile (named subset, not the suite)
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
      || (github.event_name == 'push'
      && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-rust-linux
        with:
          cache-key: panic-isolation-release

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      - name: Panic-isolation tests (--release)
        env:
          ZIG: ${{ github.workspace }}/.context/zig/zig
        run: make -C cas-cli test-release-panic-release

  panic-isolation-release-fast:
    name: Panic Isolation — release-fast profile (named subset, not the suite)
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
      || (github.event_name == 'push'
      && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-rust-linux
        with:
          cache-key: panic-isolation-release-fast

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      - name: Panic-isolation tests (--profile release-fast)
        env:
          ZIG: ${{ github.workspace }}/.context/zig/zig
        run: make -C cas-cli test-release-panic-release-fast

  # Build-time measurement only. This job executes no tests.
  #
  # save-cache: false is load-bearing. scripts/benchmark-build.sh starts with
  # `cargo clean` — that is the point, it measures clean builds — so saving the
  # cargo cache from this job would persist an empty target dir. While these
  # steps lived in the same job as the release/compile work, that clean was
  # wiping the cache those steps depended on and every run paid a near-cold
  # build.
  build-benchmark:
    name: Build Benchmark & Timings (measurement only, no test suite)
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
      || (github.event_name == 'push'
      && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    # This job measures a genuinely cold compiler. Letting the repaired remote
    # sccache serve objects after `cargo clean` would turn the benchmark into a
    # cache benchmark and make its historical regression threshold meaningless.
    env:
      RUSTC_WRAPPER: ""
      SCCACHE_GHA_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-rust-linux
        with:
          cache-key: build-benchmark
          save-cache: "false"

      - name: Benchmark build
        env:
          ZIG: ${{ github.workspace }}/.context/zig/zig
          CAS_BENCH_MODE: quick
        run: ./scripts/benchmark-build.sh

      - name: Check build regression
        run: ./scripts/check-build-regression.sh

      - name: Build timings
        env:
          ZIG: ${{ github.workspace }}/.context/zig/zig
        run: cargo build -p cas --timings

      - name: Upload timings
        uses: actions/upload-artifact@v4
        with:
          name: cargo-timings
          path: target/cargo-timings

      - name: Upload benchmark
        uses: actions/upload-artifact@v4
        with:
          name: build-benchmark
          path: |
            history/build-benchmark-latest.md
            history/build-benchmark-latest.env
