name: CI

# cas-0fc56: a merge into a release train starts no train suite; lane CI
# already proved that delivery. Cassy dispatches this workflow once per frozen
# train tip (train_ci::observe), and a frozen train accepts no merges that could
# supersede the run, so there is no cancellation group.
on:
  workflow_dispatch:
  merge_group:

permissions:
  contents: read
  actions: read

jobs:
  validation:
    name: Shared train and queue graph
    uses: ./.github/workflows/ci.yml
    with:
      full-set: true
    permissions:
      contents: write
      issues: write
      actions: read
      statuses: write
      pull-requests: read
  fast-validation:
    name: Fast Validation
    if: always()
    needs: validation
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULT: ${{ needs.validation.result }}
        run: test "$RESULT" = success
