name: CI

on:
  push:
    branches: ["epic/release-train-**"]
  merge_group:

concurrency:
  group: full-gate-${{ github.event_name == 'push' && github.ref || github.run_id }}
  # cas-43ab: finish the running train suite; GitHub replaces only pending runs.
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  train-push:
    name: Recognize prepared release push
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      prepared: ${{ steps.release.outputs.prepared }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if source="$(python3 scripts/train-ci.py prepared)" \
            && python3 scripts/train-ci.py check --branch "$GITHUB_REF_NAME" --head "$source" >/dev/null; then
            echo 'prepared=true' >> "$GITHUB_OUTPUT"
          else
            echo 'prepared=false' >> "$GITHUB_OUTPUT"
          fi
  validation:
    name: Shared train and queue graph
    needs: train-push
    if: always() && (github.event_name != 'push' || needs.train-push.outputs.prepared != 'true')
    uses: ./.github/workflows/ci.yml
    with:
      full-set: true
    permissions:
      contents: write
      issues: write
      actions: read
      statuses: write
      pull-requests: read
  fast-validation:
    name: Fast Validation
    if: always() && needs.validation.result != 'skipped'
    needs: validation
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULT: ${{ needs.validation.result }}
        run: test "$RESULT" = success
