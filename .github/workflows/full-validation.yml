name: CI

on:
  merge_group:

concurrency:
  group: full-gate-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  validation:
    name: Merge-queue proof
    uses: ./.github/workflows/ci.yml
    with:
      full-set: true
    permissions:
      contents: write
      issues: write
      actions: read
      statuses: write
      pull-requests: read
  fast-validation:
    name: Fast Validation
    if: always()
    needs: validation
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULT: ${{ needs.validation.result }}
        run: test "$RESULT" = success
