name: Release Prebuild

# Build the shipped release artifacts once, on the merge-queue tree (cas-f95b).
#
# scripts/release.sh commits the version bump into the epic PR, so the release
# tree exists when that PR enters the merge queue. This workflow runs on the
# same merge_group event as CI: when the queue entry changes the release
# version, both platform builds start at enqueue, in parallel with the tests,
# and upload artifacts named by platform. The queue builds one entry at a time
# and lands its merge commit as main, so release.yml adopts these artifacts by
# exact commit or tree id (scripts/find-release-prebuild.sh) and never
# rebuilds. Ordinary queue entries pay one ~20 s gate job and stop.
#
# The jobs here are not required status checks. A failed or missing build
# never blocks a merge; release.yml then builds the same bytes itself by
# calling this workflow (workflow_call), so the build steps exist once.
#
# Every lane is GitHub-hosted. workflow_dispatch builds the dispatched ref
# by default; seed_only proves the miss/save/hit gate without publishing.
on:
  merge_group:
  push:
    branches: [main]
  workflow_call:
    inputs:
      platform:
        type: string
        default: all
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build (all, linux or macos)
        type: choice
        options: [all, linux, macos]
        default: all
      seed_only:
        description: Seed missing dependency caches; skip compilation on an exact hit
        type: boolean
        default: false

permissions:
  contents: read

# Never cancel a prebuild: its artifacts are what the release adopts, and a
# cancelled prebuild silently sends the release to the fallback build.
concurrency:
  group: release-prebuild-${{ github.run_id }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # Optimized rustc work can take >600s without another request. sccache's
  # default idle shutdown allows only 10s for active clients before exiting.
  SCCACHE_IDLE_TIMEOUT: "0"
  SCCACHE_GHA_VERSION: "cas-v2"
  RELEASE_PROFILE: release-fast
  RELEASE_DIR: release-fast

jobs:
  # Cheap gate, merge_group only: is this queue entry a release? A called or
  # dispatched run has already decided to build and skips it.
  pending-release:
    name: Detect release version change
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    outputs:
      pending: ${{ steps.detect.outputs.pending }}
      version: ${{ steps.detect.outputs.version }}
      tag: ${{ steps.detect.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - id: detect
        name: Detect a version change against the queue base
        shell: bash
        env:
          BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail
          git fetch --quiet --depth=1 origin "$BASE_SHA"
          base_version="$(git show "$BASE_SHA:cas-cli/Cargo.toml" \
            | sed -n 's/^version = "\([^"]*\)"/\1/p' | head -n 1)"
          ./scripts/detect-pending-release.sh --base-version "$base_version" | tee -a "$GITHUB_OUTPUT"

      - name: Report gate decision
        env:
          PENDING: ${{ steps.detect.outputs.pending }}
          TAG: ${{ steps.detect.outputs.tag }}
        run: echo "pending=$PENDING tag=$TAG" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Prebuild Linux x86_64
    needs: pending-release
    if: >-
      !cancelled()
      && (needs.pending-release.result == 'skipped'
      || needs.pending-release.outputs.pending == 'true')
      && (inputs.platform == '' || inputs.platform == 'all' || inputs.platform == 'linux')
    runs-on: ubuntu-latest
    # Collapse overlapping main seeds; publication fallbacks and queue builds
    # keep their own run group so a seed never delays a release build.
    concurrency:
      group: release-deps-linux-${{ github.event_name == 'push' && inputs.platform == '' && 'seed-main' || github.run_id }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Identify release dependency cache
        id: cache-key
        run: python3 scripts/release-cache-key.py x86_64-unknown-linux-gnu | tee -a "$GITHUB_OUTPUT"

      # Scope is the run ref, not the checked-out SHA. A main push seeds only
      # after an exact-key lookup misses. Queue builds can read main's cache.
      - name: Look up release dependency cache
        id: cache-lookup
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cache-key.outputs.key }}
          lookup-only: true

      # A workflow_call inherits its caller's push event. Its nonempty
      # platform input distinguishes a publication fallback from a main seed.
      - name: Decide whether compilation is needed
        id: compile
        env:
          SEED_ONLY: ${{ (github.event_name == 'push' && inputs.platform == '') || inputs.seed_only }}
          CACHE_HIT: ${{ steps.cache-lookup.outputs.cache-hit }}
        run: |
          if [[ "$SEED_ONLY" == true && "$CACHE_HIT" == true ]]; then
            echo 'needed=false' >> "$GITHUB_OUTPUT"
            echo 'Exact release dependency cache hit; seed compilation skipped' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'needed=true' >> "$GITHUB_OUTPUT"
          fi

      # Dispatch seeds also restore on a hit to prove the save/restore path.
      # Ordinary main cache hits do not download or compile anything.
      - name: Restore release dependencies
        if: steps.compile.outputs.needed == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cache-key.outputs.key }}

      - name: Install pinned Rust
        if: steps.compile.outputs.needed == 'true'
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.cache-key.outputs.toolchain }}
          targets: x86_64-unknown-linux-gnu

      - name: Install Linux linker
        if: steps.compile.outputs.needed == 'true'
        run: |
          sudo apt-get update
          # Keep this aligned with .cargo/config.toml's gcc + mold toolchain.
          sudo apt-get install -y binutils file gcc mold
          gcc --version
          mold --version

      - name: Setup sccache
        if: steps.compile.outputs.needed == 'true'
        id: setup-sccache
        continue-on-error: true
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Probe sccache backend
        if: steps.compile.outputs.needed == 'true'
        env:
          SCCACHE_OUTCOME: ${{ steps.setup-sccache.outcome }}
        shell: bash
        run: |
          if [[ "$SCCACHE_OUTCOME" == "success" ]] && sccache --start-server; then
            printf 'RUSTC_WRAPPER=sccache\nSCCACHE_GHA_ENABLED=true\n' >> "$GITHUB_ENV"
          else
            echo "::warning::sccache backend unavailable — building uncached"
            printf 'RUSTC_WRAPPER=\nSCCACHE_GHA_ENABLED=false\nSCCACHE_PATH=%s/scripts/sccache-unavailable.sh\n' \
              "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          fi

      - name: Restore pinned Zig
        if: steps.compile.outputs.needed == 'true'
        id: zig-cache
        uses: actions/cache/restore@v4
        with:
          path: .context/zig
          key: release-zig-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/bootstrap-zig.sh') }}

      - name: Install Zig
        if: steps.compile.outputs.needed == 'true'
        run: ./scripts/bootstrap-zig.sh

      - name: Build
        if: steps.compile.outputs.needed == 'true'
        env:
          ZIG: ${{ github.workspace }}/.context/zig/zig
        run: |
          # The build-input audit below must inspect this build, never a
          # stale BLAKE3 output restored from the target cache.
          cargo clean -p blake3 --profile "$RELEASE_PROFILE" --target x86_64-unknown-linux-gnu
          cargo build -p cas --profile "$RELEASE_PROFILE" --target x86_64-unknown-linux-gnu --locked

      - name: Stage package
        if: steps.compile.outputs.needed == 'true'
        run: |
          mkdir -p package
          cp "${CARGO_TARGET_DIR:-target}/x86_64-unknown-linux-gnu/$RELEASE_DIR/cas" package/
          strip package/cas
          cp LICENSE package/

      # The BLAKE3 build-output audit needs the build directory, so it runs
      # here. The packaged-binary ISA audit and launch smoke run again in
      # release.yml on the exact archive that ships.
      - name: Audit build outputs and packaged Linux executable
        if: steps.compile.outputs.needed == 'true'
        run: |
          ./scripts/check-blake3-no-avx512-build.sh "${CARGO_TARGET_DIR:-target}/x86_64-unknown-linux-gnu/$RELEASE_DIR/build"
          ./scripts/test-check-portable-x86_64-isa.sh package/cas

      - name: Package
        if: steps.compile.outputs.needed == 'true'
        run: |
          cd package
          tar -czvf cas-x86_64-unknown-linux-gnu.tar.gz cas LICENSE
          mv cas-x86_64-unknown-linux-gnu.tar.gz ../

      - name: Upload artifact
        if: steps.compile.outputs.needed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cas-x86_64-unknown-linux-gnu
          path: cas-x86_64-unknown-linux-gnu.tar.gz
          retention-days: 14

      - name: Report sccache stats
        if: always() && steps.compile.outputs.needed == 'true'
        run: |
          if [[ -x ./scripts/ci-sccache-summary.sh ]]; then
            ./scripts/ci-sccache-summary.sh "Prebuild Linux x86_64"
          else
            echo "::notice title=sccache stats::scripts/ci-sccache-summary.sh is absent at this checkout; skipping cache reporting."
          fi

      - name: Save release dependencies
        if: >-
          steps.compile.outputs.needed == 'true'
          && steps.cache-lookup.outputs.cache-hit != 'true'
          && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cache-key.outputs.key }}

      - name: Save pinned Zig
        if: >-
          steps.compile.outputs.needed == 'true'
          && steps.zig-cache.outputs.cache-hit != 'true'
          && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
        uses: actions/cache/save@v4
        with:
          path: .context/zig
          key: release-zig-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/bootstrap-zig.sh') }}

  # There is no Mac in the fleet, so this stays on hosted macOS. Starting it at
  # enqueue overlaps the slowest release build with the merge-queue tests.
  build-macos:
    name: Prebuild macOS ARM64
    needs: pending-release
    if: >-
      !cancelled()
      && (needs.pending-release.result == 'skipped'
      || needs.pending-release.outputs.pending == 'true')
      && (inputs.platform == '' || inputs.platform == 'all' || inputs.platform == 'macos')
    # Zig 0.15.2 needs the Xcode 26.3 / macOS 26.2 SDK; macos-latest uses an
    # incompatible newer SDK. Keep this aligned with ci.yml's macos-check.
    runs-on: macos-26
    concurrency:
      group: release-deps-macos-${{ github.event_name == 'push' && inputs.platform == '' && 'seed-main' || github.run_id }}
      cancel-in-progress: false
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      # cas-d8ec: the macOS asset ships without LTO. Measured cold on macos-26
      # (run 38613693971): 1686 s thin vs 912 s off, +3% size, same startup.
      # Job-level so the rust-cache key changes with it. Linux keeps thin LTO.
      CARGO_PROFILE_RELEASE_FAST_LTO: "off"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Identify release dependency cache
        id: cache-key
        run: python3 scripts/release-cache-key.py aarch64-apple-darwin | tee -a "$GITHUB_OUTPUT"

      # Scope is the run ref, not the checked-out SHA. A main push seeds only
      # after an exact-key lookup misses. Queue builds can read main's cache.
      - name: Look up release dependency cache
        id: cache-lookup
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cache-key.outputs.key }}
          lookup-only: true

      # A workflow_call inherits its caller's push event. Its nonempty
      # platform input distinguishes a publication fallback from a main seed.
      - name: Decide whether compilation is needed
        id: compile
        env:
          SEED_ONLY: ${{ (github.event_name == 'push' && inputs.platform == '') || inputs.seed_only }}
          CACHE_HIT: ${{ steps.cache-lookup.outputs.cache-hit }}
        run: |
          if [[ "$SEED_ONLY" == true && "$CACHE_HIT" == true ]]; then
            echo 'needed=false' >> "$GITHUB_OUTPUT"
            echo 'Exact release dependency cache hit; seed compilation skipped' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'needed=true' >> "$GITHUB_OUTPUT"
          fi

      # Dispatch seeds also restore on a hit to prove the save/restore path.
      # Ordinary main cache hits do not download or compile anything.
      - name: Restore release dependencies
        if: steps.compile.outputs.needed == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cache-key.outputs.key }}

      - name: Install pinned Rust
        if: steps.compile.outputs.needed == 'true'
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.cache-key.outputs.toolchain }}
          targets: aarch64-apple-darwin

      - name: Restore pinned Zig
        if: steps.compile.outputs.needed == 'true'
        id: zig-cache
        uses: actions/cache/restore@v4
        with:
          path: .context/zig
          key: release-zig-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/bootstrap-zig.sh') }}

      - name: Install Zig
        if: steps.compile.outputs.needed == 'true'
        run: ./scripts/bootstrap-zig.sh

      - name: Setup sccache
        if: steps.compile.outputs.needed == 'true'
        id: setup-sccache
        continue-on-error: true
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Probe sccache backend
        if: steps.compile.outputs.needed == 'true'
        env:
          SCCACHE_OUTCOME: ${{ steps.setup-sccache.outcome }}
        shell: bash
        run: |
          if [[ "$SCCACHE_OUTCOME" == "success" ]] && sccache --start-server; then
            printf 'RUSTC_WRAPPER=sccache\nSCCACHE_GHA_ENABLED=true\n' >> "$GITHUB_ENV"
          else
            echo "::warning::sccache backend unavailable — building uncached"
            printf 'RUSTC_WRAPPER=\nSCCACHE_GHA_ENABLED=false\nSCCACHE_PATH=%s/scripts/sccache-unavailable.sh\n' \
              "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          fi

      - name: Build
        if: steps.compile.outputs.needed == 'true'
        env:
          ZIG: ${{ github.workspace }}/.context/zig/zig
        run: cargo build -p cas --profile "$RELEASE_PROFILE" --target aarch64-apple-darwin --locked

      # The codesign gate (cas-67c1) moves with the build. Whichever path
      # produces the Darwin bytes signs and verifies them; release.yml verifies
      # the signature again on the exact archive that ships.
      - name: Package
        if: steps.compile.outputs.needed == 'true'
        run: |
          mkdir -p package
          cp "target/aarch64-apple-darwin/$RELEASE_DIR/cas" package/
          strip package/cas
          # `strip` invalidates an ad-hoc Mach-O signature. Re-sign the exact
          # executable we publish, then fail before packaging if it is invalid.
          codesign --sign - --force package/cas
          codesign --verify --verbose=4 package/cas
          cp LICENSE package/
          cd package
          tar -czvf cas-aarch64-apple-darwin.tar.gz cas LICENSE
          mv cas-aarch64-apple-darwin.tar.gz ../

      - name: Upload artifact
        if: steps.compile.outputs.needed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cas-aarch64-apple-darwin
          path: cas-aarch64-apple-darwin.tar.gz
          retention-days: 14

      - name: Report sccache stats
        if: always() && steps.compile.outputs.needed == 'true'
        run: |
          if [[ -x ./scripts/ci-sccache-summary.sh ]]; then
            ./scripts/ci-sccache-summary.sh "Prebuild macOS ARM64"
          else
            echo "::notice title=sccache stats::scripts/ci-sccache-summary.sh is absent at this checkout; skipping cache reporting."
          fi

      - name: Save release dependencies
        if: >-
          steps.compile.outputs.needed == 'true'
          && steps.cache-lookup.outputs.cache-hit != 'true'
          && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cache-key.outputs.key }}

      - name: Save pinned Zig
        if: >-
          steps.compile.outputs.needed == 'true'
          && steps.zig-cache.outputs.cache-hit != 'true'
          && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
        uses: actions/cache/save@v4
        with:
          path: .context/zig
          key: release-zig-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/bootstrap-zig.sh') }}
