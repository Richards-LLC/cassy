name: Release

# Publish a release when its version change lands on main (cas-f95b).
#
# scripts/release.sh commits the version bump, the CHANGELOG promotion and the
# release-notes draft into the epic PR, so the merge queue proves the exact
# tree that ships, and release-prebuild.yml builds both platform archives on
# that queue run. When the queue lands the version change on main, this
# workflow, with no agent in between:
#   1. detects the version change (scripts/detect-pending-release.sh);
#   2. adopts the queue run's archives by exact commit or tree id
#      (scripts/find-release-prebuild.sh), and builds them only on a miss, by
#      calling release-prebuild.yml;
#   3. runs the ISA audit and the operator launch smoke on the packaged Linux
#      archive, and the signature check and launch smoke on the packaged macOS
#      archive: the bytes that ship;
#   4. creates the annotated tag v<version> and the GitHub release
#      (scripts/release-publish.sh), whose notes carry the PR-opened timer;
#   5. dispatches the install-path proof;
#   6. deploys the tagged Commander dist to hub.petrastella.io after publication.
# The supervisor host installs on publish (scripts/install-on-publish.sh).
#
# workflow_dispatch with dry_run=true (the default) runs every step for the
# dispatched ref against a throwaway prerelease named dryrun-v<version>-<run>,
# then deletes it. With dry_run=false it is the recovery path for a release
# whose push run failed; it still refuses an existing release.
on:
  push:
    branches:
      - main
    paths:
      - cas-cli/Cargo.toml
  workflow_dispatch:
    inputs:
      dry_run:
        description: Publish a throwaway prerelease and delete it (no real release)
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: false

jobs:
  detect:
    name: Detect release version change
    if: github.repository == 'Richards-LLC/cassy' && github.event.repository.fork == false
    runs-on: ubuntu-latest
    outputs:
      pending: ${{ steps.decide.outputs.pending }}
      version: ${{ steps.decide.outputs.version }}
      tag: ${{ steps.decide.outputs.tag }}
      dry-run: ${{ steps.decide.outputs.dry-run }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - id: detect
        name: Detect a version change against the previous main
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          args=()
          if [[ "$GITHUB_EVENT_NAME" == push && -n "$BEFORE" && "$BEFORE" != 0000000000000000000000000000000000000000 ]]; then
            git fetch --quiet --depth=1 origin "$BEFORE"
            base_version="$(git show "$BEFORE:cas-cli/Cargo.toml" \
              | sed -n 's/^version = "\([^"]*\)"/\1/p' | head -n 1)"
            args=(--base-version "$base_version")
          fi
          ./scripts/detect-pending-release.sh "${args[@]}" | tee -a "$GITHUB_OUTPUT"

      - id: decide
        name: Decide what to publish
        shell: bash
        env:
          PENDING: ${{ steps.detect.outputs.pending }}
          CHANGED: ${{ steps.detect.outputs.changed }}
          VERSION: ${{ steps.detect.outputs.version }}
          TAG: ${{ steps.detect.outputs.tag }}
          REASON: ${{ steps.detect.outputs.reason }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          set -euo pipefail
          if [[ "$DRY_RUN" == true ]]; then
            # A dry run exercises the whole path for any tree, released or not.
            [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::dry run needs a release version; $REASON"; exit 1; }
            {
              echo "pending=true"
              echo "version=$VERSION"
              echo "tag=dryrun-v$VERSION-$GITHUB_RUN_ID"
              echo "dry-run=true"
            } >> "$GITHUB_OUTPUT"
            echo "Dry run for $VERSION at $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ "$PENDING" != true && "$CHANGED" == true ]]; then
            # The version moved on main but cannot publish: reused or lowered.
            echo "::error::the version change on main cannot publish: $REASON"
            exit 1
          fi
          {
            echo "pending=$PENDING"
            echo "version=$VERSION"
            echo "tag=$TAG"
            echo "dry-run=false"
          } >> "$GITHUB_OUTPUT"
          echo "pending=$PENDING tag=$TAG reason=$REASON" >> "$GITHUB_STEP_SUMMARY"

  # Adopt the archives the merge queue built for this tree (cas-28eb finder).
  # The queue may land before its non-required release builds finish, so the
  # finder waits for an in-flight matching run before declaring a miss.
  lookup:
    name: Look up prebuilt release artifacts
    needs: detect
    if: needs.detect.outputs.pending == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      found: ${{ steps.lookup.outputs.found }}
      run-id: ${{ steps.lookup.outputs.run-id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - id: lookup
        name: Find a successful prebuild for this exact commit or tree
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PREBUILD_WAIT_SECONDS: 1800
          RELEASE_PREBUILD_POLL_SECONDS: 15
        run: ./scripts/find-release-prebuild.sh | tee -a "$GITHUB_OUTPUT"

  # FALLBACK ONLY: no prebuild exists for this tree. The same build steps as
  # the queue run, called rather than copied.
  build:
    name: Build release artifacts (fallback)
    needs: lookup
    if: needs.lookup.result == 'success' && needs.lookup.outputs.found != 'true'
    uses: ./.github/workflows/release-prebuild.yml

  audit-linux:
    name: Audit packaged Linux asset
    needs: [detect, lookup, build]
    if: >-
      !cancelled()
      && needs.lookup.result == 'success'
      && ((needs.lookup.outputs.found == 'true' && needs.build.result == 'skipped')
      || (needs.lookup.outputs.found != 'true' && needs.build.result == 'success'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Download the Linux archive
        uses: actions/download-artifact@v4
        with:
          name: cas-x86_64-unknown-linux-gnu
          path: release
          run-id: ${{ needs.lookup.outputs.found == 'true' && needs.lookup.outputs.run-id || github.run_id }}
          github-token: ${{ github.token }}

      - name: ISA audit of the packaged executable
        run: |
          set -euo pipefail
          mkdir -p asset
          tar -xzf release/cas-x86_64-unknown-linux-gnu.tar.gz -C asset
          ./scripts/check-portable-x86_64-isa.sh asset/cas
          sha256sum release/cas-x86_64-unknown-linux-gnu.tar.gz | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Operator launch smoke of the packaged executable
        run: ./scripts/check-operator-launch.sh asset/cas

  audit-macos:
    name: Audit packaged macOS asset
    needs: [detect, lookup, build]
    if: >-
      !cancelled()
      && needs.lookup.result == 'success'
      && ((needs.lookup.outputs.found == 'true' && needs.build.result == 'skipped')
      || (needs.lookup.outputs.found != 'true' && needs.build.result == 'success'))
    runs-on: macos-26
    permissions:
      contents: read
      actions: read
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Download the macOS archive
        uses: actions/download-artifact@v4
        with:
          name: cas-aarch64-apple-darwin
          path: release
          run-id: ${{ needs.lookup.outputs.found == 'true' && needs.lookup.outputs.run-id || github.run_id }}
          github-token: ${{ github.token }}

      # Mach-O signatures can be verified only on macOS; this is the archive
      # that ships, not the one the build job signed before upload.
      - name: Signature check of the packaged executable
        run: |
          set -euo pipefail
          mkdir -p asset
          tar -xzf release/cas-aarch64-apple-darwin.tar.gz -C asset
          codesign --verify --verbose=4 asset/cas
          shasum -a 256 release/cas-aarch64-apple-darwin.tar.gz | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Operator launch smoke of the packaged executable
        run: bash ./scripts/check-operator-launch.sh asset/cas

  release:
    name: Create Release
    # Both packaged assets passed their audit and launch smoke. `!cancelled()`
    # lets this job see a skipped fallback build; every real condition below
    # is explicit and fail-closed.
    needs: [detect, lookup, audit-linux, audit-macos]
    if: >-
      !cancelled()
      && needs.detect.outputs.pending == 'true'
      && needs.audit-linux.result == 'success'
      && needs.audit-macos.result == 'success'
    # Publication and the post-publish hub provenance asset need contents: write.
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.publish.outputs.published }}
    permissions:
      contents: write
      actions: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Download both archives
        uses: actions/download-artifact@v4
        with:
          pattern: cas-*
          merge-multiple: true
          path: release
          run-id: ${{ needs.lookup.outputs.found == 'true' && needs.lookup.outputs.run-id || github.run_id }}
          github-token: ${{ github.token }}

      - id: publish
        name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.detect.outputs.version }}
          TAG: ${{ needs.detect.outputs.tag }}
          DRY_RUN: ${{ needs.detect.outputs.dry-run }}
        run: |
          set -euo pipefail
          ls -la release/
          args=(--version "$VERSION" --sha "$GITHUB_SHA" --assets release --tag "$TAG" --notes-out "$RUNNER_TEMP/notes.md")
          [[ "$DRY_RUN" != true ]] || args+=(--prerelease)
          ./scripts/release-publish.sh "${args[@]}"
          echo 'published=true' >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/notes.md" >> "$GITHUB_STEP_SUMMARY"

      # GITHUB_TOKEN-created releases do not fan out a release.published event
      # to other workflows. Dispatch the proof explicitly after all assets are
      # published, and record the run id so the release receipt can verify it.
      - name: Dispatch install path proof
        if: needs.detect.outputs.dry-run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.detect.outputs.tag }}
        run: |
          set -euo pipefail
          DISPATCH_STARTED_AT="$(date -u +%s)"
          export DISPATCH_STARTED_AT
          gh workflow run install-path-proof.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$VERSION" \
            -f version="$VERSION"

          proof_run_id=''
          for _attempt in {1..12}; do
            proof_run_id="$(
              gh run list \
                --repo "$GITHUB_REPOSITORY" \
                --workflow install-path-proof.yml \
                --event workflow_dispatch \
                --limit 20 \
                --json databaseId,event,headSha,createdAt \
                --jq 'map(select(.event == "workflow_dispatch" and .headSha == env.GITHUB_SHA and ((.createdAt | fromdateiso8601) >= (env.DISPATCH_STARTED_AT | tonumber)))) | sort_by(.createdAt) | last | .databaseId // empty'
            )"
            if [[ -n "$proof_run_id" ]]; then
              break
            fi
            sleep 5
          done
          test -n "$proof_run_id"
          {
            echo 'Install-path proof dispatch receipt:'
            echo "- workflow: install-path-proof.yml"
            echo "- tag: $VERSION"
            echo "- run id: $proof_run_id"
          } >> "$GITHUB_STEP_SUMMARY"

      # A dry run proves tag and release creation, then removes both so no
      # throwaway object outlives the run.
      - name: Delete the dry-run prerelease
        if: always() && needs.detect.outputs.dry-run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.detect.outputs.tag }}
        run: |
          set -euo pipefail
          case "$TAG" in dryrun-*) ;; *) echo "::error::refusing to delete non-dry-run tag $TAG"; exit 1 ;; esac
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          elif git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            git push origin --delete "refs/tags/$TAG"
          fi
          echo "deleted dry-run prerelease $TAG" >> "$GITHUB_STEP_SUMMARY"

  # No dependency points back to this job: uploads and verification add no work
  # to commit -> main or main -> published. A later install-proof dispatch error
  # must not suppress a hub update for a release already published successfully.
  deploy-hub:
    name: Deploy released Commander to hosted hub
    needs: [detect, release]
    if: >-
      !cancelled()
      && needs.release.outputs.published == 'true'
      && needs.detect.outputs.dry-run != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    # Serialize alias changes and rollback across distinct release workflow runs.
    concurrency:
      group: hub-static-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.detect.outputs.tag }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pinned static-upload CLI
        run: npm install --global vercel@59.1.3

      - name: Upload, verify, promote or restore, and record provenance
        env:
          GH_TOKEN: ${{ github.token }}
          VERCEL_HUB_TOKEN: ${{ secrets.VERCEL_HUB_TOKEN }}
          TAG: ${{ needs.detect.outputs.tag }}
        run: python3 scripts/deploy-hub-release.py "$TAG" --receipt "$RUNNER_TEMP/hub-deployment.json"

      - name: Retain hosted hub receipt (including failures)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hub-deployment
          path: ${{ runner.temp }}/hub-deployment.json
          if-no-files-found: ignore
