name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always
  RUSTC_WRAPPER: sccache

jobs:
  verify:
    name: Verify Release Inputs
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux linker
        run: |
          sudo apt-get update
          # Keep this aligned with .cargo/config.toml's gcc + mold toolchain.
          sudo apt-get install -y gcc mold

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.5

      # Keep Cargo's registry and dependency artifacts warm across releases.
      # The explicit lockfile key prevents a dependency update from restoring
      # incompatible artifacts, while source changes still rebuild workspace crates.
      - name: Cache release dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: release-verify-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          cache-on-failure: true

      - name: Install Zig
        run: ./scripts/bootstrap-zig.sh

      - name: Fail fast on release inputs
        run: ./scripts/check-release-preflight.sh "${GITHUB_REF_NAME}"

  build:
    name: Build Linux x86_64
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install Linux linker
        run: |
          sudo apt-get update
          # Keep this aligned with .cargo/config.toml's gcc + mold toolchain.
          sudo apt-get install -y binutils file gcc mold
          gcc --version
          mold --version

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.5

      - name: Cache release dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: release-linux-x86_64-${{ hashFiles('Cargo.lock') }}
          cache-on-failure: true

      - name: Install Zig
        run: ./scripts/bootstrap-zig.sh

      - name: Build
        env:
          ZIG: ${{ github.workspace }}/.context/zig/zig
        run: |
          # The subsequent build-input audit must inspect this build, never a
          # stale BLAKE3 output restored from the target cache.
          cargo clean -p blake3 --release --target x86_64-unknown-linux-gnu
          cargo build -p cas --release --target x86_64-unknown-linux-gnu --locked

      - name: Stage package
        run: |
          mkdir -p package
          cp target/x86_64-unknown-linux-gnu/release/cas package/
          cp LICENSE package/

      - name: Audit exact packaged Linux executable
        run: |
          ./scripts/check-blake3-no-avx512-build.sh target/x86_64-unknown-linux-gnu/release/build
          ./scripts/test-check-portable-x86_64-isa.sh package/cas

      - name: Package
        run: |
          cd package
          tar -czvf cas-x86_64-unknown-linux-gnu.tar.gz cas LICENSE
          mv cas-x86_64-unknown-linux-gnu.tar.gz ../

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cas-x86_64-unknown-linux-gnu
          path: cas-x86_64-unknown-linux-gnu.tar.gz

  build-macos:
    name: Build macOS ARM64
    needs: verify
    # Zig 0.15.2 needs the Xcode 26.3 / macOS 26.2 SDK; macos-latest uses an
    # incompatible newer SDK. Keep this aligned with ci.yml's macos-check.
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install Zig
        run: ./scripts/bootstrap-zig.sh

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.5

      - name: Cache release dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: release-macos-aarch64-${{ hashFiles('Cargo.lock') }}
          cache-on-failure: true

      - name: Build
        env:
          ZIG: ${{ github.workspace }}/.context/zig/zig
        run: cargo build -p cas --release --target aarch64-apple-darwin --locked

      - name: Package
        run: |
          mkdir -p package
          cp target/aarch64-apple-darwin/release/cas package/
          cp LICENSE package/
          cd package
          tar -czvf cas-aarch64-apple-darwin.tar.gz cas LICENSE
          mv cas-aarch64-apple-darwin.tar.gz ../

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cas-aarch64-apple-darwin
          path: cas-aarch64-apple-darwin.tar.gz

  release:
    name: Create Release
    needs: [verify, build, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release
          find artifacts -name "*.tar.gz" -exec mv {} release/ \;
          ls -la release/

      - name: Generate release notes
        id: notes
        run: |
          # Get the previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            NOTES=$(git log --pretty=format:"- %s" $PREV_TAG..HEAD)
          else
            NOTES=$(git log --pretty=format:"- %s" -10)
          fi
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"

          # Delete existing release if it exists (handles retags)
          gh release delete "$VERSION" --repo ${{ github.repository }} --yes 2>/dev/null || true

          # Create the release
          gh release create "$VERSION" \
            --repo ${{ github.repository }} \
            --title "CAS $VERSION" \
            --notes "${{ steps.notes.outputs.notes }}" \
            release/*
