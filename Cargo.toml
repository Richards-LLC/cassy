[workspace]
resolver = "2"
members = [
    "cas-cli",
    "crates/cas-types",
    "crates/cas-search",
    "crates/cas-store",
    "crates/cas-core",
    "crates/cas-mcp",
    "crates/cas-code",
    "crates/cas-mux",
    "crates/cas-pty",
    "crates/cas-recording",
    "crates/cas-factory-protocol",
    "crates/cas-diffs",
    "crates/cas-factory",
    "crates/cas-tui-test",
    "crates/cas-mcp-proxy",
    "crates/ghostty_vt_sys",
    "crates/ghostty_vt",
]

# Exact crates.io 1.8.6 source with one build.rs correction: when cas-store
# enables no_avx512, do not compile/link the otherwise runtime-disabled AVX-512
# archive. See docs/third-party/blake3-1.8.6.md.
[patch.crates-io]
blake3 = { path = "vendor/blake3-1.8.6" }

[profile.release]
lto = true
codegen-units = 1
strip = true

[profile.dev]
debug = 1
incremental = true

[profile.dev.package."*"]
opt-level = 1

[profile.release-fast]
inherits = "release"
lto = "thin"
codegen-units = 16
strip = "debuginfo"
# Required for the MCP panic catcher; enforced by compile_error! in
# cas-cli/src/lib.rs.
panic = "unwind"
