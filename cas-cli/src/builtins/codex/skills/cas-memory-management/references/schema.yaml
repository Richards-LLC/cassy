---
managed_by: cas
---

# Schema for memory content and the unified mcp__cs__memory request.
#
# Memory content is stored in a SQLite entry row. Optional YAML frontmatter is
# embedded at the beginning of that content, followed by the Markdown body.
# This is guidance for callers, not a second file-backed memory store.

request:
  entry_type:
    type: enum
    values: [learning, preference, context, observation]
    default: learning
    applies_to: remember
    description: "The single entry-type enum accepted by the memory request."

content_frontmatter:
  description: "Optional YAML at the start of the content field."
  overlap_fields:
    - name
    - description
    - module
    - track
    - root_cause
  fields:
    name:
      type: string
      description: "Short title used when extracting overlap facets."
    description:
      type: string
      description: "One-line summary used when extracting overlap facets."
    module:
      type: string
      description: "Affected crate, subsystem, or project area."
    track:
      type: string
      recommended_values: [bug, knowledge]
      description: "Whether the entry describes a defect or reusable guidance."
    root_cause:
      type: string
      description: "The diagnosed cause when the entry describes a defect."

search_index_fields:
  description: "Structured fields extracted by the search index when present in content frontmatter."
  filter_keys: [module, track, problem_type, severity, root_cause, date]
  notes:
    - "Values are whitespace-free in key:value search tokens."
    - "Legacy content without structured frontmatter remains searchable by body text."

validation:
  - "The memory request always carries action; all other request fields are optional and action-specific."
  - "entry_type must be one of the four values above when supplied to remember."
  - "Frontmatter is best-effort metadata inside content; malformed or absent frontmatter does not prevent body-text indexing."
  - "track and root_cause are recommendations for overlap metadata, not separate request parameters."
