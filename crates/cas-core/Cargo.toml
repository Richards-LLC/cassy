[package]
name = "cas-core"
version = "3.15.5"
edition = "2024"
rust-version = "1.88"
description = "Core business logic for CAS"
license = "MIT"

[lints]
workspace = true

[dependencies]
cas-types = { path = "../cas-types" }
cas-store = { path = "../cas-store" }
thiserror.workspace = true
rusqlite = { version = "0.38", features = ["bundled", "backup"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Hooks module dependencies
glob = "0.3"
regex = "1.11"

[dev-dependencies]
tempfile = "3.14"
