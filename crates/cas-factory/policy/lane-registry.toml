schema_version = 1

[defaults.claude]
model = "opus"
effort = "high"

[defaults.codex]
model = "gpt-5.6-luna"
effort = "xhigh"

[defaults.grok]
model = "grok-4.5"
effort = "high"

[defaults.opencode]
model = "qwencloud/qwen3.8-max"
effort = "medium"

[recipes.claude_haiku]
harness = "claude"
provider = "anthropic"
model = "claude-haiku-4-5-20251001"
default_effort = "low"
allowed_efforts = ["low", "medium"]
status = "active"
required_capability = "claude-account"

[recipes.codex_luna]
harness = "codex"
provider = "openai"
model = "gpt-5.6-luna"
default_effort = "xhigh"
allowed_efforts = ["xhigh"]
status = "active"
required_capability = "codex-account"

[recipes.claude_opus]
harness = "claude"
provider = "anthropic"
model = "claude-opus-5"
default_effort = "high"
allowed_efforts = ["high"]
status = "active"
required_capability = "claude-account"

[recipes.claude_fable]
harness = "claude"
provider = "anthropic"
model = "claude-fable-5-1"
default_effort = "medium"
allowed_efforts = ["medium", "high"]
status = "active"
required_capability = "claude-account"

[recipes.codex_astra]
harness = "codex"
provider = "openai"
model = "gpt-6-astra"
default_effort = "medium"
# Explicit Astra requests retain the existing Cassy effort vocabulary.
allowed_efforts = ["minimal", "low", "medium", "high", "xhigh"]
status = "active"
reason = "Not routed for supervisor or taste: observed 2026-09-05 to hold finished workers and stop driving epics; explicit-request only."
required_capability = "codex-account"

[recipes.codex_sol]
harness = "codex"
provider = "openai"
model = "gpt-5.6-sol"
default_effort = "high"
allowed_efforts = ["high"]
status = "active"
required_capability = "codex-account"

[recipes.codex_terra]
harness = "codex"
provider = "openai"
model = "gpt-5.6-terra"
default_effort = "xhigh"
allowed_efforts = ["xhigh"]
status = "suspended"
reason = "Standing operator suspension (2026-08-27)"
required_capability = "codex-account"

[recipes.qwencloud_qwen]
harness = "opencode"
provider = "qwencloud"
model = "qwen3.8-max"
default_effort = "medium"
allowed_efforts = ["low", "medium", "xhigh"]
status = "active"
reason = "Receipt-gated by opencode-1.18.23-hosted-token-plan-2026-08-27; explicit recipe/model only"
required_capability = "qwencloud-token-plan-key"

[lanes.light]
candidates = ["claude_haiku", "codex_luna"]

[lanes.standard]
candidates = ["codex_luna", "claude_opus"]

[lanes.taste]
candidates = ["claude_fable"]
# Fable/medium is the taste route; unavailable Fable fails closed.
# Keep the only taste fallback as an explicit, reviewable registry edge while
# disabling it in the shipped policy. A host may remove this guard only when
# its own routing policy permits taste to degrade to Luna.
fallbacks = ["claude_opus"]
no_fallback = true

[lanes.supervisor]
candidates = ["claude_fable"]
# Claude Fable is the supervisor default; an unavailable Claude account must
# fail closed rather than silently put the coordinator on another harness.
fallbacks = ["claude_opus"]
no_fallback = true

[lanes.heavy]
candidates = ["codex_sol", "codex_luna"]
