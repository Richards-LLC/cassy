schema_version = 1

[defaults.claude]
model = "opus"
effort = "high"

[defaults.codex]
model = "gpt-5.6-luna"
effort = "xhigh"

[defaults.grok]
model = "grok-4.5"
effort = "high"

[defaults.opencode]
model = "qwencloud/qwen3.8-max"
effort = "medium"

[recipes.claude_haiku]
harness = "claude"
provider = "anthropic"
model = "claude-haiku-4-5-20251001"
default_effort = "low"
allowed_efforts = ["low", "medium"]
status = "active"
required_capability = "claude-account"

[recipes.codex_luna]
harness = "codex"
provider = "openai"
model = "gpt-5.6-luna"
default_effort = "xhigh"
allowed_efforts = ["xhigh"]
status = "active"
required_capability = "codex-account"

[recipes.claude_opus]
harness = "claude"
provider = "anthropic"
model = "claude-opus-5"
default_effort = "high"
allowed_efforts = ["high"]
status = "active"
required_capability = "claude-account"

[recipes.claude_fable]
harness = "claude"
provider = "anthropic"
model = "claude-fable-5-1"
default_effort = "medium"
allowed_efforts = ["medium", "high"]
status = "active"
required_capability = "claude-account"

[recipes.codex_astra]
harness = "codex"
provider = "openai"
model = "gpt-6-astra"
default_effort = "medium"
# Explicit Astra requests retain the existing Cassy effort vocabulary.
allowed_efforts = ["minimal", "low", "medium", "high", "xhigh"]
status = "active"
reason = "Heavy route; excluded from supervisor and taste after the observed 2026-09-05 stall holding finished workers and stopping epic drive."
required_capability = "codex-account"

[recipes.codex_astra_high]
harness = "codex"
provider = "openai"
model = "gpt-6-astra"
default_effort = "high"
allowed_efforts = ["high", "xhigh"]
status = "active"
required_capability = "codex-account"

[recipes.codex_sol]
harness = "codex"
provider = "openai"
model = "gpt-5.6-sol"
default_effort = "high"
allowed_efforts = ["high"]
status = "active"
required_capability = "codex-account"

[recipes.codex_terra]
harness = "codex"
provider = "openai"
model = "gpt-5.6-terra"
default_effort = "xhigh"
allowed_efforts = ["xhigh"]
status = "suspended"
reason = "Standing operator suspension (2026-08-27)"
required_capability = "codex-account"

[recipes.qwencloud_qwen]
harness = "opencode"
provider = "qwencloud"
model = "qwen3.8-max"
default_effort = "medium"
allowed_efforts = ["low", "medium", "xhigh"]
status = "active"
reason = "Receipt-gated by opencode-1.18.23-hosted-token-plan-2026-08-27; explicit recipe/model only"
required_capability = "qwencloud-token-plan-key"

[lanes.light]
candidates = ["claude_haiku", "codex_luna"]

[lanes.standard]
candidates = ["codex_luna", "claude_opus"]

[lanes.taste]
candidates = ["claude_fable"]
# Fable/medium is the taste route; an unavailable Fable falls back loudly to
# Claude Opus 5/high so the operator can see the degraded route.
fallbacks = ["claude_opus"]
no_fallback = false

[lanes.supervisor]
candidates = ["claude_fable"]
# Claude Fable is the supervisor default; an unavailable Claude account must
# fall back loudly to Claude Opus 5/high rather than silently failing closed.
fallbacks = ["claude_opus"]
no_fallback = false

[lanes.heavy]
candidates = ["codex_astra_high"]
fallbacks = ["codex_sol"]
