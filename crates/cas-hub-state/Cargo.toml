[package]
name = "cas-hub-state"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Scratch hub persistence extraction for cas-a4b1 measurement"
license = "MIT"

[features]
# Dependency cfg(test) is not enabled by downstream test builds.
test-support = []

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6.0"
fs2 = "0.4"
hex = "0.4.3"
libc = "0.2"
p256 = { version = "0.13", features = ["ecdsa"] }
rand = "0.9.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.9"
subtle = "2.6"
thiserror.workspace = true
tokio = { version = "1", features = ["sync"] }
tracing = "0.1.44"
url = "2.5"
urlencoding = "2.1"
uuid = { version = "1.11", features = ["v4"] }

[dev-dependencies]
tempfile = "3.14"
