[package]
name = "cas-search"
version = "3.96.0"
edition = "2024"
rust-version = "1.88"
description = "Search infrastructure for CAS: BM25, semantic vectors, and hybrid search"
license = "MIT"
autotests = false

[lints]
workspace = true

[dependencies]
# Core types
cas-types = { path = "../cas-types" }
cas-code = { path = "../cas-code" }
cas-store = { path = "../cas-store" }

# LMDB vector storage (Meilisearch's wrapper)
heed = { version = "0.22", features = ["serde-json"] }

# BM25 full-text search
tantivy = "0.25"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror.workspace = true
anyhow.workspace = true

# Logging
tracing = "0.1"

# Grep/ripgrep libraries
grep-searcher = "0.1"
grep-regex = "0.1"
ignore = "0.4"

# Async parallel search (optional)
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"], optional = true }

[features]
default = []
parallel = ["tokio"]

[dev-dependencies]
chrono = "0.4"
tempfile = "3.14"

[[test]]
name = "bm25_integration"
path = "tests/bm25_integration.rs"

[[test]]
name = "code_search_integration"
path = "tests/code_search_integration.rs"
