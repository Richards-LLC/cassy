[package]
name = "cas-store"
version = "3.17.0"
edition = "2024"
rust-version = "1.88"
description = "Storage layer for CAS (Coding Agent System)"
license = "MIT"

[lints.clippy]
unwrap_used = "deny"

[dependencies]
# Core types
cas-types = { path = "../cas-types" }
cas-code = { path = "../cas-code" }

# Database
rusqlite = { version = "0.38", features = ["bundled", "backup"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
zstd = "0.13"

# Error handling
thiserror.workspace = true
anyhow.workspace = true

# Date/Time
chrono = { version = "0.4", features = ["serde"] }

# File system
walkdir = "2.5"
glob = "0.3"
fs2 = "0.4"

# Utilities
rand = "0.9.2"
sha2 = "0.10"
# Content-hash identity for the knowledge source ledger. Keep portable through
# AVX2 dispatch, but do not link the AVX-512 path into release executables.
blake3 = { version = "1.5", features = ["no_avx512"] }

# Logging
tracing = "0.1"

[dev-dependencies]
tempfile = "3.14"
