              <pattern id="dc-finished-grid" width="9" height="9" patternUnits="userSpaceOnUse"><path d="M2.25 0V9M4.5 0V9M6.75 0V9M0 2.25H9M0 4.5H9M0 6.75H9" stroke="#e7ece9" stroke-width="0.55"/><path d="M0 0H9V9" fill="none" stroke="#c4d0c9" stroke-width="1"/></pattern>
              <marker id="dc-finished-arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#0b6b78"/></marker>
            </defs>
            <rect width="1072" height="640" fill="url(#dc-finished-grid)"/>
