<svg xmlns="http://www.w3.org/2000/svg" width="180mm" viewBox="0 0 1072 640" role="img" aria-labelledby="dc-finished-title dc-finished-desc">
            <title id="dc-finished-title">Finished dartboard cabinet in thirty-degree isometric projection</title>
            <desc id="dc-finished-desc">Completed closed cabinet on a one-inch grid with overall width thirty inches, height thirty-eight inches, and depth nine and one-quarter inches.</desc>
