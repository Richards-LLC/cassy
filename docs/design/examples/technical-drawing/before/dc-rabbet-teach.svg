<svg xmlns="http://www.w3.org/2000/svg" width="180mm" viewBox="0 0 1100 690" role="img" aria-labelledby="dc-rabbet-teach-title dc-rabbet-teach-desc">
            <title id="dc-rabbet-teach-title">Carcass corner rabbet teaching sheet</title>
            <desc id="dc-rabbet-teach-desc">Separated and assembled thirty-degree isometrics, table-saw setup, waste and glue markings, dimensions, and a right-versus-wrong shoulder comparison for the carcass corner rabbet.</desc>
            <defs><pattern id="dc-rabbet-teach-grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M6 0V24M12 0V24M18 0V24M0 6H24M0 12H24M0 18H24" stroke="#e7ece9" stroke-width=".6"/><path d="M0 0H24V24" fill="none" stroke="#c4d0c9"/></pattern><marker id="dc-rabbet-teach-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#0b6b78"/></marker></defs>
            <rect width="1100" height="690" fill="url(#dc-rabbet-teach-grid)"/><text x="24" y="30" class="view-label" font-size="18">CARCASS CORNER RABBET · FOUR CORNERS · PRINT SCALE 1:2</text><text x="24" y="52" class="note-text" font-size="13">Primary views: 30° isometrics · major square = 1″ · 2″ object scale bar at lower right</text>
            <text x="210" y="88" text-anchor="middle" class="view-label" font-size="15">SEPARATED ISOMETRIC</text><g transform="translate(70 115)"><polygon points="0,60 140,0 300,92 160,152" class="keep-top"/><polygon points="0,60 160,152 160,205 0,113" class="keep-side"/><polygon points="160,152 300,92 300,145 160,205" class="keep-end"/><polygon points="220,58 300,92 300,145 250,124 250,98 220,86" class="waste"/><text x="95" y="96" class="part-label" font-size="12">SIDE · FEMALE RABBET</text><polygon points="325,15 410,-22 500,30 415,67" class="keep-top"/><polygon points="325,15 415,67 415,117 325,65" class="keep-side"/><polygon points="415,67 500,30 500,80 415,117" class="keep-end"/><text x="402" y="28" text-anchor="middle" class="part-label" font-size="11">TOP / BOTTOM · PLAIN MALE END</text><path d="M405 90L320 140" class="axis" marker-end="url(#dc-rabbet-teach-arrow)"/><text x="360" y="126" class="dimension-text" font-size="12">ASSEMBLY AXIS</text><polygon points="220,86 250,98 250,124 220,112" class="glue"/><text x="205" y="147" class="dimension-text" font-size="11">GLUE: FLOOR + SHOULDER</text></g>
            <text x="825" y="88" text-anchor="middle" class="view-label" font-size="15">ASSEMBLED ISOMETRIC</text><g transform="translate(650 125)"><polygon points="0,55 150,0 325,98 175,153" class="keep-top"/><polygon points="0,55 175,153 175,210 0,112" class="keep-side"/><polygon points="175,153 325,98 325,155 175,210" class="keep-end"/><polygon points="220,78 325,98 325,155 250,142 250,111 220,104" class="sheet-part"/><text x="120" y="86" class="part-label" font-size="12">SIDE</text><text x="275" y="125" class="part-label" font-size="11">END SEATED</text><path d="M218 103L250 111" class="dimension" stroke-width="5"/><text x="240" y="185" class="dimension-text" font-size="12">3/4″ W × 3/8″ D</text></g>
            <line x1="24" y1="370" x2="1076" y2="370" class="reference"/><text x="250" y="400" text-anchor="middle" class="view-label" font-size="15">CUT ON DWE7491 + CROSSCUT SLED</text><g transform="translate(45 420)"><rect x="0" y="65" width="470" height="120" class="machine"/><line x1="205" y1="55" x2="205" y2="188" class="cut-line"/><rect x="90" y="20" width="300" height="70" class="keep-top"/><rect x="300" y="20" width="90" height="35" class="waste"/><line x1="70" y1="15" x2="70" y2="185" stroke="#243c32" stroke-width="8"/><text x="78" y="210" class="part-label" font-size="12">SLED FENCE · END REGISTERS</text><text x="235" y="112" class="note-text" font-size="12">INSIDE FACE RIDES TABLE</text><text x="310" y="48" class="part-label" font-size="11">WASTE TO END</text><text x="213" y="150" class="dimension-text" font-size="12">3/4″ STACK · 3/8″ HIGH</text></g>
            <text x="810" y="400" text-anchor="middle" class="view-label" font-size="15">RIGHT VS WRONG</text><g transform="translate(610 430)"><path d="M0 95H165V140H105V122H0Z" class="correct"/><rect x="105" y="122" width="60" height="18" class="sheet-part"/><text x="80" y="165" text-anchor="middle" fill="#2f6d49" font-weight="800">RIGHT · SHOULDER CLOSED</text><path d="M230 95H395V140H335V122H230Z" class="wrong"/><rect x="340" y="122" width="55" height="18" class="sheet-part"/><path d="M335 122V140" class="cut-line"/><text x="312" y="165" text-anchor="middle" fill="#9a3b1f" font-weight="800">WRONG · GAP</text><text x="200" y="205" text-anchor="middle" class="note-text" font-size="12">Failure: shallow cut or debris holds the end off the shoulder.</text></g><line x1="960" y1="650" x2="1056" y2="650" class="dimension" stroke-width="5"/><text x="1008" y="674" text-anchor="middle" class="dimension-text" font-size="12">2″ object · prints 1″ at 1:2</text>
          </svg>