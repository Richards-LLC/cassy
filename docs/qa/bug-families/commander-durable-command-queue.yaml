title: Commander queued commands survive daemon restart
statement: A queued supervisor command survives restart or reexec under the same session, supervisor, device and command reference, is typed once at the next native turn boundary, and is never replayed after an uncertain submission. Only an authoritative per-command abandonment receipt shows Not sent. A stale Queued status at session end remains uncertain and accepts late Submitted or Observed evidence. Restore replays only the recording daemon's own queue, skips unreadable receipts, and teardown completes even when receipts cannot be written.
