title: A polled Commander message does not become a later pane turn
statement: >-
  A successor receives rerouted Commander mail through the real queue relay.
  If its supported inbox poll or explicit acknowledgement handles a message
  after the relay prepared a transport claim, the pane never receives that
  body again. Unread and fresh control messages still arrive, and inbox-read
  provenance never becomes an inferred acknowledgement or observed wake.
