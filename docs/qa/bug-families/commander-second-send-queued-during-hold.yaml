title: A Commander Send made while an earlier one is still being held is queued, not dropped
statement: >-
  A second Send made before the first submission has finished holding its
  message waits behind it on the same thread instead of returning silently with
  its text left in the composer. Both messages are held through the outage and
  delivered once, in order, when the network recovers. A Send on another thread
  or a Retry keeps its own turn.
