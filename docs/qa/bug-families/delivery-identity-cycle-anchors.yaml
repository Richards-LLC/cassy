title: Replacement, rebound and retargeted deliveries are refused although their recorded cycle commits are the task's own
statement: Task start, close and rebind judged delivery ownership by commit subjects, ignored the cycle anchors Cassy recorded for the task, and let the #1353 redirect fall back to the bare branch. A delivery whose own recorded or granted commits named another task, or that held only a retired anchor, was refused or misattributed. Recorded commits and merge_source grants held under a live anchor now count as the task's own at start, close and rebind, and the redirect applies only when real delivered work exists.
