title: Merge retry recovers an expired claim after confirmed verifier death
statement: Only the recorded supervisor can recover a current expired review after registered shutdown, confirmed PID absence or a readable fingerprint mismatch; recovery preserves the exact candidate, retires old authority atomically and retains live, unreadable or unverifiable claims.
