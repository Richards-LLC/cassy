title: Lane attribution preserves the original head invocation
statement: >-
  Deterministic delivery failures remain caused when a base build would overwrite
  shared target dependencies. Replay the recorded archive or build arguments,
  filter and partition before the base build. An identical-invocation flake stays
  unattributed and red; missing invocation metadata or an empty head replay stays
  unresolved.
