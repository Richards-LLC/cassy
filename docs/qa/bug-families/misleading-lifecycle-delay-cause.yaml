title: Delayed lifecycle message credits a late hold with the whole delay
statement: >-
  A lifecycle message delayed past the delivery window names its recorded hold
  as the cause only from the time that hold began. A hold first recorded long
  after queueing, such as a composer or prior-inject decline stamped seconds
  before delivery, must not label an earlier unrecorded wait as that hold, and
  a repeated decline must not move the hold's start.
