title: No-delivery train handoffs preserve the absence of a code source
statement: >-
  A commitless spike with no execution methodology can declare no_delivery,
  pass verification and park for its pinned train owner without recording a
  factory branch or commit anchor. The owner closes it using the same approved
  dispatch, without proof_scope_fix or another verification. Artifact-only
  methodology closes keep the same owner boundary, while measured code
  deliveries retain their ordinary source and merge checks.
