title: Peer artifacts are readable before automatic verification starts
statement: >-
  A no-code close and a candidate review both fetch the task's committed
  artifacts by ID from Cloud into the receiver's namespace before preparing
  the verifier command. SHA-256 and size must match the publication. Missing
  Cloud bytes and checksum failures refuse startup with the artifact ID and
  Cloud error. An imported metadata row cannot stand in for deleted bytes.
