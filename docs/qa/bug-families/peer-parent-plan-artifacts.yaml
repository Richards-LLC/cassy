title: Peer child review restores authenticated parent plan proof
statement: >-
  A child verifier receives verified local paths for its parent epic's cited
  plan and sequence artifacts, using the receiver's parent-task namespace.
  Trusted publication notes can cross stores without the publisher's database
  or cache. A bare ID, foreign project or task, revoked artifact, missing bytes
  or checksum mismatch cannot reach verifier preparation. New parent proof
  references invalidate the candidate context.
