title: Peer park reaches owner merge admission
statement: >-
  Cloud pulls preserve a completed same-execution peer park even when the
  train owner's later bookkeeping advances its row clock. G96 sees the
  recorded branch and anchor without manual task-state repair. Changed
  bindings, explicit rework, declined anchors, foreign identity and LocalWins
  remain protected; publication still requires the train owner and exact
  pushed anchor.
