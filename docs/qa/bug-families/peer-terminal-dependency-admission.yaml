title: Peer receipted terminal state reaches dependency gates
statement: >-
  Cloud pull projects a same-delivery approved merged close over a stale
  Blocked or AwaitingMerge record even when the receiver's body clock is
  newer. G21 observes the close without removing the dependency. Newer body
  and notes survive; open work, unmerged evidence, foreign identity, changed
  cycles, anchors or targets, explicit rework and LocalWins remain protected.
