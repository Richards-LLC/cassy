statement: >-
  Preassign a task with a departed assignee and recorded delivery to a replacement
  worker, resume the inherited delivery, then start and close without manual
  branch approval. The recorded source and parked branch must name the replacement
  lane, retaining previous refs and anchors. Recover an already parked mismatched
  source with request_changes followed by rebind_branch, inbox_poll, start and
  close. Missing or divergent previous source tips still need supervisor recovery.
  Regression: preassigned_worker_takeover_starts_parks_and_recovers_cas_ace6.
