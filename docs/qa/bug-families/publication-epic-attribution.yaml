title: Publication verification follows each post's attributed epic
statement: >-
  A session focused on a release with open verification can publish an
  unattributed operational report or a standalone support task's file.
  An explicitly attributed or artifact-owned deliverable remains held for
  its own epic, including after another epic's verified report in a batch.
  Operator publication overrides remain audited, and release announcements
  retain their independent post-release checks.
