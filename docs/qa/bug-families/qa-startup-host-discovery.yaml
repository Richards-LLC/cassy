title: QA startup host discovery containment
statement: Validated QA startup leaves the inherited host registry and maintenance metadata unchanged; malformed context and shared stores outside the sandbox refuse startup. Ordinary local registration is preserved.
found: Actual serve --sandbox MCP initialize succeeded while a temporary inherited registry gained a row and host sweep metadata was created (GH 2580).
