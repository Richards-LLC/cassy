title: A reconnected MCP's startup epoch survives a concurrent writer so status and Reload Cassy name the same live server
statement: >-
  A replacement MCP backend records its PID and version once at daemon start,
  and that epoch is the only proof of the live server's version. Another
  factory process writing at the same moment must delay the record, not
  discard it. Status and Reload Cassy then select the same PID, version and
  factory session. Same-PID, unversioned or unrelated epochs never authorize
  a reload (GH #2183).
found: GH #2183
