title: A cut refused by a Cassy gate on a green frozen tip records a release red through the cut's candidate, so a release-repair merges without an operator freeze lift
statement: release.sh records each REVIEW_MISSING, LANE_CI_MISSING or zero would-close refusal with the prepared candidate binary, whose CLI has `release refused`, even when the installed CLI predates it; G-100 admits only a release-repair against that receipt, and other merges stay refused.
