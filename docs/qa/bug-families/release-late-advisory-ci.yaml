title: Release membership recognizes late green lane CI
statement: >-
  A docs delivery merged under Advisory admission can join a release when its
  exact-anchor lane checks later succeed, including Docs Lint with classified
  code-job skips. Pending or failed anchor checks and green checks at another
  commit retain LANE_CI_MISSING. Preview does not change task state; apply closes
  the original delivery without reopening it or creating another merge.
