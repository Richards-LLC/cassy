title: Retargeted and pre-park Blocked deliveries can recover on a fresh branch
statement: >-
  An approved proof-scope retarget or a refused first park can retain branch
  receipts without an active park. A live supervisor can bind a clean task-r2
  replacement, after which the worker starts, publishes and parks normally.
  Pending review and active park controls still refuse; historical local and
  origin refs and anchors remain preserved.
