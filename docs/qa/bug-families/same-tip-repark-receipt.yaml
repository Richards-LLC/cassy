title: Checked same-tip re-parks retain their committed disposition during delayed follow-up
statement: >-
  After close gates and required evidence publication pass, an unchanged
  persisted AwaitingMerge snapshot confirms this request with COMMITTED even
  when remaining follow-up crosses the response budget. The anchor and cycle
  stay unchanged and the continuation records one final outcome. A changed
  snapshot or work still before required publication cannot borrow this receipt.
