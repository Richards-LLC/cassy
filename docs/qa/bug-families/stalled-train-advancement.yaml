title: Expired or orphaned train advancement cannot indefinitely hold approved deliveries or append requests
tasks: [cas-deb2]
journeys: [FACTORY-MERGE]
invariants: [FACTORY-MERGE-QUEUE-CI-IDENTITY]
statement: >-
  Publish one queued delivery, hold the next on its verification dispatch, then
  approve that dispatch while an earlier advancement owner remains stalled.
  Additional task IDs append without stealing an active lease; expired or
  orphaned advancement is reclaimed with a durable audit. The daemon resumes
  approved deliveries in order, and stale advancement owners cannot save over
  newer queue state. Normal target publication and supervisor authority gates
  remain in force.
fixed_by: [cas-deb2]
