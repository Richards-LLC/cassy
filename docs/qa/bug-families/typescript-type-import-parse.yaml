title: A TypeScript call whose type argument is `typeof import('module')`, and a generic tagged template like Prisma's `$queryRaw<Row[]>`, parse in the capped JavaScript discovery, and any remaining parse error names path:line:column
statement: tree-sitter-typescript 0.23.2 misparses `f<typeof import('m')>()` and type arguments on a tagged template; the capped runner blanks those type arguments to same-length text before parsing so test identities still resolve. A parse error on the base side or in a non-test file declares no tests, a file importing or requiring `node:test` is prescribed `node --test`, and a test file's parse refusal reports the first unparsed or missing node's location and text.
