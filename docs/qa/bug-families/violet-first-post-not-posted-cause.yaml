title: The first violet_post after a fresh claim and reply_intent returns not_posted, and a second intent posts
statement: The first post after an idle spell met a closed Violet transport and never reached Violet. The lookup answered request_not_found and the reply intent stayed registered, so the same request_id is resent. If that resend also fails, the answer stays retryable under the same request_id.
