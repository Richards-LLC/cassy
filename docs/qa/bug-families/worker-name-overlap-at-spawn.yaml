title: New worker names sharing another worker's factory branch namespace
statement: >-
  A new worker name must not extend, or be extended by, a registered worker's
  name or an existing local or origin factory branch across a hyphen, so no
  branch has two owners. Spawn, factory launch (final --worker-spec names
  included) and dynamic GUI or WebSocket spawns refuse a supplied overlapping
  name, the name generators (daemon fallback included) skip overlapping names
  and the supervisor's name, a task's own per-task branch never blocks its
  name, an unreadable name registry stops the launch or spawn, and cas doctor
  reports overlaps that already exist.
tasks: [cas-dc08]
journeys: [FACTORY-SPAWN, FACTORY-CLOSE]
