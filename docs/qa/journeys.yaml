  HUB-J12-TRUTHFUL-WORKING:
    statement: Working requires recent activity on a live authenticated machine with an unanswered message; idle repaint and disconnected machines never claim work.
    check: Run the supervisor working indicator regression in conversations.test.ts and the single revoked machine part of network-switch.journey.ts with a recent Output frame, then verify an answered real Claude supervisor at its idle prompt and during reconnecting.
    bug:
      task: cas-a252
  HUB-J11-DEVICE-ATTACHMENT:
    bug:
      task: cas-9e46
    statement: An open phone reconnects to the replacement daemon and is counted by its next completed loop pass
    check: 'Use the real HUB-J11 daemon-replacement and hub-restart stages; require a fresh Welcome and commander_clients >= 1 in the first published post-Welcome completed-pass snapshot for the current daemon PID; retain loop passes and timestamps.'
  HUB-J12-GOAL:
    statement: the conversation reconnects by itself and every message I send is delivered exactly once
    check: 'Walk HUB-J12 in hub-web/e2e/journeys/network-switch.journey.ts; verify the expected experience and edge
      paths in docs/qa/journeys.md against the rendered UI and protocol-double state. Gaps: the protocol double
      reproduces what a switch leaves behind (reset sockets, half-open sockets, offline, no event at all); a real
