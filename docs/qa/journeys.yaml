- id: HUB-J24
  name: Paste text, screenshots and files into a supervisor message
  status: live
  kind: commander
  entry:
    url: /commander/
    trigger: Open a paired conversation on desktop or phone, in light or dark.
  steps:
  - Paste plain text inline.
  - Preview long pasted text, a screenshot and a picked file in the composer.
  - Retry a failed upload with the same identity and send the stored paths once.
  goal: Text plus readable host paths reach the supervisor without duplicate delivery.
  owner_groups: [commander_runtime, commander_dependencies]
  owners:
  - hub-web/src/composer-uploads.ts
  - hub-web/src/composer-uploads.css
  - hub-web/e2e/journeys/paste-content.journey.ts
  edge_paths:
  - A 4 or 10 MiB phone file reaches the hub over 512 kbit/s transport without the ordinary 10 second request timeout.
  - A refused file is named among multiple attachments; unsupported types do not prescribe reconnecting.
  - A missing session shows the hub refusal text and keeps the files for recovery.
  - HEIC, AVIF and MOV bytes retain their media types in host artifact storage.
  invariants: [HUB-J24-GOAL]
  traffic:
    share_pct: null
    basis: New journey; no production traffic attribution yet.
  spec: hub-web/e2e/journeys/paste-content.journey.ts
  catalog_gaps: Protocol-double uploads model a lost response; host storage and MIME sniffing are proven by Rust and a fixture-HOME real-hub walk. Physical iOS and Android clipboards are not driven. Native OS share-target installation is a separate follow-up; Commander has no service worker.

- id: HUB-J25
  name: See the whole picture of the work
  status: live
  kind: commander
  entry:
    url: /commander/
    trigger: '`/commander/` at 1280 (light) and 390 (dark), one paired machine whose daemon serves work events, a
      thread with work between two replies, and one worker on a task'
  steps:
  - Show work is off and the thread is replies only — the switch reads off, no work row shows and no work page is
    read
  - Turn Show work on — the work between the two replies is one collapsed block in order, its task chip showing and
    its rows not; a worker's own tool call stays in its timeline
  - Open the work and one tool call's detail — by keyboard, focus stays on each control, the detail loads on demand
    and markup in it reads as text
  - New work arrives live without redrawing the thread — the daemon's change notice brings the new row and the
    earlier reply keeps its node
  - Show work stays as set on this device — a reload keeps it on, and turning it off returns the thread to replies
    only
  - Open a worker's timeline from Tasks & progress — a right drawer on desktop, a bottom sheet on a phone, with the
    worker's state, task and its own newest rows first
  - The timeline follows the worker live — the daemon's change notice brings the worker's new row to the top
  - Close the timeline back to its worker row — Escape closes it and focus returns to the row's Timeline control
  owner_groups:
  - commander_runtime
  - commander_dependencies
  owners:
  - hub-web/src/work-events.ts
