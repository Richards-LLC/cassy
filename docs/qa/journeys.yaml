    check: 'Walk HUB-J7 in hub-web/e2e/journeys/answer-ask.journey.ts; verify the expected experience and edge paths
      in docs/qa/journeys.md against the rendered UI and protocol-double state. Gaps: none'
  HUB-J7-REAL-ASK-OPTIONS:
    statement: A real operator ask carries its options through queue, live frames and history to the phone; one tap returns exactly one verified answer linked to that ask.
    check: Run HUB-J7 in hub-web/e2e/journeys/real-hub.journey.ts against the candidate binary; verify both choices live and after reload, then read the real queue for exactly one answer with the ask's in_reply_to reference and reload the chosen answer.
    bug:
      task: cas-7ebc
  HUB-J8-GOAL:
    statement: I work on the other machine, and my draft on the first is still there when I return
    check: 'Walk HUB-J8 in hub-web/e2e/journeys/switch-machines.journey.ts; verify the expected experience and edge
