    check: Run hub::server::launch_tests::machine_hub_launch_does_not_inherit_its_originating_project_store. This is defensive environment isolation; production did not carry CAS_ROOT in the cas-dd2e incident.
    bug: {task: cas-dd2e}
  HUB-J13-STARTUP-WAKE:
