bug_families:
  expired-toast-announcement:
    title: Expired connection notices must leave an empty live region while subsequent notices still announce
    tasks: [cas-326e8]
    invariants: [HUB-J9-GOAL]
    journeys: [HUB-J9]
  deferred-session-startup:
    title: A deferred startup wake must retry after pane readiness instead of remaining hidden by its transport claim
    tasks: [cas-dd2e]
    invariants: [HUB-J13-GOAL, HUB-J13-STARTUP-WAKE]
    journeys: [HUB-J13]
  cross-project-session-launch:
    title: A machine hub's originating store must not override the project selected for New session
    tasks: [cas-dd2e]
    invariants: [HUB-J13-GOAL, HUB-J13-LAUNCH-STORE]
    journeys: [HUB-J13]
  null-label-reply-receipt:
    title: Null live labels normalize before durable receipt; queued browser writes survive load and batch without losing receipt fences, draining pending replay across attaches
    tasks: [cas-c641]
    invariants: [HUB-J3-GOAL, HUB-J12-GOAL]
    journeys: [HUB-J3, HUB-J12]
  clean-home-launch-remedies:
    title: Clean-home readiness must preserve Claude and Codex login remedies while explicit unknown accounts still refuse
    tasks: [cas-a1bc]
    invariants: [HUB-J13-GOAL]
    journeys: [HUB-J13]
  recovered_session_attention:
    title: Dead daemon viewers close, catalog-gap retries re-subscribe, and fresh replacement sessions retire outage attention while retaining history
    found: '2026-10-27'
    fixed_by: [b8b8d0d234daa7f6ce565138ff5a61ae45288f95]
    tasks: [cas-d53c, cas-9e46]
    invariants: [HUB-J11-GOAL, HUB-J11-DEVICE-ATTACHMENT]
    journeys: [HUB-J11]
  read-only-pairing-dead-end:
    title: A read-only pairing told the person holding the phone to run a CLI command, and its composer looked writable
    tasks: [cas-b7c0]
    invariants: [HUB-J2-GOAL]
    journeys: [HUB-J2]
  second-person-pairing-code:
    title: The pairing-code dialog assumed the phone's owner was at the machine; a second person had no way to send the code on
    tasks: [cas-a56c]
    invariants: [HUB-J1-GOAL]
    journeys: [HUB-J1]
  pairing-code-rate-limit-refusal:
    title: When the relay rate-limited code creation, the dialog said only that the service refused, with no cause or next step
    tasks: [cas-310f]
    invariants: [HUB-J1-GOAL]
    journeys: [HUB-J1]
journeys:
- id: HUB-J1
  name: First open and pair a machine with a code
  status: live
  kind: commander
  entry:
    url: /commander/
    trigger: '`/commander/` in a browser that has never paired a machine'
  steps:
  - Open Cassy Commander for the first time — the empty state explains what to do
  - Ask for a pairing code — "Pair a machine", then "Create pairing code" shows `cas hub authorize <code>`
  - 'Approve on the machine — the dialog follows the machine: waiting, claimed, authorized'
  - Confirm and pair this browser — enter the operator label, then press Pair
  - See the machine's supervisor ready to talk to — a toast says the machine is connected without covering the composer
    or any heading, and its row opens a conversation that says, in plain words, "No messages from the cas-src supervisor
    in this session yet — nothing is waiting on you"; the card offers no other view, and the header carries Raw
    output and "Interrupt the cas-src supervisor"
  owner_groups:
  - commander_runtime
  - commander_dependencies
  owners:
  - hub-web/src/pair*.ts
  - hub-web/src/pending-pairing.ts
  - hub-web/src/storage.ts
  - hub-web/src/first-connection.ts
  - hub-web/src/conversation-shell.ts
  - hub-web/src/paired-machines.ts
  - hub-web/src/connection.ts
  - hub-web/src/dpop.ts
  - hub-web/e2e/journeys/pair-code.journey.ts
  - hub-web/e2e/journeys/pairing-deadline.journey.ts
  - hub-web/e2e/journeys/responsive-goals.ts
  - hub-web/src/abort-signals.ts
  - hub-web/src/app-switcher.ts
  - hub-web/src/artifact-open.ts
  - hub-web/src/attachment-sheet.ts
  - hub-web/src/browser-label.ts
  - hub-web/src/browser-support.ts
  - hub-web/src/catalog-refresh.ts
  - hub-web/src/commander-journal.ts
  - hub-web/src/connection-diagnostics.ts
  - hub-web/src/connection-state-view.ts
  - hub-web/src/connection-state.ts
  - hub-web/src/conversation-history.ts
  - hub-web/src/conversation-list.ts
  - hub-web/src/conversation-store.ts
  - hub-web/src/conversation-view.ts
  - hub-web/src/dormant-visibility.ts
  - hub-web/src/event-recovery.ts
