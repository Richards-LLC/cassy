- id: HUB-J12
  name: Switch networks without losing the conversation
  status: live
  kind: commander
  entry:
    url: /commander/
    trigger: 'an open conversation on a phone or laptop that changes network: local network to Tailscale, Tailscale
      off and on, Wi-Fi to cellular, sleep and wake'
  steps:
  - Open the conversation — the thread is live over the machine socket
  - The route changes under the page — the sockets reset and are replaced within seconds; a message sent then goes
    out once
  - Tailscale goes off, then on again — no browser event says so; after two unanswered heartbeats the header, row,
    footer and Tasks panel all say Unsteady ("Connection unsteady — checking…"), never "Degraded", and a message
    written then waits in the thread instead of going into the dead socket; once the dead socket is noticed everything
    says Reconnecting and the composer uses the banner's words; within 15 s of Tailscale returning it is Live again
    without a reload, and the waiting messages go out once each, in order, and are delivered. If the heartbeats
    answer again before that, a message held while unsteady goes out once without a reconnect
  - Wi-Fi hands over to cellular — going offline says Reconnecting at once; a message written meanwhile waits; coming
    online reconnects within 5 s and sends it once
  - The page wakes on a half-open socket — waking checks the socket and replaces it within seconds, well before
    the heartbeat would notice; a message then goes out once
  - The session's daemon link drops for a moment — the hub is reachable but cannot reach the session's daemon, so
    it refuses the send as retryable (upstream_unavailable); the message waits in the thread instead of reading
    "Not sent", and goes out once when the session is live again; while the link stays down the page retries with
    a growing pause (about 1, 2, 4, then 8 s), and past the two-minute hold the message reads Not sent with Retry
    ("The session didn't come back while it waited."), never "re-pair this device" or "will go out by itself"; meanwhile
    the banner reads "Reconnecting to <project>… <machine> is still connected." and the footer stays Connected ("Lost
    connection to <machine>" is kept for a real machine drop)
  - A proof refused after a switch retries on its own — the hub refuses the first proofs after a switch as stale
    (a 401 that names its reason); they are retried with a fresh proof, and a proof refused twice backs off like
    a lost network; it is Live again by itself, a message goes out once, and nothing asks to re-pair. Only a definitive
    refusal (revoked, unknown key) shows re-pair
  - On a legacy socket, a second message sent before the refusal arrives waits too — a hub without the machine protocol
    stops reading a session's socket once it refuses a send, so a message written before that refusal reached the
    page is held with the first; both go out once, in order, when the session is back; and once the session has
    stayed live for 10 s, the next drop retries after about 1 s again, receipt or not
  - A revoked pairing says so and offers Re-pair, on a phone too — a definitive refusal shows "Needs pairing", the
    banner says the machine needs pairing again instead of "Reconnecting…", the rail card is headed "Machine needs
    pairing", and the banner carries a Re-pair control (44 px on a phone) that opens pairing; a message waiting
    to send reads Not sent ("<machine> needs pairing again. Re-pair <machine>, then retry.") with Retry, and one
    already sent without a receipt reads Not confirmed, never Sending…
  - 'The whole machine drops, then returns — while it retries, the banner alone tells it ("Lost connection to <machine>.
    Reconnecting…"): no Attention card in transport terms ("Reconnecting to hub", "Stuck dialing", heartbeat counts),
    and no control toast over the conversation; a card appears only for a failure that will not retry, worded like
    the banner. While it is down the header''s Interrupt says "Interrupt and raw output return when it reconnects";
    once it is back, control this browser held is taken back by itself (unless another device took it), Interrupt
    is available again, and no "Control released" notice is left on screen or to a screen reader. A refused pairing
    leaves no "connection dropped" notice: Interrupt and Raw output say "Re-pair it to interrupt the supervisor
    or read its raw output" through later heartbeats, and a press interrupts nothing'
  - Reload while the whole machine is unreachable — within a second the list shows the conversations it last knew
    and the last one reopens with its held message, never "0 conversations"; once the machine answers, the same
    conversation attaches and the message goes out once (cas-9846)
  - The machine stays down past its catalog's freshness — with both machines offline, the list keeps both supervisors
    as last known and the footer says "2 conversations, last known" (cas-6c7a)
  - Both machines reconnect — both rows and the full conversation count return to live
  - The machine stays down past its catalog's freshness — with only Atlas offline and Studio live, both Atlas conversations
    are last known and the footer says "2 conversations · 1 last known" (cas-c552)
  - Atlas reconnects — both rows and the full conversation count return to live
  - The machines answer with no live supervisors — the list is empty and the footer says "0 conversations"
