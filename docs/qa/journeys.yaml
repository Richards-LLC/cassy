  - Revoke it after confirming — Revoke… asks to revoke every grant for the task; confirming says how many were
    removed
  - A pairing without factory:manage — Write access… is disabled and its accessible description names the shared
    "Not allowed on this pairing" lead, its Stop and restart workers and sessions permission, and the Paired machines
    re-pair command; Paired machines shows Needs before Also needed and has no disabled Stop and restart button.
