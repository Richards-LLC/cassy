- id: HUB-J5
  name: Reply by typing
  status: live
  kind: commander
  entry:
    url: /commander/
    trigger: an open conversation with a live supervisor
  steps:
  - Open the conversation — the composer names the supervisor
  - Write and send — the message appears at once as "Sending…" and the composer clears
  - See it delivered — the hub's receipt turns "Sending…" into "Delivered" with a check
  - See it answered — the supervisor's reply arrives under it and "Delivered" steps aside
  - A refused message says why — "Not sent", a plain reason and the next step on the message, said once (the composer
    only points at it); the list does not preview it as said
  - A refused Take control keeps focus on the message — when another device holds the session the take is refused;
    the message names the device in control, once, in plain words, and the composer only points at it; its Take
    control reads "Waiting for <device>" and is not pressable until that device releases control, then comes back
    on its own; keyboard focus stays on it, never the page body
  - Take control from the message, then retry — the refused message carries the Take control its refusal names (the
    conversation header has none); once control is taken it drops Take control and says Retry will send it, its
    actions are 44px targets on a phone, and Retry then sends it
  - Dismiss a refused message and bring it back — Dismiss (the corner ×, by keyboard or mouse) or a sideways swipe
    on a touch screen takes the refused message out of the thread; the composer stops pointing at it and the list
    stops previewing it; a "1 unsent message" chip (a 44px target on a phone) brings it back with Edit and Retry,
    focus landing on Retry; a short swipe settles back, and under reduced motion a swipe dismisses at once with
    no slide
  - Edit and resend retires the refused message — it collapses to "Not sent · replaced by your edit" with no Retry
  - A late receipt after the supervisor talks on never offers Retry — the supervisor's turn crosses the send and
    the receipt comes 3.4 s later; the message goes from "Sending…" to delivered without ever showing "Not confirmed"
    or Retry, and it is sent once
  - A message Cassy can't confirm offers Retry — with no receipt, 5 seconds after the supervisor talks on (or 15
    seconds after the send) "Sending…" gives way to "Not confirmed · Cassy couldn't confirm delivery to <supervisor>.
    Retry sends it again."; the retry goes out and is delivered
  - Not confirmed settles once the supervisor replies after it — a supervisor turn that arrives after the give-up
    turns the card into "Not confirmed · The supervisor has replied since; send it again only if it missed this."
    with no Retry, so nothing invites a duplicate send; a quiet underlined "Send again" resends it without retyping
  - Focus on the opening card moves into the conversation — with keyboard focus on the connection card's Details
    while a slow relay opens the conversation, focus lands in the composer when the conversation replaces the card,
    never the page body; focus elsewhere (the list search) stays where it is
