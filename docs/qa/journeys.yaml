    hidden inside it); twelve Tabs stay inside the modal sheet, each moving to a new stop and wrapping from Details
    to Close; focus on Dismiss stays there across a 5 s heartbeat; with a notice's Details open, Copy occupies its
    own row above the full raw diagnostic at390 and1280px; with Copy focused, a minute crossing keeps them, and
    so does a ten-minute wake that rebuilds the page (cas-f486); the conversation behind it is inert
