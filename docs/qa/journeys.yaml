- id: HUB-J7
  name: Answer a question in the thread
  status: live
  kind: commander
  entry:
    url: /commander/
    trigger: an open conversation where the supervisor asks a question with choices
  steps:
  - Open the conversation — the thread is live
  - 'A question from an ended session does not wait — the previous session''s unanswered question is not in this
    session''s thread: it sits in a collapsed "Earlier session patient-pelican-8" section with no choices, said
    by patient-pelican-8 (its own supervisor); nothing is pinned and the context rail lists only the live blocker'
  - 'The supervisor asks a question — the full question and its choices stay in the thread, and a compact bookmark
    above the composer points to it without duplicating the question or its choices; the machine''s earlier blocker,
    stamped by a clock that runs ahead and carrying no session, is this session''s own turn: it sits above the question
    at its arrival time, labelled by this session''s supervisor, with no "session … started" line below it, and
    is marked "machine clock ahead"'
  - Answer with one tap — the pin clears, the thread records the chosen answer, and nothing is left waiting in the
    context rail, even when the machine's clock runs ahead; the answer shows the time it was sent, under today
  - See the supervisor act on the answer — the reply follows, and a new blocker after the answer waits
  - 'Jump to a long question and dismiss its bookmark — the supervisor posting an FYI and a status update leaves
    the question waiting with its choices in the thread; its compact bookmark says "Waiting on you: open the PR
    to main and cut a release?" and carries no choices; on a phone (390px, dark), focusing the composer keeps the
    bookmark 44–48px tall, and with the keyboard up (about 440px of page) at least three lines of the conversation
    stay readable; a tap jumps to and focuses the full question without expanding a duplicate card; a swipe dismisses
    the bookmark, and its copy in the thread says "Dismissed. You can still answer here." and keeps its choices'
  - 'Reply to a machine a day ahead — no future day header: the machine''s turn sits under Today at its arrival
    time, marked "machine clock ahead", and the reply shows the time it was sent below it, with no session line
    between them'
  - Reopen the page — minutes later, the thread rebuilt from history keeps every turn where the visit showed it
    and at the same time (not the reload's), in the machine's order, under Today, with times reading in order
  - 'The supervisor answers live — a separate part on a machine whose clock runs five minutes ahead, which nothing
    in the thread has shown yet: the answer shows its arrival, unmarked, and its row reads "now"'
  - Reload three minutes later — the answer shows the same time and still no mark, exactly as the visit showed it
