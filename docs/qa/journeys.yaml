# Commander registry: stable journey metadata and file ownership.
# Keep docs/qa/journeys.md as the detailed narrative and semantic selector input.
# Header policy is authoritative; local qa.registry.enforce is fallback only.
# A delivery uses the stricter policy at base and head.
version: 1
updated: '2026-10-26'
selection: legacy_catalog
enforce: enforce
seeded_from:
- docs/qa/journeys.md (HUB-J1–HUB-J21, curated steps/goals/gaps)
- scripts/journeys-for-diff.py (static import closure; CSS/main/fixture hunk selector)
- cas qa journeys --seed (1693 route candidates; replaced by existing stable catalog IDs)
ignore:
- hub-web/dist/**
- hub-web/src/**/*.test.ts
- hub-web/src/**/*.spec.ts
surfaces:
- hub-web/src/**
- hub-web/index.html
- hub-web/package.json
- hub-web/vite.config.ts
owner_groups:
  commander_runtime:
    description: Shared Commander shell, runtime/build inputs and protocol fixtures. Semantic selection narrows
      CSS, composition and fixture hunks.
    globs:
    - hub-web/src/main.ts
    - hub-web/src/styles.css
    - hub-web/src/types.ts
    - hub-web/src/terminal*
    - hub-web/index.html
    - hub-web/package-lock.json
    - hub-web/vite.config.ts
    - hub-web/e2e/journeys/hub-double.ts
    - hub-web/e2e/journeys/journey.ts
    - hub-web/e2e/journeys/clock.ts
    - hub-web/e2e/journeys/world.ts
    - hub-web/playwright.config.ts
    - hub-web/package.json
    - hub-web/tsconfig.json
    - hub-web/e2e/tsconfig.json
  commander_dependencies:
    description: Static dependencies shared by every catalog journey at the curated revision.
    globs:
    - hub-web/e2e/journeys/receipt-directory.mjs
    - hub-web/src/cloud-brand.ts
    - hub-web/src/render-model.ts
    - hub-web/src/usage.ts
invariants:
  HUB-J1-GOAL:
    statement: my machine's supervisor appears and I can open its conversation
    check: 'Walk HUB-J1 in hub-web/e2e/journeys/pair-code.journey.ts; verify the expected experience and edge paths
      in docs/qa/journeys.md against the rendered UI and protocol-double state. Gaps: the relay and the machine-side
      `cas hub authorize` are doubled; real pairing is proven by `docs/design/hub-web/pairing-verification.md`'
  HUB-J2-GOAL:
    statement: the link pairs this browser and I reach the supervisor
    check: 'Walk HUB-J2 in hub-web/e2e/journeys/pair-link.journey.ts; verify the expected experience and edge paths
      in docs/qa/journeys.md against the rendered UI and protocol-double state. Gaps: the exchange endpoint is doubled'
  HUB-J3-GOAL:
    statement: I can tell which conversation has something new and get to it quickly
    check: 'Walk HUB-J3 in hub-web/e2e/journeys/find-conversation.journey.ts; verify the expected experience and
      edge paths in docs/qa/journeys.md against the rendered UI and protocol-double state. Gaps: none'
    bug:
      task: cas-7c14
  HUB-J4-GOAL:
    statement: I can read what was said before, back to the start
    check: 'Walk HUB-J4 in hub-web/e2e/journeys/read-history.journey.ts; verify the expected experience and edge
      paths in docs/qa/journeys.md against the rendered UI and protocol-double state. Gaps: history pages come from
      the double; real rows are covered by `hub-web/scripts/conversation-history-qa.mjs`'
  HUB-J4-VISUAL-SANDBOX:
    statement: A supervisor's HTML page shows inline and in its own tab, and a hostile page can't run script, reach Commander's storage, leave its frame or call out to another host
    check: 'Run the cas-3aff parts of hub-web/e2e/journeys/read-history.journey.ts at desktop and phone, whose double serves the policy file the hub embeds, and the hub route test visual_reply_page_is_ticketed_sandboxed_and_serves_only_passive_assets. Threat model: docs/design/hub-web/visual-replies-threat-model.md.'
  HUB-J5-GOAL:
    statement: my message reaches the supervisor and I see its answer
    check: 'Walk HUB-J5 in hub-web/e2e/journeys/reply-typed.journey.ts; verify the expected experience and edge
      paths in docs/qa/journeys.md against the rendered UI and protocol-double state. Gaps: delivery by a running
      daemon and operator stamping are doubled'
  HUB-J5-SEND-WITHOUT-PANE-LEASE:
    statement: A message-only pairing sends without a pane input lease and never gains raw terminal input authority
    check: 'Run hub::server::upstream_unavailable_tests and the HUB-J5 message-only/Send again journey parts;
      verify semantic messages reach the authenticated upstream and raw Input is still forbidden.'
    bug: {task: cas-d402}
  HUB-J5-RECEIPT-STAGES:
    statement: A send never regresses across reload or paired devices; Queued means durable acceptance, Delivered requires actual transport proof, and a connected machine is never called unreachable because its supervisor has not taken the message.
    check: Send through a real candidate hub and compare live, reloaded and peer-device status with the queue's transport_delivered_at; retain queue-only and actual-delivery evidence separately. Run the correlated history/receipt model and real enqueue-to-history regressions, and HUB-J5/HUB-J12 without inferring supervisor execution from a receipt.
    bug:
      task: cas-3f40
  HUB-J5-ANSWER-MONOTONIC:
    statement: Replaying a delivery receipt keeps an answered message answered while reply history rebuilds
    check: 'Run the receipt regression in hub-web/src/conversations.test.ts: answer a send, remove its reply
      event, replay the journal receipt through synchronizePending, and assert that the send remains replied.'
    bug: {task: cas-1b57}
  HUB-J6-GOAL:
    statement: I speak my reply, check it, and send it
    check: 'Walk HUB-J6 in hub-web/e2e/journeys/reply-voice.journey.ts; verify the expected experience and edge
      paths in docs/qa/journeys.md against the rendered UI and protocol-double state. Gaps: speech recognition is
      stubbed; a real microphone and recognizer are not exercised'
  HUB-J7-GOAL:
