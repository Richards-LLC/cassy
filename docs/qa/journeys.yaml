  name: Find the conversation that needs me
  status: live
  kind: commander
  entry:
    url: /commander/
    trigger: '`/commander/` with two paired machines, each running one supervisor'
  steps:
  - See every machine's supervisors in one list — every row is titled by its project, then its machine, with the
    supervisor codename beneath
  - Each row's time is its own session's activity — lighthouse reads "3h" and its row is named with "3 hours ago";
    no time is a catalog check, and across a catalog poll none turns "now" or runs backwards
  - Notice a new reply while away — before opening it, the row shows an unread count and the reply's first line
  - Open the conversation, then notice its next reply — opening clears the unread count; a later reply while away
    brings it back
  - Find the conversation through the list search — "Search conversations (Ctrl K)" at the top of the list filters
    rows by project, machine or supervisor; the row Enter opens is marked ("Enter ↵") and is the field's active
    descendant; opening a result clears the search and brings the whole list back; the header names the project
    once
  - 'Find the conversation from the keyboard — Ctrl+K lands in the search, type the project, Enter: the conversation
    is open and the reply box has focus'
  - An empty thread's card also leads with the project, with machine and codename beneath it
  - A 40-character machine name ellipsises in its row and never runs under the time stamp, on desktop and at 390px
  - Jump to a supervisor by name — the command palette ("Type a command or conversation"; grouped Conversations
    / Machines / Appearance / Advanced, the same groups with a conversation open, Advanced collapsed and holding
    only the dormant-session switch; "Dismiss all info" only when something is outstanding) filters by supervisor
    or project and opens the conversation; each "Jump to" row leads with the project, the codename first in its
    description (right of the title on a desktop, on the line beneath on a phone); a filter that matches nothing
    says "No commands or conversations match"; the command Enter runs is marked and is the filter's active descendant
    ("light" marks "Jump to lighthouse")
  - 'Jump to a supervisor from the keyboard — Ctrl+K twice opens the palette, type the name, Enter: the palette
    closes, the conversation is open and the reply box has focus'
  - Open Paired machines from the palette, then a conversation — the palette gives way to Paired machines and stays
