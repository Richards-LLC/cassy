  HUB-J15-NOTICE-PERSISTENCE:
    statement: Attention notices are acknowledged only after durable storage, drain across batches, and stay drained after reconnect; conversation receipts are separate.
    check: Run the HUB-J15 pending-notice reconnect part and read back attention storage, notice receipt IDs, and pending rows; verify daemon/store provenance fences with their Rust tests.
