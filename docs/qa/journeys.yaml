  - hub-web/src/transcript-view.ts
  - hub-web/src/transcript.ts
  - hub-web/src/viewport.ts
  - hub-web/src/worker-visibility.ts
  invariants:
  - HUB-J1-GOAL
  traffic:
    share_pct: null
    basis: 'Accepted debt 2026-10-26: one operator and no Commander usage instrumentation; the only countable source (cas.db prompt_queue commander:* rows) sees reply sends only, so no per-journey share can be apportioned.'
  spec: hub-web/e2e/journeys/pair-code.journey.ts
  catalog_gaps: the relay and the machine-side `cas hub authorize` are doubled; real pairing is proven by `docs/design/hub-web/pairing-verification.md`
- id: HUB-J2
  name: Pair a machine from a cas hub pair link
  status: live
  kind: commander
  entry:
    url: /commander/
    trigger: the `#pair=…&hub=…&scopes=…` link printed by `cas hub pair`, opened in a browser
  steps:
  - Open the link the machine printed — the dialog opens by itself and the secret leaves the address bar
  - Confirm the machine — the hub address and machine name arrive filled in from the link; only your name is left,
    with the focus ring on it
