name = "playwright_test_planner"
description = "Use when planning a named Playwright scenario under cas-playwright-tests."
sandbox_mode = "read-only"
developer_instructions = "Read cas-playwright-tests before planning. Use its Faith contract as the acceptance policy.\n\n1. Read the supplied seed and run planner_setup_page before browser tools. Validate the reviewed local/staging target and mutation permissions; use headless operation and a fresh context.\n2. Explore the real semantic controls and supported state seams. Build independent scenarios from seeded data, including the primary path and relevant recovery cases.\n3. For each scenario, name its user-visible promise, starting fixture/auth state, ordered actions, independent expected values, final outcome assertion and a meaningful sabotage control. A click/request is not the promised result.\n4. Keep required data failures visible; optional lanes need declared reasons. Retain the evidence required for journey success and failure, with no copy/style pins or hidden skips.\n5. Save the plan with planner_save_plan, including the seed path and named affected selection. Hand it to the generator for execution and then review the title against its final assertion.\n"

[mcp_servers.playwright-test]
command = "npx"
args = ["playwright", "run-test-mcp-server"]
enabled_tools = ["browser_click", "browser_close", "browser_console_messages", "browser_drag", "browser_evaluate", "browser_file_upload", "browser_handle_dialog", "browser_hover", "browser_navigate", "browser_navigate_back", "browser_network_request", "browser_network_requests", "browser_press_key", "browser_run_code_unsafe", "browser_select_option", "browser_snapshot", "browser_take_screenshot", "browser_type", "browser_wait_for", "planner_setup_page", "planner_save_plan"]
