<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Cassy</title>
  <!-- Three interlocking ribbons traced from docs/assets/cassy-logo.png: white, pale aurora blue and aurora teal on the violet Send tile (look-send). One asset for every scheme. -->
  <defs>
    <linearGradient id="cassy-tile" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7656FA"/>
      <stop offset=".55" stop-color="#5B3FE0"/>
      <stop offset="1" stop-color="#3E5BEA"/>
    </linearGradient>
    <radialGradient id="cassy-sheen" cx="140" cy="60" r="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".28"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cassy-blue" x1="300" y1="250" x2="470" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E6ECFF"/>
      <stop offset="1" stop-color="#A9C2FF"/>
    </linearGradient>
    <linearGradient id="cassy-teal" x1="226" y1="400" x2="470" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#B8F5EA"/>
      <stop offset="1" stop-color="#6FE0D0"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="114" fill="url(#cassy-tile)"/>
  <rect width="512" height="512" rx="114" fill="url(#cassy-sheen)"/>
  <g transform="translate(256 258) scale(1.2) translate(-345 -385)">
