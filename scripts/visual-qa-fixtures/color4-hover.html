<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { margin: 0; padding: 24px; font: 16px/1.5 Arial, sans-serif; background: white; color: rgb(27, 29, 36); }
  .tray { padding: 16px; background: rgb(127, 85, 4); }
  button { padding: 12px; border: 0; font: inherit; color: inherit; background: white; }
  /* cas-6e3a's settled Send for review hover, measured against screenshot pixels. */
  button:hover { background: color(srgb 0.865098 0.855686 0.838275); }
  #low-contrast { padding: 12px; color: rgb(221, 218, 214); background: color(srgb 0.865098 0.855686 0.838275); }
</style>
<div class="tray">
  <button id="review">Send for review</button>
  <p id="low-contrast">A genuinely low contrast control.</p>
</div>
</html>
