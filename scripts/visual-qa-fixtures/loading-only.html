<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Loading application</title>
<style>
  body { margin: 0; background: white; color: black; font: 16px sans-serif; }
  #app { min-height: 100vh; display: grid; place-items: center; }
  .spinner { width: 32px; height: 32px; border: 4px solid #ddd; border-top-color: #333; border-radius: 50%; }
</style>
<div id="app" aria-busy="true"><div class="spinner" role="progressbar" aria-label="Loading"></div></div>
</html>
