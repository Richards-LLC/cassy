<!doctype html>
<html lang="en" data-pricing-js>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pending price scanner repro</title>
  <style>
    body { margin: 24px; font: 16px/1.5 sans-serif; color: #111; background: #fff; }
    .pricing-card--priced { margin: 24px 0; padding: 16px; border: 1px solid #111; }
    .plan-price { position: relative; }
    .pricing-price-placeholder { display: none; }
    html[data-pricing-js] .pricing-page[data-pricing-client-pending] .plan-price > :not(.pricing-price-placeholder),
    html[data-pricing-js] .pricing-page[data-pricing-client-pending] .plan-highlight { visibility: hidden; }
    html[data-pricing-js] .pricing-page[data-pricing-client-pending] .pricing-price-placeholder {
      display: inline; position: absolute; color: #111;
    }
  </style>
</head>
<body>
  <main class="pricing-page" data-pricing-client-pending>
    <h1>Plans</h1>
    <section class="pricing-card--priced">
      <h2>Solo</h2>
      <div class="plan-price"><span class="pricing-price-placeholder" aria-label="Loading">—</span><span>$7.00*</span><span>/first month</span></div>
      <p class="plan-highlight">Then $29.00/month after your first month</p>
    </section>
    <section class="pricing-card--priced">
      <h2>Pro</h2>
      <div class="plan-price"><span class="pricing-price-placeholder" aria-label="Loading">—</span><span>$7.00*</span><span>/first month</span></div>
      <p class="plan-highlight">Then $99.00/month after your first month</p>
    </section>
  </main>
</body>
</html>
